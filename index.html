<script id="ch05-case-datadog-nrr">
chapter({part:"Part VII · Case Practice", id:"case-datadog-nrr", num:"05", title:"Case: Datadog NRR Dipped Two Points. Why, and What Now?", mins:22, tag:"Case · Datadog · SaaS", html:`
<p>This is the first full practice case in the handbook. It is a classic <b>metric-diagnosis</b> prompt for a usage-based SaaS company, and it is close to a real situation: in 2026 Datadog disclosed that its largest customer, part of its AI-native cohort, reduced usage starting in Q3. Work it the way you would in a 30 to 45 minute interview: clarify, structure, ask for data, do the math, recommend. Attempt each step before opening the model answer.</p>

<div class="callout"><span class="lbl">The prompt (illustrative)</span>"You are on the Datadog Strategy &amp; Operations team. Trailing-12-month net revenue retention (NRR) for the quarter just closed came in about two points lower than last quarter. The CFO wants to know why, whether it will keep falling, and what we should do. You have 30 minutes."</div>

<h3>Step 0 · What the real company looks like</h3>
<p>Ground yourself in the actual business before you structure. Figures below are as reported for Q3 2026 (quarter ended Sept 30, 2026); retention figures are given by Datadog as bands, not exact numbers.</p>
<table>
<tr><th>Metric (Q3 2026)</th><th>Reported value</th><th>What it tells you</th></tr>
<tr><td>Revenue</td><td>$1.197B, up about 35% Y/Y</td><td>Growth is strong overall, so an NRR dip is about mix and concentration, not collapse</td></tr>
<tr><td>Trailing-12-month NRR</td><td>"low 120%s" (about 120% through 2025)</td><td>Existing customers spend roughly a fifth more each year</td></tr>
<tr><td>Gross revenue retention</td><td>"mid to high 90s%"</td><td>Very little revenue is lost to logo churn; contraction matters more than churn</td></tr>
<tr><td>Customers / $100K+ ARR customers</td><td>about 33,500 / about 4,860 (up 20%)</td><td>$100K+ customers drive about 91% of ARR: revenue is concentrated</td></tr>
<tr><td>Remaining performance obligations</td><td>$3.85B, up 38%</td><td>Committed future revenue still growing: a leading indicator against panic</td></tr>
<tr><td>Q4 2026 revenue guide</td><td>$1.19B to $1.20B (25% to 26% Y/Y)</td><td>Guide assumes the largest customer spends only its contractual minimum</td></tr>
</table>
<p style="font-size:12.5px;color:var(--muted)">Sources: Datadog Q3 2026 8-K (Ex. 99.1) and Q2/Q3 2026 10-Q filings; call commentary as summarized by sec-api.io. Links in the Changelog entry for 2026-11-15.</p>

<h3>Step 1 · Clarify before you structure</h3>
<p>Spend the first two minutes on questions that could change the whole answer. Strong candidates ask:</p>
<ul>
  <li><b>Definition:</b> Is NRR computed on ARR or recognized revenue? Datadog defines it as trailing-12-month revenue from a cohort of customers versus the same cohort a year earlier, so it is a <i>lagging, smoothed</i> number.</li>
  <li><b>Scale of the move:</b> Two points on a base near 120%, in one quarter. Is this outside normal quarter-to-quarter noise?</li>
  <li><b>Breadth:</b> Is it broad-based or concentrated in a few accounts, a segment, a region, or a product?</li>
  <li><b>Known events:</b> Any pricing change, packaging change, big renewal, or customer migration this quarter?</li>
  <li><b>Measurement:</b> Did the cohort definition, FX treatment, or customer roll-ups (parent and subsidiary accounts) change?</li>
</ul>

<h3>Step 2 · Structure: the NRR bridge</h3>
<p>NRR is an identity, so start with a math split (MECE by construction), then go qualitative inside each branch.</p>
<pre><code>NRR = (Starting cohort revenue + Expansion - Contraction - Churn) / Starting cohort revenue

Change in NRR = change in expansion rate - change in contraction rate - change in churn rate</code></pre>
<table>
<tr><th>Branch</th><th>What drives it at a usage-based company</th><th>Data to request</th></tr>
<tr><td><b>Expansion</b></td><td>More hosts, logs, traces and spans ingested; cross-sell of new products (security, LLM observability, cloud cost); price changes</td><td>Expansion $ by product and by segment; products per customer; new product attach rates</td></tr>
<tr><td><b>Contraction</b></td><td>Customers optimizing usage (sampling logs, cutting retention periods, dropping hosts), renegotiated rates, workload migration</td><td>Contraction $ by customer, top-20 movers, committed vs on-demand spend</td></tr>
<tr><td><b>Churn</b></td><td>Full loss of logos: tool consolidation, switch to open-source or a cloud-native tool, business failure</td><td>Logo and $ churn by segment, churn reasons from account teams</td></tr>
<tr><td><b>Measurement</b></td><td>Cohort or account-hierarchy changes, FX, one-time credits</td><td>Methodology changes this quarter vs last</td></tr>
</table>

<h3>Step 3 · The data comes back (illustrative)</h3>
<p>The interviewer hands you this table for the trailing-12-month cohort, indexed so that starting revenue is $1,000M. Before reading on, compute which branch explains the drop.</p>
<table>
<tr><th>Component ($M, trailing 12 months)</th><th>Last quarter</th><th>This quarter</th><th>Change (points of NRR)</th></tr>
<tr><td>Starting cohort revenue</td><td>1,000</td><td>1,000</td><td></td></tr>
<tr><td>+ Expansion</td><td>+290</td><td>+302</td><td>+1.2</td></tr>
<tr><td>- Contraction</td><td>-40</td><td>-70</td><td>-3.0</td></tr>
<tr><td>- Churn</td><td>-20</td><td>-22</td><td>-0.2</td></tr>
<tr><td><b>NRR</b></td><td><b>123.0%</b></td><td><b>121.0%</b></td><td><b>-2.0</b></td></tr>
</table>

<div class="diagwrap">
<svg viewBox="0 0 680 250" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
  <line x1="20" y1="210" x2="660" y2="210" stroke="#93a1b3" stroke-width="1"/>
  <rect x="40" y="74" width="80" height="136" fill="#1b232e" stroke="#f5a524" stroke-width="1.5"/>
  <rect x="170" y="74" width="80" height="7" fill="#f05252"/>
  <rect x="300" y="81" width="80" height="102" fill="#f05252"/>
  <rect x="430" y="142" width="80" height="41" fill="#3ecf8e"/>
  <rect x="560" y="142" width="80" height="68" fill="#1b232e" stroke="#f5a524" stroke-width="1.5"/>
  <g stroke="#93a1b3" stroke-dasharray="3,3"><line x1="120" y1="74" x2="170" y2="74"/><line x1="250" y1="81" x2="300" y2="81"/><line x1="380" y1="183" x2="430" y2="183"/><line x1="510" y1="142" x2="560" y2="142"/></g>
  <g fill="#e8eef5" text-anchor="middle">
    <text x="80" y="66">123.0%</text><text x="210" y="66">-0.2</text><text x="340" y="198">-3.0</text><text x="470" y="134">+1.2</text><text x="600" y="134">121.0%</text>
  </g>
  <g fill="#93a1b3" text-anchor="middle" font-size="11">
    <text x="80" y="230">Last quarter</text><text x="210" y="230">Churn</text><text x="340" y="230">Contraction</text><text x="470" y="230">Expansion</text><text x="600" y="230">This quarter</text>
  </g>
  <text x="660" y="245" fill="#93a1b3" font-size="10" text-anchor="end">Axis starts at 119% (illustrative)</text>
</svg>
</div>

<details><summary>Show model reading of the bridge</summary>
<p><b>Contraction explains more than the whole drop:</b> it took away 3.0 points; expansion actually improved by 1.2 points; churn was flat. So this is not a broad health problem (churn and expansion are fine), it is a <b>contraction</b> problem.</p>
<p><b>Next question:</b> is contraction broad or concentrated? Ask for the top contraction accounts. Suppose one AI-native customer accounts for $25M of the $30M increase in contraction. That single account is worth <b>2.5 points</b> of NRR. Excluding it, NRR would be about 123.5%, roughly flat to slightly up.</p>
<p><b>Why it may keep falling:</b> NRR is trailing 12 months, so a usage cut that started in Q3 rolls through the metric for four quarters. Even with no further cuts, the reported number can drift lower for the next few prints, then recover once the lower base is in the starting cohort.</p>
</details>

<h3>Step 4 · Size the risk and the upside</h3>
<div class="callout example"><span class="lbl">Worked example · concentration math</span>
<p>Illustrative: the customer was spending at a $100M annual run-rate and is moving to a $60M contractual minimum.</p>
<ul>
  <li><b>Revenue impact:</b> $40M annualized, about $10M per quarter. On a company doing about $1.2B per quarter, that is under 1% of quarterly revenue, and about 1 point of Y/Y growth (on a prior-year quarter near $0.9B) until the cut laps, because the comparison base still includes the higher spend.</li>
  <li><b>NRR impact:</b> $40M of contraction on a cohort base that, for illustration, is $4,000M of trailing revenue = <b>1.0 point</b> once fully rolled in. Different base sizes give different answers, so always state the base you used. (The Step 3 bridge was indexed to $1,000M for easy math; at real scale the base is several billion dollars, so the same dollars move NRR less.)</li>
  <li><b>Upside:</b> the customer renewed with a <i>higher</i> commitment. Commitment above current usage is future expansion that has been pre-sold. That is why the real company could report growing RPO (+38%) in the same quarter as a usage cut.</li>
</ul>
</div>

<h3>Step 5 · Recommendation</h3>
<details><summary>Show model recommendation</summary>
<p><b>Answer first (pyramid style):</b> "The two-point dip is almost entirely one large AI-native customer optimizing usage. Ex-that customer, retention is stable and expansion is improving. Expect the reported number to stay soft for about three more quarters as the cut laps through the trailing window. We should not change company strategy; we should change how we manage concentration risk."</p>
<ol>
  <li><b>Report it cleanly:</b> show NRR with and without the top account, and add a contraction bridge to the WBR so leaders see drivers, not just the headline.</li>
  <li><b>Guide conservatively:</b> plan large-customer revenue at contractual minimums, which is what the real Q4 2026 guide did.</li>
  <li><b>Reduce optimization risk:</b> proactive cost-optimization reviews for top accounts (help them sample logs smartly before they decide to cut a product), and multi-year commits with ramped minimums.</li>
  <li><b>Diversify expansion:</b> push attach of newer products across the broad $100K+ base so growth depends less on a handful of hyperscale AI customers.</li>
  <li><b>Monitor leading indicators:</b> weekly usage by top-50 account, committed vs on-demand mix, and RPO growth.</li>
</ol>
</details>

<h3>Common mistakes</h3>
<table>
<tr><th>Mistake</th><th>Better move</th></tr>
<tr><td>Jumping to "competition is stealing customers"</td><td>Run the bridge first; GRR in the mid to high 90s already argues against a churn story</td></tr>
<tr><td>Treating NRR as a point-in-time metric</td><td>Explain the trailing-12-month lag and when the dip will lap</td></tr>
<tr><td>Ignoring concentration</td><td>Always ask for top movers; one account can be worth several points</td></tr>
<tr><td>Recommending price cuts to win back usage</td><td>Usage cuts are about the customer's cost, not your list price; help them optimize and lock in commits</td></tr>
<tr><td>No numbers in the answer</td><td>Quantify the impact in points of NRR and dollars of revenue, with the base you used</td></tr>
</table>

<div class="callout tip"><span class="lbl">Interview pattern</span>Datadog interviews for strategy and finance-adjacent roles lean on SaaS metric fluency: NRR vs GRR, usage vs subscription revenue, commitments vs on-demand, and land-and-expand. Practice saying the NRR formula out loud and building the bridge in under two minutes.</div>

<div class="quiz" data-a="2">
  <div class="q">Self-check: Logo churn is flat, GRR fell about three points, and expansion dollars rose. Where should you dig first?</div>
  <button class="opt">Competitive losses of whole customers</button>
  <button class="opt">A list-price cut across all products</button>
  <button class="opt">Contraction among retained customers, starting with the largest movers</button>
  <button class="opt">New-logo bookings</button>
  <div class="exp">GRR counts churn and contraction but excludes expansion. With churn flat, a GRR drop points to retained customers spending less. New logos are not in the NRR cohort at all. Pull the top contraction accounts next.</div>
</div>

<div class="quiz" data-a="1">
  <div class="q">Self-check: A customer cut usage at the start of Q3. NRR is measured on a trailing-12-month basis. When does the impact stop pulling the reported number lower?</div>
  <button class="opt">Immediately in Q3</button>
  <button class="opt">After about four quarters, once the lower spend fully replaces the higher spend in both the cohort base and the trailing window</button>
  <button class="opt">Never; NRR permanently drops</button>
  <button class="opt">Only when the customer churns</button>
  <div class="exp">A trailing metric phases in a change gradually and laps it after roughly a year. That is why operators explain "the dip will persist for a few quarters, then lap."</div>
</div>
`});
</script>

<script id="ch06-driver-trees">
chapter({part:"Part II · Analytics & Metrics", id:"driver-trees-north-star", num:"06", title:"Driver Trees, KPI Trees and North Star Metrics", mins:18, tag:"Framework", html:`
<p>Every S&amp;O role eventually asks the same question in different words: "<b>the number moved. Why, and what do we do?</b>" Driver trees and KPI trees are how operators answer it fast and without hand-waving. A North Star metric is the top of that tree: the one number the whole business agrees to grow. This chapter shows how to build all three, how to decompose a metric move into volume, mix and rate, and how to avoid the classic traps (vanity metrics, Goodhart&#39;s law, double counting).</p>

<h3>Three related tools</h3>
<table>
<tr><th>Tool</th><th>What it is</th><th>Built from</th><th>Used for</th></tr>
<tr><td><b>Driver tree</b></td><td>A math decomposition of one output metric into the inputs that produce it</td><td>Identities: multiply (volume x price) or add (segment A + segment B)</td><td>Diagnosis ("why did bookings drop?"), forecasting, sensitivity analysis</td></tr>
<tr><td><b>KPI tree</b></td><td>A driver tree where each node has an owner, a target and a review cadence</td><td>Driver tree + org chart + OKRs</td><td>Operating cadence (WBR / QBR), goal setting, accountability</td></tr>
<tr><td><b>North Star metric</b></td><td>The single top-of-tree metric that best captures value delivered to customers and predicts long-run revenue</td><td>Strategy + customer value proposition</td><td>Alignment across teams, prioritization, trade-off decisions</td></tr>
</table>

<div class="callout tip"><span class="lbl">MENTAL MODEL</span>A driver tree is a <b>system block diagram for a business</b>. You already do this as a systems engineer: a vehicle-level requirement (range) decomposes into subsystem budgets (battery capacity, drag, auxiliary load). A revenue line decomposes the same way, and the leaves are the knobs teams can turn.</div>

<h3>How to build a driver tree (five rules)</h3>
<ol>
  <li><b>Start from an identity, not a brainstorm.</b> Revenue = orders x AOV x take rate is always true. "Revenue is driven by marketing and product quality" is not a tree; it is a list of opinions.</li>
  <li><b>Choose multiplicative or additive splits deliberately.</b> Multiply for rate x volume (users x frequency x basket). Add for segments (US + International, new + existing). Mixing them at the same level breaks MECE.</li>
  <li><b>Go down until a leaf is controllable.</b> Stop when one team can move the node with one lever (e.g. "conversion from menu view to checkout"). If a leaf has no owner, it is not done.</li>
  <li><b>Keep it MECE at every level.</b> Every child set must sum (or multiply) back exactly to its parent. Test it with real numbers: if the leaves do not reconcile to the top line within rounding, the tree is wrong.</li>
  <li><b>Attach data sources.</b> Each node should map to a table and a query. A tree you cannot populate in SQL is a slide, not a tool.</li>
</ol>

<h3>Example: a ride-hailing gross bookings tree</h3>
<div class="diagwrap">
<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
  <g stroke="#93a1b3" stroke-width="1.2" fill="none">
    <path d="M380,52 L190,92"/><path d="M380,52 L570,92"/>
    <path d="M190,132 L90,172"/><path d="M190,132 L290,172"/>
    <path d="M570,132 L470,172"/><path d="M570,132 L670,172"/>
    <path d="M90,212 L45,248"/><path d="M90,212 L135,248"/>
    <path d="M290,212 L245,248"/><path d="M290,212 L335,248"/>
  </g>
  <g fill="#1b232e" stroke="#f5a524" stroke-width="1.5">
    <rect x="290" y="14" width="180" height="38" rx="8"/>
  </g>
  <g fill="#1b232e" stroke="#4aa3ff" stroke-width="1.3">
    <rect x="110" y="92" width="160" height="40" rx="8"/><rect x="490" y="92" width="160" height="40" rx="8"/>
    <rect x="20" y="172" width="140" height="40" rx="8"/><rect x="220" y="172" width="140" height="40" rx="8"/>
    <rect x="400" y="172" width="140" height="40" rx="8"/><rect x="600" y="172" width="140" height="40" rx="8"/>
  </g>
  <g fill="#1b232e" stroke="#3ecf8e" stroke-width="1.2">
    <rect x="5" y="248" width="80" height="40" rx="7"/><rect x="95" y="248" width="80" height="40" rx="7"/>
    <rect x="205" y="248" width="80" height="40" rx="7"/><rect x="295" y="248" width="80" height="40" rx="7"/>
  </g>
  <g fill="#e8eef5" text-anchor="middle">
    <text x="380" y="38" font-weight="bold">Gross bookings</text>
    <text x="190" y="110">Trips</text><text x="190" y="125" font-size="10" fill="#93a1b3">(x)</text>
    <text x="570" y="110">Avg fare per trip</text><text x="570" y="125" font-size="10" fill="#93a1b3">(x)</text>
    <text x="90" y="190">Monthly active riders</text><text x="90" y="204" font-size="10" fill="#93a1b3">(x)</text>
    <text x="290" y="190">Trips per rider</text><text x="290" y="204" font-size="10" fill="#93a1b3">frequency</text>
    <text x="470" y="190">Product mix</text><text x="470" y="204" font-size="10" fill="#93a1b3">X / Comfort / Premium</text>
    <text x="670" y="190">Fare per product</text><text x="670" y="204" font-size="10" fill="#93a1b3">distance, time, surge</text>
    <text x="45" y="266" font-size="11">New riders</text><text x="45" y="280" font-size="10" fill="#93a1b3">(+)</text>
    <text x="135" y="266" font-size="11">Retained</text><text x="135" y="280" font-size="10" fill="#93a1b3">(+)</text>
    <text x="245" y="266" font-size="11">Requests</text><text x="245" y="280" font-size="10" fill="#93a1b3">(x)</text>
    <text x="335" y="266" font-size="11">Fulfillment %</text><text x="335" y="280" font-size="10" fill="#93a1b3">supply-driven</text>
  </g>
</svg>
</div>
<p>Notice where <b>supply</b> shows up: in fulfillment rate (share of requests that become completed trips) and in surge pricing (fare per product). A driver shortage can show up as lower trips <i>and</i> higher average fare at the same time, which is why you decompose before you diagnose.</p>

<h3>Input vs output metrics</h3>
<p>Output metrics (revenue, gross bookings, NRR) are what the board sees. Input metrics are what teams can directly move this week. A good KPI tree gives every team an input metric that is <b>controllable, measurable weekly, and proven to move the output</b>.</p>
<table>
<tr><th>Company (target)</th><th>Output metric</th><th>Example input metrics a team might own</th><th>Guardrail metric</th></tr>
<tr><td>Datadog</td><td>ARR, NRR</td><td>Customers adopting a 2nd / 4th / 8th product; trial-to-paid conversion; time to first dashboard</td><td>Gross retention; customer bill-shock tickets</td></tr>
<tr><td>Spotify</td><td>Premium subscribers, ARPU, gross margin</td><td>Free-to-Premium trial starts; weekly listening days per user; plan mix (Family, Duo, Student)</td><td>Monthly churn; ad load complaints on Free tier</td></tr>
<tr><td>Google Cloud</td><td>Cloud revenue, backlog</td><td>Qualified pipeline by vertical; proof-of-concept conversion; consumption ramp after signing</td><td>Cloud operating margin; deal discount depth</td></tr>
<tr><td>DoorDash</td><td>GOV, contribution profit</td><td>Merchant selection in a zone; delivery time (ETA accuracy); DashPass trial conversion</td><td>Defect rate (missing items, late orders); Dasher pay per active hour</td></tr>
<tr><td>Uber</td><td>Gross bookings, adj. EBITDA</td><td>Driver online hours at peak; ETA; Uber One cross-platform usage</td><td>Cancellation rate; safety incidents; take rate</td></tr>
</table>
<p style="font-size:12.5px;color:var(--muted)">The input metrics above are illustrative examples of the kind of metric a team might own, not disclosed internal KPIs.</p>

<div class="callout warn"><span class="lbl">TRAP · GOODHART&#39;S LAW</span>"When a measure becomes a target, it ceases to be a good measure." If a delivery team is targeted on ETA alone, it can hit the target by quietly shrinking the delivery radius, which cuts selection and orders. Every input metric needs a <b>guardrail</b> (a counter-metric that must not get worse) and a sanity check that the input still predicts the output.</div>

<h3>Choosing a North Star metric</h3>
<p>A North Star is not just "the biggest number." A strong one passes five tests:</p>
<table>
<tr><th>Test</th><th>Question to ask</th><th>Fails if...</th></tr>
<tr><td>Customer value</td><td>Does it go up only when customers get more value?</td><td>It can be grown with dark patterns (e.g. raw app opens)</td></tr>
<tr><td>Leads revenue</td><td>Does it predict revenue 1 to 4 quarters out?</td><td>It is revenue itself (lagging, no guidance for teams)</td></tr>
<tr><td>Actionable</td><td>Can most teams name how their work moves it?</td><td>Only finance understands it</td></tr>
<tr><td>Measurable fast</td><td>Can you read it weekly with low noise?</td><td>It needs a 12-month cohort to observe</td></tr>
<tr><td>Hard to game</td><td>Does it come with natural guardrails?</td><td>One team can inflate it at the expense of others</td></tr>
</table>
<p>Candidate North Stars for the target companies (illustrative, for interview discussion; these are not official company metrics): <b>Spotify</b>, weekly engaged listeners or listening hours per user; <b>DoorDash</b>, weekly orders from retained consumers in a zone; <b>Uber</b>, monthly trips per active platform consumer across Mobility and Delivery; <b>Datadog</b>, number of customers using several products (a proxy for platform depth that drives NRR); <b>Google Cloud</b>, committed consumption under contract. In an interview, the point is not to guess the "right" one but to argue the trade-offs with the five tests.</p>

<h3>Variance decomposition: volume, mix, rate</h3>
<p>When a metric equal to <i>volume x average price</i> moves, split the change into three effects before you form hypotheses. This is the single most reusable analysis in metric-diagnosis interviews.</p>
<pre><code>Change in revenue = Volume effect + Mix effect + Rate effect

Volume effect = (Trips_2 - Trips_1) x AvgFare_1
Mix effect    = Trips_2 x (AvgFare at period-1 prices but period-2 mix - AvgFare_1)
Rate effect   = Trips_2 x (AvgFare_2 - AvgFare at period-1 prices but period-2 mix)</code></pre>

<div class="callout example"><span class="lbl">WORKED EXAMPLE · ILLUSTRATIVE NUMBERS</span>
<p>A city GM says: "Trips are up 4% week over week but gross bookings fell. Is pricing broken?" Data (illustrative):</p>
<table>
<tr><th>Product</th><th>Week 1 trips</th><th>Week 1 avg fare</th><th>Week 2 trips</th><th>Week 2 avg fare</th></tr>
<tr><td>Economy (X)</td><td>9.0M</td><td>$17.00</td><td>9.6M</td><td>$17.00</td></tr>
<tr><td>Premium</td><td>1.0M</td><td>$47.00</td><td>0.8M</td><td>$43.00</td></tr>
<tr><td><b>Total</b></td><td><b>10.0M</b></td><td><b>$20.00</b></td><td><b>10.4M</b></td><td><b>$19.00</b></td></tr>
</table>
<p>Gross bookings: Week 1 = 10.0M x $20.00 = <b>$200.0M</b>. Week 2 = 10.4M x $19.00 = <b>$197.6M</b>. Change = <b>-$2.4M</b>.</p>
<ul>
  <li><b>Volume effect:</b> (10.4M - 10.0M) x $20.00 = <b>+$8.0M</b></li>
  <li><b>Mix effect:</b> Week 2 mix at Week 1 prices = (9.6 x 17 + 0.8 x 47) / 10.4 = 200.8 / 10.4 = $19.31. (19.31 - 20.00) x 10.4M = <b>-$7.2M</b></li>
  <li><b>Rate effect:</b> (19.00 - 19.31) x 10.4M = <b>-$3.2M</b> (all from Premium: -$4 x 0.8M)</li>
  <li><b>Check:</b> +8.0 - 7.2 - 3.2 = -2.4. Reconciles.</li>
</ul>
<p><b>So what:</b> pricing on Economy is fine. The loss is a <b>Premium problem</b>: Premium trips fell 20% and Premium fares fell about 9%. Next hypotheses: a Premium driver-supply drop (fewer premium vehicles online, so fewer matches), a competitor promotion targeted at high-value riders, or a Premium fare test. Pull Premium request volume vs fulfillment rate first: if requests held but fulfillment fell, it is supply; if requests fell, it is demand.</p>
</div>

<h4>SQL pattern for the decomposition</h4>
<pre><code>WITH wk AS (
  SELECT product,
         SUM(CASE WHEN week = 1 THEN trips END) AS t1,
         SUM(CASE WHEN week = 2 THEN trips END) AS t2,
         SUM(CASE WHEN week = 1 THEN bookings END) / NULLIF(SUM(CASE WHEN week = 1 THEN trips END), 0) AS p1,
         SUM(CASE WHEN week = 2 THEN bookings END) / NULLIF(SUM(CASE WHEN week = 2 THEN trips END), 0) AS p2
  FROM city_trips_weekly
  WHERE city = 'X' AND week IN (1, 2)
  GROUP BY product
), tot AS (
  SELECT SUM(t1) AS T1, SUM(t2) AS T2,
         SUM(t1 * p1) / SUM(t1) AS P1,
         SUM(t2 * p1) / SUM(t2) AS P_mix,
         SUM(t2 * p2) / SUM(t2) AS P2
  FROM wk
)
SELECT (T2 - T1) * P1     AS volume_effect,
       T2 * (P_mix - P1)  AS mix_effect,
       T2 * (P2 - P_mix)  AS rate_effect
FROM tot;</code></pre>

<h3>From driver tree to KPI tree: attach owners and cadence</h3>
<table>
<tr><th>Node</th><th>Owner</th><th>Target type</th><th>Reviewed in</th></tr>
<tr><td>Gross bookings (city)</td><td>City GM</td><td>Quarterly plan</td><td>QBR, monthly business review</td></tr>
<tr><td>Active riders, new</td><td>Growth marketing</td><td>Weekly budget vs CAC cap</td><td>WBR</td></tr>
<tr><td>Fulfillment rate at peak</td><td>Supply / driver ops</td><td>Floor (e.g. not below a set level at Friday peak)</td><td>WBR, daily during events</td></tr>
<tr><td>Premium product mix</td><td>Product marketing</td><td>Directional</td><td>Monthly</td></tr>
</table>
<p>S&amp;O usually <b>owns the tree itself</b>: keeping definitions consistent, making sure the leaves still reconcile to the top line, and running the review where owners explain their variance. That is a real lever: whoever controls the metric definitions controls the conversation.</p>

<div class="callout"><span class="lbl">NEWS TIE-IN · NOV 2026</span>Uber now argues that robotaxi fleets earn more on its network because of about 30% higher trips per vehicle per day than on AV operators&#39; own apps, even after Uber&#39;s marketplace fee (Q3 2026 call, as reported by The Register). In driver-tree terms that is a claim about the <b>utilization</b> node: fleet profit = vehicles x trips per vehicle per day x contribution per trip minus fixed vehicle cost. Waymo said the same week it will end its exclusive Austin and Atlanta arrangement with Uber, and Amazon&#39;s Zoox went live on the Uber app in Las Vegas on Nov 16, 2026. When you read a partnership headline, ask which node of whose driver tree it moves.</div>

<h3>Practice: build Spotify&#39;s Premium revenue tree</h3>
<p>Prompt: "You join Spotify S&amp;O. Premium revenue growth slowed by 3 points in one region. Build the driver tree you would use to diagnose it, and say which three nodes you would check first." Try it for 10 minutes before opening the answer.</p>
<details><summary>Show model answer</summary>
<pre><code>Premium revenue (region)
= Average Premium subscribers  x  ARPU per month  x  months

Average subscribers
= Opening subs + Gross adds - Churned subs   (averaged over period)
  Gross adds = Free MAU x trial/offer uptake x trial-to-paid conversion
             + direct paid sign-ups + partner bundles (telco, etc.)
  Churn      = Opening subs x monthly churn rate
               (split: voluntary vs involuntary / payment failure)

ARPU
= sum over plans of (plan share x list price) x (1 - promo discount share)
  x FX translation to reporting currency
  Plans: Individual, Duo, Family, Student, (Basic / Audiobooks add-ons)</code></pre>
<p><b>Check first:</b> (1) <b>FX</b> - if revenue is reported in euros and the local currency weakened, growth slows with no operational problem; compare constant-currency growth. (2) <b>Plan mix</b> - a shift toward Family or Student lowers ARPU per account even as subscribers grow (a mix effect, not a rate effect). (3) <b>Churn split</b> - a recent price increase usually shows up as a short churn spike, while a rise in involuntary churn points to payment issues. Only after those three would you look at gross adds and the free-to-paid funnel.</p>
<p><b>Common mistakes:</b> jumping to "competitors" before ruling out FX and mix; treating subscriber count and ARPU as independent (a price rise moves both); forgetting partner-bundle subscribers, which can carry a different ARPU.</p>
</details>

<h3>Common mistakes</h3>
<table>
<tr><th>Mistake</th><th>Why it hurts</th><th>Fix</th></tr>
<tr><td>Tree built from opinions, not identities</td><td>Leaves do not reconcile; arguments go in circles</td><td>Start with a formula that is always true, then split</td></tr>
<tr><td>Ratios at the top of the tree</td><td>Averages hide mix shifts (Simpson&#39;s paradox)</td><td>Keep totals at the top; push ratios down to leaves, decompose mix explicitly</td></tr>
<tr><td>No guardrails</td><td>Teams hit input targets while hurting the output</td><td>Pair every input metric with a counter-metric</td></tr>
<tr><td>Too many North Stars</td><td>"Three North Stars" means no North Star</td><td>One North Star plus a few input metrics per team</td></tr>
<tr><td>Diagnosing before decomposing</td><td>You chase the wrong cause (pricing instead of mix)</td><td>Run volume / mix / rate first, then hypothesize</td></tr>
</table>

<div class="quiz" data-a="1">
  <div class="q">Self-check: Average order value fell 5% but no menu prices changed. What is the most likely first explanation to test?</div>
  <button class="opt">Merchants secretly cut prices</button>
  <button class="opt">A mix shift toward smaller or cheaper order types (e.g. more single-person or convenience orders)</button>
  <button class="opt">Take rate decreased</button>
  <button class="opt">Data pipeline error, so stop the analysis</button>
  <div class="exp">With unchanged prices, a drop in an average is most often a mix effect. Decompose by order type or category first. Take rate affects revenue, not AOV. Data checks are worth a quick look, but you do not stop there.</div>
</div>

<div class="quiz" data-a="3">
  <div class="q">Self-check: Which is the best input metric to assign a supply operations team in a ride-hailing city?</div>
  <button class="opt">Gross bookings</button>
  <button class="opt">Net promoter score of riders</button>
  <button class="opt">Total registered drivers</button>
  <button class="opt">Fulfillment rate during peak hours, with driver earnings per hour as a guardrail</button>
  <div class="exp">Fulfillment at peak is controllable by supply levers (incentives, scheduling), readable weekly, and drives trips. Registered drivers is a vanity count; gross bookings is an output the team only partly controls; the guardrail stops the team from buying fulfillment with unsustainable incentives that crush earnings or margin.</div>
</div>
`});
</script>

<script id="ch07-spotify-deep-dive">
chapter({part:"Part VI · Company Deep-Dives", id:"spotify-deep-dive", num:"07", title:"Spotify Deep-Dive: Freemium Audio, Pricing Power and Royalty Math", mins:20, tag:"Company · Spotify", html:`
<p>Spotify is the best case in this handbook for <b>subscription pricing and gross margin structure</b>. It runs a freemium funnel (a free, ad-supported tier that feeds a paid Premium tier) on top of a two-sided platform: listeners on one side, and rights holders and creators (labels, publishers, podcasters, authors) on the other. Most of every Premium euro flows back to rights holders, so the operator question at Spotify is: <i>how do we grow subscribers and ARPU while widening a thin gross margin, without breaking the deal with creators?</i></p>

<h3>The business model in one picture</h3>
<div class="diagwrap">
<svg viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="13">
  <defs><marker id="sp7" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#93a1b3"/></marker></defs>
  <g fill="#1b232e" stroke="#f5a524" stroke-width="1.5">
    <rect x="300" y="105" width="160" height="60" rx="10"/>
    <rect x="20" y="20" width="200" height="60" rx="10"/>
    <rect x="20" y="190" width="200" height="60" rx="10"/>
    <rect x="540" y="20" width="200" height="60" rx="10"/>
    <rect x="540" y="190" width="200" height="60" rx="10"/>
  </g>
  <g fill="#e8eef5" text-anchor="middle">
    <text x="380" y="131">Spotify platform</text><text x="380" y="149" font-size="11" fill="#93a1b3">gross margin ~33%</text>
    <text x="120" y="46">Free listeners</text><text x="120" y="64" font-size="11" fill="#93a1b3">499M ad-supported MAU</text>
    <text x="120" y="216">Premium subscribers</text><text x="120" y="234" font-size="11" fill="#93a1b3">306M, ARPU about 4.95 EUR/mo</text>
    <text x="640" y="46">Advertisers</text><text x="640" y="64" font-size="11" fill="#93a1b3">audio, video, podcast ads</text>
    <text x="640" y="216">Rights holders and creators</text><text x="640" y="234" font-size="11" fill="#93a1b3">labels, publishers, podcasters, authors</text>
  </g>
  <g stroke="#93a1b3" stroke-width="1.3" fill="none" marker-end="url(#sp7)">
    <path d="M120,80 L120,190"/><path d="M220,220 L300,150"/><path d="M540,50 L460,120"/><path d="M460,150 L540,215"/><path d="M220,50 L300,120"/>
  </g>
  <g fill="#93a1b3" font-size="11">
    <text x="128" y="140">upgrade funnel</text><text x="225" y="200">subscription $</text><text x="470" y="95">ad $</text><text x="480" y="200">royalties</text><text x="235" y="75">attention</text>
  </g>
</svg>
</div>
<p>The free tier is both a revenue line and the main acquisition channel for Premium. Rights holders are a cost line and the supply side: the catalog is largely the same as Apple Music, YouTube Music and Amazon Music, so Spotify competes on product (personalization, discovery, podcasts, audiobooks) and price, not exclusive music.</p>

<h3>Q3 2026 by the numbers</h3>
<table>
<tr><th>Metric (Q3 2026)</th><th>Reported</th><th>Growth Y/Y</th></tr>
<tr><td>Total MAU</td><td>788M</td><td>+11%</td></tr>
<tr><td>Ad-supported MAU</td><td>499M</td><td>+12%</td></tr>
<tr><td>Premium subscribers</td><td>306M (+6M net adds, 1M above guidance)</td><td>+9%</td></tr>
<tr><td>Total revenue</td><td>EUR 4.97B</td><td>+16% (+14% constant currency)</td></tr>
<tr><td>Premium revenue</td><td>EUR 4.49B</td><td>+17% (+15% cc)</td></tr>
<tr><td>Ad-supported revenue</td><td>EUR 482M</td><td>+10% (+9% cc); impressions up, pricing softer</td></tr>
<tr><td>Premium ARPU</td><td>EUR 4.95 per month</td><td>+9.3% (+7.5% cc), from price increases partly offset by mix</td></tr>
<tr><td>Gross margin</td><td>33.0% total; 34.5% Premium; 18.7% ad-supported</td><td>+136 bps total</td></tr>
<tr><td>Operating income</td><td>EUR 672M (13.5% margin)</td><td>+15%</td></tr>
<tr><td>Free cash flow</td><td>EUR 735M (TTM EUR 3.2B)</td><td>-9%</td></tr>
<tr><td>Q4 2026 guide</td><td>818M MAU; 316M subs; revenue EUR 5.2B; gross margin 33.8%; operating income EUR 820M</td><td></td></tr>
</table>
<p style="font-size:12.5px;color:var(--muted)">Sources: <a href="https://www.sec.gov/Archives/edgar/data/0001639920/000114036126040435/ef20084028_ex99-1.htm" target="_blank">Spotify Q3 2026 shareholder update (SEC 6-K exhibit 99.1)</a> · <a href="https://musicbusinessworldwide.com/spotify-is-on-course-for-a-3-3b-annual-operating-profit-in-2026-after-adding-6m-subscribers-in-q3" target="_blank">Music Business Worldwide</a>. Social charges (Swedish payroll taxes on equity awards) move with the share price and can swing operating income by tens of millions of euros versus guidance.</p>

<h3>How to read the Spotify P&amp;L</h3>
<table>
<tr><th>Lever</th><th>What moves it</th><th>Operator question</th></tr>
<tr><td><b>Subscriber growth</b></td><td>Free-to-Premium conversion, promo intake (trial offers), emerging-market growth, churn</td><td>Are net adds coming from high-ARPU or low-ARPU markets?</td></tr>
<tr><td><b>ARPU</b></td><td>Price increases, plan mix (Individual vs Duo, Family, Student), market mix, FX</td><td>How much of ARPU growth is price vs mix vs currency?</td></tr>
<tr><td><b>Premium gross margin</b></td><td>Royalty terms with labels and publishers, audiobook and podcast content costs, bundling rules</td><td>Does a new product (audiobooks, video) dilute or expand margin?</td></tr>
<tr><td><b>Ad-supported revenue</b></td><td>MAU, ad load, fill rate, CPMs, podcast sponsorship</td><td>Is growth from more impressions or better pricing?</td></tr>
<tr><td><b>Operating expenses</b></td><td>Headcount (about 7,300 FTEs), marketing, R&amp;D</td><td>How much operating leverage is left as revenue outgrows opex?</td></tr>
</table>

<div class="callout example"><span class="lbl">Worked example · what a subscriber is worth vs a free user (Q3 2026)</span>
<table>
<tr><th>Line</th><th>Math</th><th>Per month</th></tr>
<tr><td>Premium revenue per sub</td><td>reported ARPU</td><td>~EUR 4.95</td></tr>
<tr><td>Premium gross profit per sub</td><td>4.95 x 34.5%</td><td>~EUR 1.71</td></tr>
<tr><td>Ad revenue per free MAU</td><td>EUR 482M / 499M / 3 months</td><td>~EUR 0.32</td></tr>
<tr><td>Ad gross profit per free MAU</td><td>0.32 x 18.7%</td><td>~EUR 0.06</td></tr>
</table>
<p><b>So what:</b> a Premium subscriber is worth roughly <b>15x</b> a free user in revenue and close to <b>28x</b> in gross profit (derived estimates from reported totals, ignoring that some ad revenue comes from podcasts heard by Premium users). That is why the free tier is managed mainly as a conversion funnel, and why a one-point lift in Free-to-Premium conversion beats almost any ad-pricing win.</p>
</div>

<h3>Strategic bets an S&amp;O operator would work on</h3>
<table>
<tr><th>Bet</th><th>What happened</th><th>S&amp;O angle</th></tr>
<tr><td><b>Pricing power</b></td><td>US Premium went to $12.99 Individual, $18.99 Duo, $21.99 Family and $6.99 Student from January 2026, following increases in many other markets</td><td>Elasticity by market, churn after increase, timing and grandfathering, plan mix shifts</td></tr>
<tr><td><b>Audiobooks</b></td><td>Expanding from 22 markets to 180+ by year end 2026, 350,000+ titles in 120+ languages</td><td>Margin impact of included listening hours, publisher payouts, upsell to add-on hours</td></tr>
<tr><td><b>Creator economy</b></td><td>Creator Memberships live in 34 markets; Spotify Partner Program in 35+ new markets</td><td>Payout design, creator retention, video podcast cost vs engagement</td></tr>
<tr><td><b>Trust and supply quality</b></td><td>Artist Profile Protection opened to all artists on Nov 17, 2026, letting artists review releases attributed to them</td><td>Ops cost of review queues vs creator trust, AI-generated content policy</td></tr>
<tr><td><b>Personalization and AI</b></td><td>Taste Profile launched for US Premium; leadership argues entertainment survives the agentic era because people want to experience it themselves</td><td>Engagement metrics as leading indicators of retention</td></tr>
</table>
<p>Leadership context: Spotify is now run by co-CEOs Alex Norström and Gustav Söderström, with CFO Christian Luiga; founder Daniel Ek moved to executive chairman. Expect interviewers to talk about disciplined investment and margin expansion, the themes management stressed all year.</p>

<h3>What S&amp;O and BizOps work looks like at Spotify</h3>
<ul>
<li><b>Pricing and packaging:</b> market-by-market price tests, new tiers and add-ons, bundle economics.</li>
<li><b>Subscriber analytics:</b> funnel from Free to trial to paid, churn cohorts after a price change, promo payback.</li>
<li><b>Content economics:</b> modeling royalty and content cost per stream or per hour across music, podcasts and audiobooks.</li>
<li><b>Planning:</b> MAU, subscriber and margin targets by region, and the weekly business review that tracks them.</li>
</ul>
<div class="callout tip"><span class="lbl">Interview focus</span> Expect a pricing case, a metric-drop diagnosis (subs, ARPU or margin), and questions on marketplace balance between listeners and creators. Always split ARPU change into price, plan mix, market mix and FX before you explain it.</div>

<h3>Practice: should Spotify raise prices in a market?</h3>
<p>Prompt: "A mid-size market has 5M Premium subscribers on an Individual price of 10.99. Leadership proposes 11.99. Royalties and other cost of revenue run about 65.5% of Premium revenue. Should we do it?" All numbers are <b>illustrative</b>. Try for 15 minutes before opening.</p>
<details>
<summary>Show model answer</summary>
<div class="callout example"><span class="lbl">Model answer</span>
<p><b>Structure:</b> (1) gross profit math and breakeven churn, (2) evidence on elasticity, (3) second-order effects, (4) recommendation and test design.</p>
<table>
<tr><th>Step</th><th>Math</th><th>Result</th></tr>
<tr><td>Gross profit per sub today</td><td>10.99 x 34.5%</td><td>3.79</td></tr>
<tr><td>Gross profit per sub after</td><td>11.99 x 34.5%</td><td>4.14</td></tr>
<tr><td>Breakeven retained share</td><td>3.79 / 4.14</td><td>91.7%</td></tr>
<tr><td>Subs you can lose and still break even</td><td>5M x 8.3%</td><td>~415K</td></tr>
</table>
<p>Because royalties scale with revenue, the gross profit gain per sub is only about 0.35 per month, not the full 1.00. The increase pays off if incremental churn stays under about 8%. Past increases across the industry have typically produced low single-digit extra churn, so the case looks favorable, but check local data.</p>
<p><b>Ask for:</b> churn after previous increases in similar markets, share of subs on Family or Duo (they may downgrade or consolidate), competitor prices, local purchasing power and payment method mix, and whether free-tier conversion will slow.</p>
<p><b>Recommend:</b> raise to 11.99, communicate added value (audiobook hours, features), give existing subs one billing cycle of notice, and watch 60-day churn and plan downgrades against the 8% breakeven line, with a pre-agreed rollback trigger.</p>
</div>
</details>

<table>
<tr><th>Common mistake</th><th>Better approach</th></tr>
<tr><td>Treating the full price increase as profit</td><td>Apply the royalty share; only the margin portion drops to gross profit</td></tr>
<tr><td>Quoting headline revenue growth</td><td>Split constant-currency growth from FX, and price from mix</td></tr>
<tr><td>Ignoring the free tier</td><td>Price moves change upgrade rates; model the funnel, not just the base</td></tr>
</table>

<div class="quiz" data-a="1">
  <div class="q">Self-check: Spotify Premium ARPU grew 9.3% reported but 7.5% in constant currency. What explains the 1.8-point gap?</div>
  <button class="opt">Plan mix shifting toward Family</button>
  <button class="opt">Favorable foreign exchange movements</button>
  <button class="opt">More subscribers in emerging markets</button>
  <button class="opt">Higher ad CPMs</button>
  <div class="exp">Constant currency strips out FX. The gap between reported and constant-currency growth is the currency effect; mix and price are both inside the 7.5%.</div>
</div>

<div class="quiz" data-a="3">
  <div class="q">Self-check: With Premium gross margin around 34.5%, a 1.00 price increase adds roughly how much gross profit per subscriber per month (if no one churns)?</div>
  <button class="opt">1.00</button>
  <button class="opt">0.66</button>
  <button class="opt">0.10</button>
  <button class="opt">About 0.35</button>
  <div class="exp">Royalties and other cost of revenue scale with revenue, so only the gross margin share of the increase (about 34.5%) becomes gross profit.</div>
</div>
`});
</script>

<script>
chapter({part:"Part VII · Case Practice", id:"case-uber-driver-supply", num:"08", title:"Case: Uber Driver Supply Shortage at Peak", mins:24, tag:"Case · Uber · Marketplace", html:`
<p>The second full practice case, and the first on a <b>two-sided marketplace</b>. It is close to a live situation: on its Q3 2026 call Uber said Mobility growth came in below its own expectations because driver supply did not keep pace with demand in several international markets, and it began shifting incentive dollars from rider discounts toward driver pay. Work it as a 30 to 45 minute interview: clarify, structure, ask for data, do the math, recommend. Attempt each step before opening the model answer. Pair it with <a onclick="show('driver-trees-north-star')">06 Driver Trees</a>, which builds the bookings tree this case leans on.</p>

<div class="callout"><span class="lbl">The prompt (illustrative)</span>"You are on the Uber Mobility Strategy &amp; Operations team for a mid-size city we will call Metro X. Over the last four weeks, Friday and Saturday evening peaks have gotten worse: pickup ETAs went from about 5 to about 9 minutes, more riders see no cars available, and surge is on for most of the window. The regional GM wants a diagnosis and a plan to restore reliability this quarter without wrecking the Mobility margin."</div>

<h3>Step 0 · What the real company looks like</h3>
<p>Figures below are as reported for Q3 2026 (quarter ended Sept 30, 2026). Uber does not disclose city-level supply data, so everything about Metro X later in the chapter is illustrative.</p>
<table>
<tr><th>Metric (Q3 2026)</th><th>Reported value</th><th>Why it matters for this case</th></tr>
<tr><td>Gross bookings</td><td>$59.8B, up 20% Y/Y</td><td>Demand is strong; the constraint is the supply side</td></tr>
<tr><td>Trips / MAPCs</td><td>Trips up 16%; 215M monthly active platform consumers, up 14%</td><td>Each rider is also taking more trips (about 6.3 per MAPC per month)</td></tr>
<tr><td>Drivers and couriers</td><td>10.8M earners, paid well over $25B in the quarter</td><td>The supply base is huge, so small engagement shifts move many hours</td></tr>
<tr><td>Mobility</td><td>Gross bookings up 17%; record 8.0% segment margin (of GB)</td><td>The GM constraint is real: margin is a headline number</td></tr>
<tr><td>Supply commentary</td><td>Tighter driver availability and fuel prices cut Mobility growth 1 to 2 points; Brazil and India undersupplied, Canada "meaningfully undersupplied"</td><td>Causes cited: fuel costs, tighter immigration policy, competition for couriers, seasonality</td></tr>
<tr><td>Q4 2026 guide</td><td>GB $63.25B to $65.25B (18% to 22% constant currency)</td><td>Management expects improving balance after targeted driver investment</td></tr>
</table>
<p style="font-size:12.5px;color:var(--muted)">Sources: Uber Q3 2026 prepared remarks and earnings release; PYMNTS call coverage. Links in the Changelog entry for 2026-11-19.</p>

<h3>Step 1 · Clarify before you structure</h3>
<ul>
  <li><b>Scope:</b> Only Friday and Saturday 5 pm to 9 pm, or all peaks? Only UberX, or all products? (Answer: peaks only, mostly UberX.)</li>
  <li><b>Demand or supply?</b> Worse ETAs can come from more requests, fewer driver hours, or less efficient dispatch. Never assume "shortage" means "too few drivers".</li>
  <li><b>Timing:</b> Did anything change four weeks ago: an event calendar, a fuel price spike, a competitor bonus, a regulation, a pricing or dispatch change?</li>
  <li><b>Goal and guardrails:</b> What reliability target (e.g. 90% of requests fulfilled), by when, and with what spend or margin limit?</li>
</ul>

<h3>Step 2 · Structure: the marketplace balance tree</h3>
<p>Fulfillment is an identity, so split it mathematically first, then go qualitative inside each branch.</p>
<pre><code>Completed trips  = Supply hours x Trips per supply hour
Supply hours     = Drivers online x Online hours per driver
Fulfillment rate = Completed trips / Requests

Trips per supply hour falls when dead miles, pickup times or trip lengths rise.
It rises (up to a cap) when the market is busy, because idle time shrinks.</code></pre>
<table>
<tr><th>Branch</th><th>Hypotheses</th><th>Data to request</th></tr>
<tr><td><b>Demand</b></td><td>Organic growth, events, a rider promo, a competitor exit</td><td>Requests by hour and zone, promo redemptions, event calendar</td></tr>
<tr><td><b>Driver count</b></td><td>Churn up, fewer new drivers activating, drivers shifting to delivery or a rival app</td><td>Active drivers at peak, new activations, 30/60/90-day lapsed counts, multi-apping survey data</td></tr>
<tr><td><b>Hours per driver</b></td><td>Fuel cost squeezing per-hour earnings, drivers logging off earlier</td><td>Online hours distribution, earnings per online hour net of fuel, log-off times</td></tr>
<tr><td><b>Efficiency</b></td><td>Longer pickups, poor repositioning, airport queues pulling drivers away</td><td>Utilization, dead miles per trip, trip length, airport queue size at peak</td></tr>
</table>

<div class="diagwrap">
<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
  <line x1="50" y1="210" x2="660" y2="210" stroke="#93a1b3"/>
  <line x1="50" y1="30" x2="50" y2="210" stroke="#93a1b3"/>
  <rect x="460" y="30" width="140" height="180" fill="#f05252" opacity="0.10"/>
  <polyline fill="none" stroke="#f5a524" stroke-width="2.5" points="70,190 130,170 190,140 250,150 310,145 370,130 430,110 470,60 520,45 570,55 610,95 650,150"/>
  <polyline fill="none" stroke="#3ecf8e" stroke-width="2.5" points="70,185 130,160 190,130 250,135 310,135 370,120 430,105 470,90 520,95 570,105 610,120 650,150"/>
  <g fill="#93a1b3" font-size="11" text-anchor="middle">
    <text x="70" y="226">6a</text><text x="190" y="226">10a</text><text x="310" y="226">2p</text><text x="430" y="226">4p</text><text x="530" y="226">5p to 9p</text><text x="650" y="226">11p</text>
  </g>
  <text x="530" y="24" fill="#f05252" text-anchor="middle" font-size="11">Gap = unfulfilled requests, long ETAs, surge</text>
  <rect x="70" y="36" width="12" height="4" fill="#f5a524"/><text x="88" y="41" fill="#e8eef5" font-size="11">Requests (demand)</text>
  <rect x="70" y="52" width="12" height="4" fill="#3ecf8e"/><text x="88" y="57" fill="#e8eef5" font-size="11">Trip capacity (supply hours x trips per hour)</text>
  <text x="660" y="250" fill="#93a1b3" font-size="10" text-anchor="end">Illustrative Friday in Metro X</text>
</svg>
</div>

<h3>Step 3 · The data comes back (illustrative)</h3>
<p>The interviewer gives you an average Friday or Saturday 5 pm to 9 pm window. Compute what drove the decline in fulfillment before reading on.</p>
<table>
<tr><th>Peak window metric</th><th>Four weeks ago</th><th>Now</th><th>Change</th></tr>
<tr><td>Requests</td><td>12,000</td><td>13,200</td><td>+10%</td></tr>
<tr><td>Drivers online</td><td>2,000</td><td>1,800</td><td>-10%</td></tr>
<tr><td>Online hours per driver in window</td><td>3.0</td><td>2.8</td><td>-0.2</td></tr>
<tr><td>Supply hours</td><td>6,000</td><td>5,040</td><td>-16%</td></tr>
<tr><td>Trips per supply hour</td><td>1.8</td><td>2.0</td><td>busier, less idle time</td></tr>
<tr><td>Completed trips</td><td>10,800</td><td>10,080</td><td>-7%</td></tr>
<tr><td><b>Fulfillment rate</b></td><td><b>90.0%</b></td><td><b>76.4%</b></td><td><b>-13.6 pts</b></td></tr>
</table>

<details><summary>Show model reading of the data</summary>
<p><b>Both sides moved, but supply is the bigger story.</b> Demand grew 10% while supply hours fell 16%. Utilization rising to 2.0 trips per hour partly cushioned the loss, which is why completed trips fell only 7%.</p>
<p><b>Split the 960 lost supply hours</b> (driver count first, then hours at the new count, so the pieces reconcile exactly):</p>
<pre><code>Driver count effect  = (1,800 - 2,000) x 3.0 = -600 hours  (63%)
Hours per driver     = 1,800 x (2.8 - 3.0)   = -360 hours  (37%)
Total                = 5,040 - 6,000         = -960 hours</code></pre>
<p><b>So:</b> fewer drivers is about two thirds of the problem and shorter sessions about one third. Next ask: are the 200 missing drivers churned, lapsed, or online at other times? Suppose the data says about 400 drivers lapsed in the last 90 days, and about 600 active drivers now drive weekday daytime but skip the evening peak. Fuel prices rose in the same month, which fits the shorter sessions.</p>
<p><b>Cost of doing nothing:</b> at the old 90% fulfillment Metro X would complete 11,880 trips per window, so 1,800 trips are lost. At an illustrative $22 average fare that is about $39,600 of gross bookings per window, about $79,000 per weekend, before counting riders who stop opening the app after seeing no cars.</p>
</details>

<h3>Step 4 · Price the levers</h3>
<p>The key S&amp;O idea is <b>cost per incremental supply hour</b>. A broad bonus pays every driver already online (inframarginal spend), so it buys hours expensively. Targeted offers buy only the hours you would not have gotten.</p>
<div class="callout example"><span class="lbl">Worked example · cost per incremental hour (illustrative)</span>
<table>
<tr><th>Lever</th><th>Assumption</th><th>Extra supply hours per window</th><th>Cost per window</th><th>Cost per incremental hour</th></tr>
<tr><td>A. Blanket peak boost</td><td>$8 extra per online hour for everyone; hours rise 15%</td><td>5,040 x 15% = 756</td><td>$8 x 5,796 = $46,368</td><td><b>about $61</b></td></tr>
<tr><td>B. Reactivate lapsed drivers</td><td>400 reachable, 25% return for 2.5 hours; $150 bonus spread over 8 windows</td><td>100 x 2.5 = 250</td><td>$15,000 / 8 = $1,875</td><td><b>$7.50</b></td></tr>
<tr><td>C. Targeted peak offer</td><td>$40 for 3 peak hours to 600 daytime-only drivers; 30% accept</td><td>180 x 3 = 540</td><td>180 x $40 = $7,200</td><td><b>about $13</b></td></tr>
<tr><td>D. Dispatch efficiency</td><td>Fix airport queue rules and repositioning; trips per hour +5%</td><td>about 250 hour-equivalents</td><td>ops and product time</td><td>low cash, slower to ship</td></tr>
</table>
<p><b>Combine B + C + D.</b> Supply hours become 5,040 + 250 + 540 = 5,830. If utilization settles to 1.9 as ETAs shorten, then +5% efficiency gives 1.995 trips per hour, so completed trips = 5,830 x 1.995 = about 11,631. Fulfillment = 11,631 / 13,200 = <b>88.1%</b>, close to the 90% target.</p>
<p><b>Payback check:</b> regained trips 11,631 - 10,080 = 1,551; at $22 that is about $34,100 of gross bookings. At an illustrative 25% take rate, revenue is about $8,530 vs incentive spend of $1,875 + $7,200 = $9,075 per window. That is roughly breakeven on the window alone. The case for spending rests on <b>rider retention</b> (riders who see no cars come back less) and on spend tapering as reactivated drivers stay. Lever A, by contrast, would cost about $46,000 for less than half the extra hours.</p>
</div>

<details><summary>Show model recommendation</summary>
<ol>
  <li><b>Recommendation:</b> Restore peak fulfillment to about 88% to 90% within six weeks using targeted supply levers, not a blanket bonus. Launch lapsed-driver reactivation (B) and a targeted peak offer for daytime-only drivers (C) this week; fix airport queue and repositioning rules (D) within the quarter. Cap incentive spend at about $9,000 per peak window, and taper it 25% every two weeks once fulfillment holds above 88%.</li>
  <li><b>Pricing:</b> Let surge do its job at the margin (it rations demand and pulls supply), but avoid pushing prices up so far that riders churn. Keep rider promos off during the peak; that is the same reallocation Uber described on its Q3 call.</li>
  <li><b>Measurement:</b> Run lever C as a randomized holdout (offer to a random 80% of eligible drivers) so you can measure true incremental hours and off-peak cannibalization.</li>
  <li><b>Risks:</b> Drivers move hours from off-peak into the bonus window instead of adding hours; competitors match the offer; fuel prices keep rising. Watch earnings per online hour net of fuel as the leading indicator.</li>
  <li><b>Next steps:</b> A weekly marketplace review (WBR) line for Metro X with fulfillment, ETA, supply hours, and cost per incremental hour, and a decision point at week 6 on whether the gap is structural (recruit more drivers) or seasonal (taper).</li>
</ol>
</details>

<h3>Step 5 · A query you could be asked to write</h3>
<pre><code>-- Fulfillment and supply hours by hour of week, last 8 weeks
SELECT DATE_TRUNC('week', r.requested_at)              AS wk,
       EXTRACT(DOW FROM r.requested_at)                AS dow,
       EXTRACT(HOUR FROM r.requested_at)               AS hr,
       COUNT(*)                                        AS requests,
       SUM(CASE WHEN r.status = 'completed' THEN 1 ELSE 0 END) * 1.0
         / COUNT(*)                                    AS fulfillment_rate,
       MAX(s.supply_hours)                             AS supply_hours
FROM ride_requests r
LEFT JOIN hourly_supply s
  ON s.city_id = r.city_id
 AND s.hour_start = DATE_TRUNC('hour', r.requested_at)
WHERE r.city_id = 'metro_x'
  AND r.requested_at &gt;= CURRENT_DATE - INTERVAL '56 days'
GROUP BY 1, 2, 3
ORDER BY 1, 2, 3;</code></pre>

<h3>Common mistakes</h3>
<table>
<tr><th>Mistake</th><th>Why it hurts</th><th>Do this instead</th></tr>
<tr><td>Jumping to "pay drivers more"</td><td>Blanket bonuses buy hours at several times the cost of targeted ones</td><td>Compute cost per incremental hour by lever</td></tr>
<tr><td>Ignoring demand growth</td><td>Here demand was a third of the gap; you would under-size the fix</td><td>Split the gap into demand vs supply first</td></tr>
<tr><td>Treating utilization as fixed</td><td>Busy markets have higher trips per hour; the gap looks smaller than the hour loss</td><td>Model trips per hour as a variable that falls back as ETAs improve</td></tr>
<tr><td>No guardrail on margin</td><td>The GM explicitly cares about Mobility margin</td><td>State a spend cap and a taper rule</td></tr>
<tr><td>Forgetting cannibalization</td><td>Drivers may shift hours rather than add them</td><td>Measure with a holdout and track total weekly hours</td></tr>
</table>

<h3>Practice timer</h3>
<p>Re-run this case cold in a week. Use the timer, and try to finish structure plus lever pricing within 25 minutes.</p>
${TOOLS.caseTimer()}

<div class="quiz" data-a="1">
  <div class="q">Self-check: Supply hours fell from 6,000 to 5,040 while trips per supply hour rose from 1.8 to 2.0. Why did completed trips fall only 7% when hours fell 16%?</div>
  <button class="opt">Demand grew 10%, which increases completed trips one for one</button>
  <button class="opt">A busier market cuts idle time, so each online hour produces more trips</button>
  <button class="opt">Surge pricing created new drivers instantly</button>
  <button class="opt">The data must be wrong</button>
  <div class="exp">Utilization rises when demand exceeds supply: drivers spend less time waiting between trips. That partly offsets lost hours, but only up to a physical cap, and it comes with longer pickup ETAs.</div>
</div>

<div class="quiz" data-a="2">
  <div class="q">Self-check: A blanket $8 per hour peak boost adds 756 hours and costs $46,368. A targeted offer adds 540 hours for $7,200. What is the main reason the blanket boost is so much more expensive per incremental hour?</div>
  <button class="opt">Drivers do not respond to hourly pay</button>
  <button class="opt">The targeted offer is paid in a different currency</button>
  <button class="opt">It pays every driver already online, so most of the spend is inframarginal</button>
  <button class="opt">Blanket boosts always reduce fulfillment</button>
  <div class="exp">About 5,040 of the 5,796 paid hours would have happened anyway. Paying for them is a transfer, not new supply, so cost per incremental hour balloons to about $61 vs about $13.</div>
</div>
`});
</script>

<script id="ch09-saas-metrics">
chapter({part:"Part V · SaaS", id:"saas-metrics", num:"09", title:"SaaS Metrics for Operators: ARR, NRR, GRR, Magic Number, Rule of 40, CAC Payback", mins:20, tag:"Framework · SaaS", html:`
<p>If you interview for S&amp;O at Datadog, or for Google Cloud BizOps, you will be expected to speak SaaS fluently. The metrics are not hard individually; the skill is knowing <b>which question each one answers</b>, how they connect, and where each one lies to you. This chapter builds the full scorecard, runs it on Datadog using real Q3 2026 numbers, and then gives you a hidden-answer diagnostic drill.</p>

<h3>The SaaS scorecard: six questions, six metrics</h3>
<table>
<tr><th>Question the CFO asks</th><th>Metric</th><th>Formula</th><th>Rough "good" bar (public SaaS)</th></tr>
<tr><td>How big is the recurring business?</td><td><b>ARR</b></td><td>Annualized value of recurring contracts (or run-rate of usage revenue)</td><td>Growth matters more than level</td></tr>
<tr><td>Do existing customers grow?</td><td><b>NRR</b></td><td>(Start cohort ARR + expansion - contraction - churn) / start cohort ARR</td><td>110%+ is strong, 120%+ is elite</td></tr>
<tr><td>Do existing customers stay?</td><td><b>GRR</b></td><td>(Start cohort ARR - contraction - churn) / start cohort ARR, capped at 100%</td><td>90%+ enterprise, 80%+ SMB</td></tr>
<tr><td>Is sales spend efficient?</td><td><b>Magic number</b></td><td>(Revenue this Q - revenue last Q) x 4 / sales &amp; marketing spend last Q</td><td>Above 0.75 means invest more; below 0.5 means fix the motion</td></tr>
<tr><td>How fast do we earn back CAC?</td><td><b>CAC payback</b></td><td>S&amp;M spend / (net new ARR x gross margin), in months x 12</td><td>Under 18 to 24 months</td></tr>
<tr><td>Are we balancing growth and profit?</td><td><b>Rule of 40</b></td><td>Revenue growth % + FCF margin % (or operating margin)</td><td>40 or more</td></tr>
</table>
<div class="callout tip"><span class="lbl">MENTAL MODEL</span>Think of the scorecard as a <b>tank with a tap and a drain</b>. New-logo ARR and expansion are the taps, contraction and churn are the drain (NRR and GRR measure them), the magic number and CAC payback measure how much fuel you burn to open the taps, and Rule of 40 checks whether the whole system is running hot enough without overheating the P&amp;L.</div>

<h3>How the metrics connect: the ARR bridge</h3>
<pre><code>Ending ARR = Starting ARR + New-logo ARR + Expansion - Contraction - Churn
Net new ARR = Ending ARR - Starting ARR

NRR = (Starting ARR + Expansion - Contraction - Churn) / Starting ARR
GRR = (Starting ARR - Contraction - Churn) / Starting ARR
Growth from existing base = NRR - 1
Growth from new logos     = New-logo ARR / Starting ARR</code></pre>
<p>This is the single most useful identity in SaaS. It tells you that total ARR growth is <b>(NRR - 1) + new-logo contribution</b>. A company with 120% NRR grows 20% before it signs a single new customer. That is why land-and-expand businesses like Datadog obsess over NRR.</p>

<h3>Usage-based caveats (why Datadog is different)</h3>
<p>Datadog bills mostly on usage (hosts, ingested logs, spans, events) on top of annual commitments. That changes how you read every metric:</p>
<table>
<tr><th>Metric</th><th>Seat-based SaaS</th><th>Usage-based SaaS (Datadog)</th></tr>
<tr><td>ARR</td><td>Contract value, known in advance</td><td>A run-rate estimate; can move monthly as customers ingest more or less</td></tr>
<tr><td>NRR</td><td>Driven by seat adds and upsell at renewal</td><td>Driven by workload growth and product cross-sell; also by customer cost optimization, which shows up fast</td></tr>
<tr><td>Leading indicator</td><td>Pipeline, renewals calendar</td><td>RPO and commitments vs on-demand usage, weekly usage trends by top account</td></tr>
<tr><td>Main risk</td><td>Logo churn at renewal</td><td>Contraction from optimization, and concentration in a few very large customers</td></tr>
</table>

<div class="callout example"><span class="lbl">Worked example · Datadog Rule of 40</span>
<ul>
  <li><b>FCF version:</b> 35% revenue growth + 21% FCF margin = <b>56</b>. Comfortably above 40.</li>
  <li><b>GAAP operating margin version:</b> 35% + 6% = <b>41</b>. Still passes, but barely; this is the version a skeptic will use because it charges stock comp as a cost.</li>
  <li><b>Forward look:</b> if growth slows to the Q4 guide of about 25% and FCF margin holds near 21%, the score falls to about 46. The lesson: Rule of 40 is dominated by growth at high-growth companies, so a growth deceleration is the main risk to the score, not margin.</li>
  <li><b>Interview move:</b> always say which margin you used and why. "I use FCF margin because it is cash, but note GAAP margin would give 41."</li>
</ul>
</div>

<h3>Magic number and CAC payback: worked example (illustrative)</h3>
<div class="callout example"><span class="lbl">Worked example · sales efficiency</span>
<p>An illustrative mid-size SaaS company: revenue grows from $200M in Q1 to $212M in Q2. Q1 sales &amp; marketing spend was $60M. Gross margin is 80%. Net new ARR in Q2 is $50M.</p>
<pre><code>Magic number = (212 - 200) x 4 / 60 = 48 / 60 = 0.80
CAC payback  = 60 / (50 x 0.80) = 60 / 40 = 1.5 years = 18 months</code></pre>
<p><b>Read:</b> a 0.80 magic number says each dollar of S&amp;M buys 80 cents of new annualized revenue within a quarter, which is a green light to add sales capacity. The 18-month payback confirms it. If the magic number were 0.4, the operator answer is not "cut S&amp;M" but "diagnose the funnel": win rates, ramp time of new reps, deal size, and mix of new logo vs expansion.</p>
</div>
<div class="callout warn"><span class="lbl">Where these metrics lie</span><ul>
<li><b>Magic number</b> ignores the lag between spend and revenue; in long enterprise cycles, use a two-quarter lag.</li>
<li><b>CAC payback</b> without gross margin flatters low-margin businesses; always multiply by gross margin.</li>
<li><b>NRR</b> is cohort-weighted by dollars, so one giant customer can move it by points (see chapter 05).</li>
<li><b>Rule of 40</b> can be gamed by cutting S&amp;M to inflate margin while sacrificing future growth.</li></ul></div>

<h3>Practice drill (try before opening)</h3>
<div class="callout"><span class="lbl">Prompt (illustrative)</span>Google Cloud BizOps: a SaaS partner reports NRR flat at 115%, but GRR fell from 93% to 89% and the magic number rose from 0.6 to 0.9. Revenue growth is unchanged. What is going on, and what would you worry about?</div>
<details><summary>Show model answer</summary>
<p><b>Answer first:</b> retention quality got worse and expansion is masking it. GRR down four points means four more points of churn and contraction; NRR flat means expansion grew by about four points to offset it. Rising magic number with flat growth suggests S&amp;M was cut or shifted toward cheaper expansion deals, not that new-logo selling improved.</p>
<ol><li><b>Split churn vs contraction</b> by segment: is SMB churning while enterprise expands?</li>
<li><b>Check expansion concentration:</b> if a few accounts drive the expansion, the flat NRR is fragile.</li>
<li><b>Check S&amp;M mix:</b> did new-logo spend fall? That boosts the magic number now and hurts growth in two to three quarters.</li>
<li><b>Recommend:</b> a churn-reason deep dive, customer success coverage for at-risk segments, and tracking GRR as a guardrail metric next to NRR in the WBR.</li></ol>
</details>

<p>Alphabet is the best case in this handbook for <b>portfolio strategy and capital allocation</b>. One enormously profitable business (Search ads) funds a fast-growing one (Google Cloud), a large media business (YouTube), a hardware and subscriptions line, and a set of long-dated bets. In 2026 the operator question at Google is: <i>how do we turn record AI capital spending into revenue fast enough, while AI changes how Search itself makes money?</i></p>

<h3>How to read the Alphabet P&amp;L</h3>
<table>
<tr><th>Lever</th><th>What moves it</th><th>Operator question</th></tr>
<tr><td><b>Search revenue</b></td><td>Query volume, share of queries with ads, ads per page, click-through rate, cost per click, traffic acquisition costs (TAC) paid to Apple, Samsung and browser partners</td><td>When a query moves from classic results to an AI answer, how much revenue per query survives?</td></tr>
<tr><td><b>YouTube</b></td><td>Watch time (Shorts vs long-form vs connected TV), ad load, CPMs, subscription conversion</td><td>Is Shorts watch time monetizing near long-form yet, and is Premium cannibalizing ads?</td></tr>
<tr><td><b>Cloud growth</b></td><td>New bookings, backlog conversion, available compute capacity, AI infrastructure deals, Gemini Enterprise seats</td><td>Is growth limited by demand or by how fast capacity comes online?</td></tr>
<tr><td><b>Cloud margin</b></td><td>Scale, depreciation of new data centers, mix of high-margin software (Workspace, databases) vs raw compute</td><td>Will depreciation from record capex compress margins in 2027?</td></tr>
<tr><td><b>Capex and FCF</b></td><td>TPU and GPU purchases, data center construction, power contracts</td><td>What return per dollar of capex, and over what payback period?</td></tr>
</table>

<div class="callout example"><span class="lbl">Worked example · Cloud incremental margin (real Q3 numbers)</span>

<tr><th>Line</th><th>Q3 2025</th><th>Q3 2026</th><th>Change</th></tr>
<tr><td>Cloud revenue</td><td>$15.16B</td><td>$30.71B</td><td>+$15.55B</td></tr>
<tr><td>Cloud operating income</td><td>$3.59B</td><td>$11.12B</td><td>+$7.53B</td></tr>
<tr><td>Operating margin</td><td>23.7%</td><td>36.2%</td><td>+12.5 pts</td></tr>

<p><b>Incremental margin</b> = change in operating income / change in revenue = 7.53 / 15.55 = <b>48%</b>. Each new Cloud dollar dropped about 48 cents to operating income, double the margin of the base business a year earlier. That is operating leverage: sales, R&amp;D and overhead grew much slower than revenue. The operator follow-up: incremental margin is flattered when capacity is full (high utilization) and before depreciation on newly built data centers fully hits the P&amp;L. Ask what the margin looks like once 2026 capex is depreciating.</p>
</div>

<div class="callout example"><span class="lbl">Worked example · what the backlog implies (simplified)</span>
<pre><code>Backlog                          = $561B
Share converting within 24 months ~ 55%  ->  about $309B
Average per quarter over 8 qtrs  = 309 / 8  ~ $38.6B
Current quarterly Cloud revenue  = $30.7B</code></pre>
<p>Even with zero new bookings, the existing backlog alone implies average quarterly recognition about 25% above today. Real recognition is not uniform (large AI infrastructure contracts ramp as capacity is delivered), but the math tells you the near-term constraint is <b>supply of compute, not demand</b>. That reframes the S&amp;O problem: capacity planning, sequencing of data center go-lives, and which customers get capacity first.</p>
</div>

<div class="callout example"><span class="lbl">Worked example · capex intensity and free cash flow</span>
<p>Operating cash flow = FCF + capex = -9.07 + 51.36 = <b>about $42.3B</b>. Capex intensity = 51.36 / 127.58 = <b>40% of revenue</b>, up from about 23.95 / 102 = 23% a year ago (Q3 2025 revenue backed out from the 25% growth rate). The business still throws off more than $40B of operating cash per quarter; the negative FCF is a choice to reinvest all of it and more. In an interview, separate "the business is weaker" (it is not: operating income +30%) from "the company is spending ahead of revenue" (it is).</p>
</div>
