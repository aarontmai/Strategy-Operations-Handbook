  <g stroke="#93a1b3" stroke-width="1.5" marker-end="url(#arr1)">
    <line x1="140" y1="70" x2="158" y2="70"/><line x1="290" y1="70" x2="308" y2="70"/>
    <line x1="440" y1="70" x2="458" y2="70"/><line x1="590" y1="70" x2="608" y2="70"/>
  </g>
  <path d="M680,100 C680,150 75,150 75,102" fill="none" stroke="#93a1b3" stroke-dasharray="4 4" marker-end="url(#arr1)"/>
  <text x="378" y="160" fill="#93a1b3" font-size="11" text-anchor="middle">results feed the next question</text>
</svg>
<div class="diagcap">The S&amp;O loop: frame, structure, analyze, recommend, drive.</div>
</div>
<ol>
  <li><b>Frame.</b> Restate the question as a decision with an owner and a deadline. "Look into grocery" becomes "Should we fund a second grocery dark-store pilot in Q2, yes or no, decided by the GM on March 1?"</li>
  <li><b>Structure.</b> Break the question into mutually exclusive, collectively exhaustive pieces and write down a <i>hypothesis</i> for each (Chapter 02).</li>
  <li><b>Analyze.</b> Pull only the data that can confirm or kill a hypothesis. Build the simplest model that answers the question.</li>
  <li><b>Recommend.</b> Lead with the answer. State the trade-off you are accepting and the risk you are watching.</li>
  <li><b>Drive.</b> Assign owners, define the success metric and its threshold, and put it on a review cadence. Strategy that never reaches an owner is a slide, not a strategy.</li>
</ol>

<h3>Core skills and how to show each one</h3>
<table>
<tr><th>Skill</th><th>What "good" looks like</th><th>How you prove it in an interview</th></tr>
<tr><td>Structured thinking</td><td>MECE breakdowns, clear hypotheses, no wandering.</td><td>Draw your structure before you ask for data; signpost ("three buckets: demand, supply, conversion").</td></tr>
<tr><td>Quantitative fluency</td><td>Fast, correct back-of-envelope math; sanity checks; knows which assumption matters.</td><td>Round numbers aggressively, say units out loud, check results against something you know.</td></tr>
<tr><td>Business judgment</td><td>Knows how the company makes money and what would change it.</td><td>Tie every finding to revenue, cost, or risk; name second-order effects (cannibalization, supply response).</td></tr>
<tr><td>Data skills</td><td>Can write SQL, build a model, and spot bad data.</td><td>Live SQL or Excel exercise; say how you would validate the data before trusting it.</td></tr>
<tr><td>Communication</td><td>Answer first, then support (pyramid principle); short memos; crisp slides.</td><td>Summarize the case in 30 seconds at the end; recommendation, three reasons, next steps.</td></tr>
<tr><td>Influence without authority</td><td>Gets teams that do not report to you to change their plans.</td><td>Behavioral story where you aligned engineers, sales, or ops with data plus a shared goal.</td></tr>
<tr><td>Bias to execution</td><td>Ships pilots, sets owners, follows up.</td><td>Stories end with a measured result, not with "and then we presented."</td></tr>
</table>

<h3>A week in the life (embedded S&amp;O, marketplace company)</h3>
<table>
<tr><th>Day</th><th>Activity</th><th>Output</th></tr>
<tr><td>Mon</td><td>Weekly business review (WBR) prep: refresh dashboard, write 5-bullet commentary on what moved and why.</td><td>WBR doc for the GM.</td></tr>
<tr><td>Tue</td><td>Deep dive: why did order frequency in one region fall 3%? SQL pulls, cohort cut.</td><td>One-page finding with root cause hypothesis.</td></tr>
<tr><td>Wed</td><td>Business case for a new incentive program with marketing and finance.</td><td>Model with base / bull / bear cases.</td></tr>
<tr><td>Thu</td><td>Planning: draft headcount and budget asks for next half with team leads.</td><td>Planning template filled, trade-offs flagged.</td></tr>
<tr><td>Fri</td><td>Exec readout of the deep dive; agree on a test; assign owners.</td><td>Decision log entry, test plan, success metric.</td></tr>
</table>

<div class="callout example"><span class="lbl">Worked example · framing a vague ask</span>
<p><b>Ask from a VP:</b> "Ad-supported users in Brazil feel low. Take a look."</p>
<p><b>Weak response:</b> spend two weeks building a 40-tab dashboard of every Brazil metric.</p>
<p><b>Strong response, day one:</b></p>
<ul>
  <li><b>Clarify the decision:</b> "Is the decision whether to increase Brazil marketing budget next quarter, or whether to change the Free tier there?" The VP says: marketing budget, decision in three weeks.</li>
  <li><b>Clarify "low":</b> low versus what? Plan, last year, or peer markets (Mexico, Argentina)? Answer: versus plan, 4% behind.</li>
  <li><b>First structure:</b> ad-supported MAU = new users + resurrected users - churned users. Which term explains the 4% gap?</li>
  <li><b>Hypotheses:</b> (a) paid acquisition was cut mid-quarter, (b) a competitor launched a free offer, (c) churn rose after an app change.</li>
  <li><b>Plan:</b> pull the MAU bridge by month (one SQL query), check marketing spend vs plan, check churn by app version. Readout in one week with a recommendation.</li>
</ul>
<p>Illustrative outcome: the bridge shows new users on plan, churn up 1.5 points after an onboarding change. Recommendation: do <i>not</i> add marketing budget yet (it would fill a leaky bucket); roll back the onboarding change first and re-read in four weeks. Notice the answer reframed the VP's original question; that is normal and valuable.</p>
</div>

<h3>How S&amp;O work is judged</h3>
<ul>
  <li><b>Decisions changed.</b> Did leadership do something different because of your work?</li>
  <li><b>Speed to a good-enough answer.</b> An 80% answer in one week usually beats a 95% answer in six.</li>
  <li><b>Trust.</b> Your numbers tie out, you flag uncertainty honestly, and you never surprise an executive in a meeting.</li>
  <li><b>Follow-through.</b> The metric you said would move, moved (or you explained why not and what you learned).</li>
</ul>

<div class="callout warn"><span class="lbl">Common failure modes</span>Boiling the ocean (too much analysis, no answer); presenting data without a "so what"; skipping stakeholders until the readout; recommending something nobody owns; using jargon instead of numbers.</div>

<h3>Mapping your engineering habits to S&amp;O</h3>
<table>
<tr><th>Engineering habit</th><th>S&amp;O equivalent</th></tr>
<tr><td>Root-cause analysis on a fault (fault tree, 5 whys)</td><td>Metric diagnosis with a driver tree</td></tr>
<tr><td>Requirements and acceptance criteria</td><td>Framing the decision and defining success metrics</td></tr>
<tr><td>Design reviews with cross-functional teams</td><td>Stakeholder alignment before an exec readout</td></tr>
<tr><td>Test plans, validation, regression checks</td><td>Experiments, holdouts, and post-launch metric reviews</td></tr>
<tr><td>Data pipelines and dashboards (data intelligence team)</td><td>WBR / QBR metric infrastructure and self-serve SQL</td></tr>
</table>

<div class="quiz" data-a="2">
  <div class="q">Self-check: A GM asks you to "look into churn." What is the best first step?</div>
  <button class="opt">Pull every churn metric available and build a dashboard</button>
  <button class="opt">Benchmark churn against three competitors</button>
  <button class="opt">Clarify the decision the GM needs to make and the deadline, then form hypotheses</button>
  <button class="opt">Start an A/B test on a retention offer</button>
  <div class="exp">Framing comes first. Knowing the decision (e.g. whether to fund a retention team) tells you which analysis matters and how precise it needs to be. Dashboards and tests come later, if at all.</div>
</div>

<div class="quiz" data-a="1">
  <div class="q">Self-check: Which output best shows the "Drive" step of the S&amp;O loop?</div>
  <button class="opt">A polished 30-slide deck</button>
  <button class="opt">A decision log entry with an owner, a success metric with a threshold, and a review date</button>
  <button class="opt">A larger dataset for the next analysis</button>
  <button class="opt">A list of ten more questions to investigate</button>
  <div class="exp">Drive means the decision becomes someone's job with a measurable target and a check-in. That is what turns analysis into impact.</div>
</div>
`});
</script>

<script id="part1b">
chapter({part:"Part I · Foundations", id:"problem-structuring", num:"02", title:"Problem Structuring: MECE, Issue Trees, Hypothesis-Driven Work", mins:18, tag:"Foundations · core", html:`
<p>Structuring is the single most tested S&amp;O skill. Interviewers watch the first five minutes of a case more closely than the math, because a good structure makes the rest easy and a bad one makes it impossible. This chapter covers three tools that work together: <b>MECE</b> (the rule), <b>issue trees</b> (the picture), and <b>hypothesis-driven work</b> (the speed).</p>

<h3>MECE: mutually exclusive, collectively exhaustive</h3>
<p>A breakdown is <b>mutually exclusive</b> when no item overlaps another (nothing counted twice) and <b>collectively exhaustive</b> when together the items cover everything (nothing missed). It is the same discipline as partitioning a fault space in engineering: every failure must land in exactly one branch.</p>
<table>
<tr><th>Breakdown of "revenue"</th><th>ME?</th><th>CE?</th><th>Verdict</th></tr>
<tr><td>Customers x revenue per customer</td><td>Yes</td><td>Yes</td><td>✅ Clean, mathematical.</td></tr>
<tr><td>Mobile revenue, iOS revenue, web revenue</td><td>No (iOS is inside mobile)</td><td>Maybe</td><td>❌ Overlap double-counts iOS.</td></tr>
<tr><td>US revenue, Europe revenue</td><td>Yes</td><td>No (rest of world missing)</td><td>❌ Add "Rest of world".</td></tr>
<tr><td>New, expansion, and retained revenue</td><td>Yes</td><td>Yes (if churn shown as negative)</td><td>✅ Good for SaaS.</td></tr>
</table>

<h4>Four reliable ways to split anything MECE</h4>
<ul>
  <li><b>Math (formula) splits:</b> profit = revenue - cost; revenue = volume x price; orders = users x frequency. Always MECE; best for metric diagnosis.</li>
  <li><b>Process / funnel splits:</b> awareness, consideration, sign-up, activation, retention. MECE if the stages are sequential.</li>
  <li><b>Stakeholder splits:</b> consumers, merchants, couriers, platform. Natural for marketplaces.</li>
  <li><b>Segment splits:</b> by geography, customer size, product, cohort, channel. Include an "other" bucket to stay exhaustive.</li>
</ul>
<div class="callout tip"><span class="lbl">Rule of thumb</span>Use a <b>math split at the top</b> of a tree whenever the question is about a metric. It guarantees MECE and points directly at data. Use framework or stakeholder splits lower down, where judgment matters.</div>

<h3>Issue trees</h3>
<p>An issue tree breaks one key question into sub-questions until each leaf is answerable with a specific analysis. There are two kinds:</p>
<table>
<tr><th>Type</th><th>Each node is</th><th>Use when</th><th>Example root</th></tr>
<tr><td><b>Diagnostic (why) tree</b></td><td>A possible cause</td><td>Something changed and you need to know why</td><td>"Why did DoorDash orders in Region X fall 5%?"</td></tr>
<tr><td><b>Solution (how) tree</b></td><td>A possible lever or option</td><td>You need to choose actions</td><td>"How could Uber increase Friday-night driver hours by 10%?"</td></tr>
</table>

<div class="diagwrap">
<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
  <g fill="#1b232e" stroke="#f5a524" stroke-width="1.4">
    <rect x="10" y="125" width="150" height="50" rx="8"/>
    <rect x="215" y="55" width="160" height="44" rx="8"/><rect x="215" y="200" width="160" height="44" rx="8"/>
    <rect x="430" y="10" width="320" height="34" rx="7"/><rect x="430" y="56" width="320" height="34" rx="7"/><rect x="430" y="102" width="320" height="34" rx="7"/>
    <rect x="430" y="164" width="320" height="34" rx="7"/><rect x="430" y="210" width="320" height="34" rx="7"/><rect x="430" y="256" width="320" height="34" rx="7"/>
  </g>
  <g fill="#e8eef5">
    <text x="85" y="147" text-anchor="middle">Orders fell 5%</text><text x="85" y="164" text-anchor="middle" fill="#93a1b3" font-size="11">(region X, 4 weeks)</text>
    <text x="295" y="74" text-anchor="middle">Fewer active users?</text><text x="295" y="90" text-anchor="middle" fill="#93a1b3" font-size="11">users = new + retained</text>
    <text x="295" y="219" text-anchor="middle">Lower frequency?</text><text x="295" y="235" text-anchor="middle" fill="#93a1b3" font-size="11">orders per active user</text>
    <text x="442" y="32">New user acquisition down (marketing, referrals)</text>
    <text x="442" y="78">Retention down (bad experience, competitor promo)</text>
    <text x="442" y="124">Measurement change (tracking, definitions)</text>
    <text x="442" y="186">Selection worse (merchants churned, closures)</text>
    <text x="442" y="232">Price / fees up (delivery fee, menu prices)</text>
    <text x="442" y="278">Reliability worse (ETAs, cancellations, supply)</text>
  </g>
  <g stroke="#93a1b3" stroke-width="1.3" fill="none">
    <path d="M160,150 L190,150 L190,77 L215,77"/><path d="M190,150 L190,222 L215,222"/>
    <path d="M375,77 L400,77 L400,27 L430,27"/><path d="M400,77 L430,73"/><path d="M400,77 L400,119 L430,119"/>
    <path d="M375,222 L400,222 L400,181 L430,181"/><path d="M400,222 L430,227"/><path d="M400,222 L400,273 L430,273"/>
  </g>
</svg>
<div class="diagcap">A diagnostic issue tree: math split at the top (users x frequency), judgment-based causes below.</div>
</div>

<h4>Rules for a good tree</h4>
<ol>
  <li><b>One clear root question</b>, specific in metric, place, and time.</li>
  <li><b>MECE at every level.</b> Check each set of siblings separately.</li>
  <li><b>Three to five branches per node.</b> Two is often too coarse; seven is a list, not a structure.</li>
  <li><b>Leaves map to an analysis.</b> If you cannot name the data that answers a leaf, split it further.</li>
  <li><b>Always include a data-quality branch</b> for diagnostic trees. A surprising share of "metric drops" are tracking changes.</li>
</ol>

<h3>Hypothesis-driven work</h3>
<p>Exhaustive trees are correct but slow. Hypothesis-driven work adds speed: state your best guess of the answer up front, then design the minimum analysis that would prove it <i>wrong</i>. If it survives, you are done early. If it dies, the tree tells you where to look next.</p>
<table>
<tr><th>Step</th><th>What you do</th><th>Example (orders fell 5%)</th></tr>
<tr><td>1. State the hypothesis</td><td>One sentence, falsifiable.</td><td>"The drop is a frequency drop among existing users caused by the delivery-fee increase on Feb 1."</td></tr>
<tr><td>2. Define the kill test</td><td>What data would disprove it?</td><td>If active users fell and frequency is flat, or if the drop began before Feb 1, the hypothesis is dead.</td></tr>
<tr><td>3. Run the cheapest test first</td><td>One query, one chart.</td><td>Weekly orders split into users x frequency, with Feb 1 marked.</td></tr>
<tr><td>4. Update</td><td>Confirm, refine, or switch branches.</td><td>Frequency fell from Feb 1, concentrated in non-members: confirmed and refined.</td></tr>
</table>
<div class="callout warn"><span class="lbl">Watch out</span>Hypothesis-driven does not mean "decide the answer and find supporting data." Confirmation bias is the failure mode. Always say what would change your mind, and look for that first.</div>

<h3>The pyramid principle (preview)</h3>
<p>When you present, flip the tree: lead with the answer (the top), then the three supporting arguments (the branches), then the evidence (the leaves). Executives read top-down and stop when they are convinced. Chapter coverage of executive communication comes later in Part VIII.</p>

<div class="callout example"><span class="lbl">Practice case · Datadog</span>
<p><b>Prompt:</b> "Datadog's new-logo bookings in the mid-market segment were 15% below plan last quarter, while enterprise was on plan. Structure the problem." Spend 5 minutes building a tree before opening the answer.</p>
<details><summary>Show model answer</summary>
<p><b>Clarify first:</b> bookings measured as first-year ARR from new customers? Plan built bottom-up from rep capacity? Any change in segment definitions (employee-count thresholds) this year?</p>
<p><b>Top-level math split:</b> new-logo bookings = number of deals closed x average first-year deal size. Deals closed = pipeline created x win rate (for deals due this quarter).</p>
<ul>
  <li><b>Pipeline volume:</b> marketing-sourced leads, self-serve trials converting to sales, rep prospecting, partner-sourced.</li>
  <li><b>Win rate:</b> competition (open-source tooling, other observability vendors), pricing objections, product gaps, sales cycle length (deals slipping to next quarter count as misses).</li>
  <li><b>Deal size:</b> fewer products in the initial land, smaller initial commits, more customers starting on-demand.</li>
  <li><b>Capacity:</b> ramped reps vs plan (hiring delays, attrition), territory changes.</li>
  <li><b>Measurement:</b> segment re-mapping moved accounts from mid-market to enterprise.</li>
</ul>
<p><b>Lead hypothesis (illustrative):</b> the miss is mostly deal <i>slippage</i>: win rates are flat but cycle length grew because mid-market buyers face tighter budget approvals. <b>Kill test:</b> if the count of open, late-stage mid-market deals did not grow, slippage is not the cause.</p>
<p><b>Why this is strong:</b> a math split at the top, a capacity branch (often forgotten), a measurement branch, and a falsifiable lead hypothesis with a specific test.</p>
</details>
</div>

<div class="callout example"><span class="lbl">Practice case · Uber (solution tree)</span>
<p><b>Prompt:</b> "Build a solution tree for increasing Uber Eats orders per active customer in a mature city."</p>
<details><summary>Show model answer</summary>
<ul>
  <li><b>More occasions per customer:</b> new meal occasions (breakfast, late night), new categories (grocery, convenience, alcohol where legal), scheduled orders.</li>
  <li><b>Higher conversion per session:</b> better ranking and recommendations, faster checkout, accurate ETAs, fewer out-of-stock items.</li>
  <li><b>Lower friction cost:</b> membership (Uber One) to remove delivery fees, targeted promotions, lower basket minimums.</li>
  <li><b>Cross-platform triggers:</b> offers after a Rides trip, shared membership benefits.</li>
  <li><b>Fewer bad experiences:</b> reduce late and missing orders that suppress the next order.</li>
</ul>
<p>Then prioritize branches by (impact x confidence) / effort and test the top two.</p>
</details>
</div>

<h3>Structuring a sizing question</h3>
<p>Market sizing is structuring with numbers. The same math-split rule applies: write the formula first (buyers x spend per buyer x reachable share x win share), then argue each input. Build it two ways, top-down from a category total and bottom-up from units, and reconcile. A full market sizing chapter comes later; use the builder below to practice the Google Cloud case from the timer prompts.</p>
<table>
<tr><th>Layer</th><th>Question it answers</th><th>Typical narrowing</th></tr>
<tr><td>TAM</td><td>How big is the whole category?</td><td>All spend on the problem, any vendor, any geography</td></tr>
<tr><td>SAM</td><td>How much can we actually serve?</td><td>Our product scope, our geographies, our channels</td></tr>
<tr><td>SOM</td><td>How much can we win in 3-5 years?</td><td>Realistic share given competitors and sales capacity</td></tr>
</table>
${TOOLS.marketSizing()}

<h3>Time yourself</h3>
<p>Use the timer below. For structuring practice alone, stop after 8 minutes and compare your tree to the outline.</p>
${TOOLS.caseTimer()}

<div class="quiz" data-a="3">
  <div class="q">Self-check: Which breakdown of a marketplace's gross order value is MECE?</div>
  <button class="opt">Restaurant orders, pizza orders, grocery orders</button>
  <button class="opt">Orders from the US and orders from Canada (company operates in 30 countries)</button>
  <button class="opt">New-user orders, mobile orders, desktop orders</button>
  <button class="opt">Number of orders x average order value</button>
  <div class="exp">The formula split cannot overlap or miss anything. Pizza is inside restaurants (overlap), two countries miss 28 others (not exhaustive), and new-user orders overlap with device splits.</div>
</div>

<div class="quiz" data-a="0">
  <div class="q">Self-check: What makes a hypothesis useful in hypothesis-driven work?</div>
  <button class="opt">It is specific enough that a single analysis could prove it wrong</button>
  <button class="opt">It is broad enough to always be partly true</button>
  <button class="opt">It comes from the most senior stakeholder</button>
  <button class="opt">It avoids naming a cause so you stay objective</button>
  <div class="exp">A falsifiable hypothesis tells you exactly which data to pull first and when to stop. A vague one cannot be tested, so it saves no time.</div>
</div>
`});
</script>

<script id="part1c">
chapter({part:"Part I · Foundations", id:"unit-economics", num:"03", title:"Unit Economics Fundamentals", mins:18, tag:"Foundations · math", html:`
<p>Unit economics asks one question: <b>does the business make money on each unit it sells, after the costs that unit causes?</b> The "unit" might be an order (DoorDash, Uber Eats), a trip (Uber Mobility), a subscriber-month (Spotify), or a customer account (Datadog). If the unit loses money, growth makes things worse. If it earns money, the strategic question becomes how fast to buy more units.</p>

<h3>The building blocks</h3>
<table>
<tr><th>Term</th><th>Definition</th><th>Marketplace example</th><th>Subscription / SaaS example</th></tr>
<tr><td><b>AOV / price</b></td><td>Gross value per transaction</td><td>Basket value of a food order</td><td>Monthly plan price</td></tr>
<tr><td><b>Take rate</b></td><td>Share of gross value the company keeps as revenue</td><td>Revenue / GOV (commissions + fees)</td><td>Usually 100% (company keeps the price); the "cost" side carries royalties or cloud costs</td></tr>
<tr><td><b>Variable costs</b></td><td>Costs that scale with each unit</td><td>Courier pay beyond fees, payment processing, refunds, support</td><td>Royalties (audio), hosting and compute (SaaS), payment fees</td></tr>
<tr><td><b>Contribution margin</b></td><td>(Revenue - variable costs) / revenue</td><td>Contribution profit per order / revenue per order</td><td>Gross margin is the usual proxy</td></tr>
<tr><td><b>CAC</b></td><td>Fully loaded cost to acquire one new customer</td><td>Paid marketing + referral credits + first-order promos, divided by new customers</td><td>Sales and marketing spend / new customers (or new ARR)</td></tr>
<tr><td><b>Retention</b></td><td>Share of customers still active next period</td><td>Monthly ordering retention</td><td>Logo retention; for SaaS also revenue retention (NRR)</td></tr>
<tr><td><b>LTV</b></td><td>Lifetime contribution from one customer</td><td>Monthly contribution x expected lifetime</td><td>Monthly gross profit x expected lifetime</td></tr>
<tr><td><b>Payback</b></td><td>Months of contribution needed to recover CAC</td><td>CAC / monthly contribution</td><td>CAC payback (S&amp;M / new gross profit)</td></tr>
</table>

<h3>The core formulas</h3>
<pre><code>Revenue per order        = AOV x take rate
Contribution per order   = Revenue per order - variable cost per order
Monthly contribution     = Contribution per order x orders per month
Expected lifetime (mo)   = 1 / monthly churn          (churn = 1 - retention)
LTV (simple)             = Monthly contribution x lifetime
LTV (discounted)         = m x (1 + d) / (1 + d - r)   (m = monthly contribution,
                                                          r = monthly retention,
                                                          d = monthly discount rate)
LTV / CAC                = LTV / CAC                  (rule of thumb: >= 3x is healthy)
Simple payback (months)  = CAC / monthly contribution
</code></pre>
<div class="callout tip"><span class="lbl">Why 1 / churn?</span>If 8% of customers leave each month and the rate is constant, survival follows a geometric series: 1 + 0.92 + 0.92² + … = 1 / 0.08 = 12.5 months. Small retention changes matter a lot at the top end: 95% retention gives 20 months, 97% gives 33.</div>

<div class="callout example"><span class="lbl">Worked example 1 · food delivery order (illustrative numbers)</span>
<p>A delivery marketplace sees an average basket of <b>$35</b>. Commission plus consumer fees give a <b>13%</b> take rate. Variable costs (courier pay above fees, payments, refunds, support) consume 60% of revenue, so contribution margin is <b>40%</b> of revenue.</p>
<table>
<tr><th>Line</th><th>Math</th><th>Value</th></tr>
<tr><td>Revenue per order</td><td>$35 x 13%</td><td>$4.55</td></tr>
<tr><td>Contribution per order</td><td>$4.55 x 40%</td><td>$1.82</td></tr>
<tr><td>Orders per customer per month</td><td>given</td><td>3</td></tr>
<tr><td>Monthly contribution</td><td>$1.82 x 3</td><td>$5.46</td></tr>
<tr><td>Monthly retention</td><td>given</td><td>92% (lifetime 12.5 months)</td></tr>
<tr><td>LTV (simple)</td><td>$5.46 x 12.5</td><td>$68.25</td></tr>
<tr><td>CAC</td><td>given</td><td>$45</td></tr>
<tr><td>LTV / CAC</td><td>$68.25 / $45</td><td>1.5x</td></tr>
<tr><td>Simple payback</td><td>$45 / $5.46</td><td>8.2 months</td></tr>
</table>
<p><b>So what:</b> 1.5x is marginal (about 1.4x once you discount future months at 10% a year, as the calculator does). Which lever helps most? Try them in the calculator below: raising retention from 92% to 95% raises lifetime from 12.5 to 20 months (LTV about $109, 2.4x). Raising take rate by one point (13% to 14%) raises LTV only about 8%. Retention is the bigger lever here, which is why delivery companies invest in memberships like DashPass and Uber One.</p>
</div>

${TOOLS.unitEconomics()}

<div class="callout example"><span class="lbl">Worked example 2 · consumer subscription (illustrative)</span>
<p>An audio subscription costs <b>$11.99</b> per month. Royalties and other cost of revenue take about two thirds, leaving a gross margin of roughly <b>33%</b> (the same neighborhood as Spotify's reported Q3 2026 gross margin of 33.0%). Monthly churn is <b>3%</b>; blended CAC is <b>$30</b>.</p>
<ul>
  <li>Monthly gross profit = $11.99 x 33% ≈ $3.96</li>
  <li>Lifetime = 1 / 0.03 ≈ 33 months → LTV ≈ $132</li>
  <li>LTV / CAC ≈ 4.4x; payback ≈ 7.6 months</li>
</ul>
<p><b>So what:</b> at a 33% margin, a price increase raises gross profit per subscriber by roughly a third of the increase (royalties tend to scale with revenue). It is still worth it if churn does not rise by much. Break-even question: how much extra churn can a $1 increase absorb? (Answer: compute LTV at the new price and solve for the churn that gives the same LTV. Here, about 3.25% monthly churn, so roughly a quarter-point of additional churn.)</p>
</div>

<h3>Contribution margin: what goes above and below the line</h3>
<table>
<tr><th>Usually variable (inside contribution)</th><th>Usually fixed (below contribution)</th></tr>
<tr><td>Courier / driver pay not covered by fees</td><td>Engineering and product teams</td></tr>
<tr><td>Payment processing</td><td>Corporate G&amp;A (finance, legal, HR)</td></tr>
<tr><td>Refunds, credits, and fraud losses</td><td>Brand marketing</td></tr>
<tr><td>Customer support per contact</td><td>Office and facilities</td></tr>
<tr><td>Cloud / hosting for usage-based products</td><td>Platform R&amp;D, data centers not tied to usage</td></tr>
<tr><td>Royalties per stream (audio)</td><td>Studio and content teams (unless per-unit)</td></tr>
</table>
<div class="callout warn"><span class="lbl">Classic mistake</span>Counting marketing promos inside CAC <i>and</i> as a discount in contribution. Pick one home for each cost and say it out loud. Interviewers test whether you know the difference between "contribution positive" and "profitable".</div>

<h3>Cohort view: payback with churn</h3>
<p>Simple payback assumes no one leaves. A cohort view does not. Start with 1,000 customers acquired at $45 each ($45,000 total). Each month the surviving customers contribute $5.46 each, and 8% leave.</p>
<table>
<tr><th>Month</th><th>Customers alive</th><th>Contribution that month</th><th>Cumulative</th></tr>
<tr><td>1</td><td>1,000</td><td>$5,460</td><td>$5,460</td></tr>
<tr><td>3</td><td>846</td><td>$4,621</td><td>$15,105</td></tr>
<tr><td>6</td><td>659</td><td>$3,599</td><td>$26,866</td></tr>
<tr><td>12</td><td>400</td><td>$2,182</td><td>$43,157</td></tr>
<tr><td>13</td><td>368</td><td>$2,007</td><td>$45,164</td></tr>
</table>
<p>The cohort pays back in <b>month 13</b>, not month 8.2. The calculator shows both numbers. In an interview, quoting cohort payback signals that you understand churn.</p>

<h3>Unit economics across your five targets</h3>
<table>
<tr><th>Company</th><th>Natural unit</th><th>Key levers</th><th>What to ask in a case</th></tr>
<tr><td>DoorDash</td><td>Order</td><td>AOV, take rate, Dasher cost per order (batching, distance), refunds, DashPass frequency lift</td><td>What is contribution per order by vertical (restaurant vs grocery)?</td></tr>
<tr><td>Uber</td><td>Trip / order</td><td>Take rate, incentives, utilization (paid minutes / online minutes), insurance cost</td><td>How much of incentive spend is incremental?</td></tr>
<tr><td>Spotify</td><td>Subscriber-month</td><td>ARPU, royalty rate, churn, plan mix (Family, Duo, Student)</td><td>How does a price change flow through royalties to gross profit?</td></tr>
<tr><td>Datadog</td><td>Customer account</td><td>Land size, expansion rate (NRR), gross margin, S&amp;M efficiency</td><td>What does CAC payback look like when expansion is included?</td></tr>
<tr><td>Google Cloud</td><td>Customer / workload</td><td>Committed spend, compute cost, partner margins, discounting</td><td>What capacity (compute) must exist for each dollar of new revenue?</td></tr>
</table>

<div class="quiz" data-a="1">
  <div class="q">Self-check: Monthly retention rises from 90% to 95%. What happens to expected customer lifetime (simple model)?</div>
  <button class="opt">It rises about 5%</button>
  <button class="opt">It doubles, from 10 to 20 months</button>
  <button class="opt">It rises from 10 to 15 months</button>
  <button class="opt">It is unchanged; retention does not affect lifetime</button>
  <div class="exp">Lifetime = 1 / churn. Churn goes from 10% to 5%, so lifetime goes from 10 to 20 months. This non-linearity is why retention is often the most powerful LTV lever.</div>
</div>

<div class="quiz" data-a="2">
  <div class="q">Self-check: A marketplace has $40 AOV, 12% take rate, and $3.10 of variable cost per order. What is contribution per order?</div>
  <button class="opt">$4.80</button>
  <button class="opt">$36.90</button>
  <button class="opt">$1.70</button>
  <button class="opt">-$1.70</button>
  <div class="exp">Revenue per order = $40 x 12% = $4.80. Subtract $3.10 variable cost: $1.70. Never subtract costs from GOV; the company only keeps the take-rate share.</div>
</div>
`});
</script>

<script id="glossary-script">
var GLOSS = [
["Freemium","Model where a free tier (often ad-supported) acquires users who are later converted to a paid tier; Spotify runs this."],
["Ad-supported MAU","Monthly active users on a free, ad-funded tier; Spotify reports these separately from Premium subscribers."],
["Price elasticity","Percent change in quantity demanded (or subscribers retained) per percent change in price."],
["Plan mix","Share of subscribers on each plan (Individual, Duo, Family, Student); shifts in it move ARPU without any price change."],
["Market mix","Share of users or subscribers by country; growth in lower-priced markets lowers blended ARPU."],
["Breakeven churn","Maximum share of customers you can lose after a price increase before total gross profit falls."],
["Liquidity (marketplace)","Probability that a buyer gets a good match quickly and a seller gets work; measured locally by zone and hour, e.g. fulfillment rate or ETA."],
["Binding constraint","The side of a marketplace (supply or demand) that limits volume right now; invest on that side first."],
["Cross-side network effect","More participants on one side make the platform more valuable to the other side, e.g. more riders raise driver earnings."],
["Same-side network effect","Participants on the same side affect each other; can be positive (social features) or negative (driver congestion)."],
["Multi-homing","Participants using competing platforms at once, like a driver online on two apps; weakens network-effect moats."],
["Take-rate stack","All the pieces of platform revenue as a share of GOV: commission, consumer fees, ads, membership, net of promotions and refunds."],
["Breakeven GOV retention","Old take rate divided by new take rate; the share of GOV you must keep for revenue not to fall after a take-rate increase."],
["Density","Orders or trips per area per hour; higher density lowers cost per order through batching and shorter dead miles."],
["Royalty pass-through","Portion of each revenue dollar paid to rights holders; when royalties scale with revenue, only the margin share of a price increase becomes profit."],
["Social charges","Swedish payroll taxes on employee equity awards that Spotify books in opex; they move with the share price."],
["Grandfathering","Keeping existing customers on an old price for a period after a price increase, to reduce churn."],
["Operating leverage","Profit growing faster than revenue because a large share of costs is fixed."],
["Input metric","A metric a team can directly move with its own levers and read weekly, chosen because it predicts an output metric."],
["Output metric","A result metric such as revenue, gross bookings, or NRR that reflects many inputs and is reported to leadership."],
["Guardrail metric","A counter-metric that must not get worse while a team pushes its target metric, used to prevent gaming."],
["KPI tree","A driver tree in which each node has a named owner, a target, and a review cadence."],
["Volume effect","Part of a change in revenue explained by more or fewer units (orders, trips) at the old average price."],
["Mix effect","Part of a change in an average explained by a shift in the share of higher- or lower-priced segments, with segment prices held constant."],
["Rate effect","Part of a change in revenue explained by price changes within each segment, with the new mix held constant."],
["Goodhart&#39;s law","When a measure becomes a target it stops being a good measure, because people optimize the number instead of the outcome."],
["Simpson&#39;s paradox","A trend that appears in every segment reverses or disappears in the total because the mix of segments changed."],
["Fulfillment rate","Share of requests that become completed trips or orders; a key supply-health metric in marketplaces."],
["Constant currency","Growth restated at prior-period exchange rates to remove the effect of FX moves."],
["Expansion revenue","Added revenue from existing customers through more usage, more seats, more products, or price increases."],
["Contraction","Revenue lost from customers who stay but spend less, for example by cutting usage or downgrading."],
["NRR bridge","Waterfall that walks NRR from one period to the next through changes in expansion, contraction, and churn."],
["Revenue concentration","Share of revenue from the largest customers; high concentration makes metrics swing on a few accounts."],
["RPO","Remaining performance obligations: contracted revenue not yet recognized; a leading indicator of future revenue."],
["Minimum commitment","Contractual floor a usage-based customer pays even if actual usage falls below it."],
["On-demand usage","Consumption billed above or outside a committed contract, usually at a higher unit rate."],
["TTM","Trailing twelve months: a rolling one-year window that smooths and delays the effect of changes."],
["Usage optimization","Customer actions to cut consumption costs, such as sampling logs or shortening data retention."],
["Uber Direct","Uber white-label delivery service that fulfills orders placed in a merchant own app or site."],
["Three-sided marketplace","Platform serving three distinct customer groups at once, such as consumers, merchants, and couriers at DoorDash."],
["Flywheel","Self-reinforcing loop where growth on one side of a marketplace improves value for the others, driving more growth."],
["DashPass","DoorDash membership: monthly or annual fee for reduced delivery and service fees on eligible orders."],
["DoorDash Drive","White-label delivery service where merchants use Dashers to fulfill orders placed on their own channels."],
["DashMart","DoorDash-operated warehouses holding first-party inventory for fast grocery and convenience delivery."],
["Organic growth","Growth from the existing business, excluding volume added by acquisitions."],
["Inorganic growth","Growth contributed by acquired businesses, such as Deliveroo in DoorDash results."],
["Net synergies","Annual cost savings and revenue gains from a merger after subtracting the investments needed to achieve them."],
["HSR review","Hart-Scott-Rodino antitrust waiting period and review by U.S. regulators before a large merger can close."],
["Substitution rate","Share of grocery items replaced with a different item because the ordered item was out of stock."],
["S&O","Strategy and Operations: internal team that structures business problems, builds recommendations, and drives execution and planning."],
["BizOps","Business Operations: a common name for S&O teams at tech companies, often embedded with a product or business unit."],
["MECE","Mutually exclusive, collectively exhaustive: a breakdown where nothing overlaps and nothing is missing."],
["Issue tree","A tree that breaks one key question into sub-questions until each leaf maps to a specific analysis."],
["Diagnostic tree","An issue tree whose branches are possible causes; answers why something changed."],
["Solution tree","An issue tree whose branches are possible levers or options; answers how to achieve a goal."],
["Hypothesis-driven","Working approach that states a falsifiable best guess first and runs the cheapest test that could disprove it."],
["Pyramid principle","Communication structure that leads with the answer, then supporting arguments, then evidence."],
["80/20 rule","Pareto principle: a small share of causes usually drives most of the effect; focus analysis there."],
["Driver tree","A math decomposition of a metric into its input drivers, such as orders = users x frequency."],
["North Star metric","The single metric that best captures the value a product delivers to customers and predicts long-run success."],
["OKR","Objectives and Key Results: goal-setting system pairing a qualitative objective with measurable key results."],
["WBR","Weekly Business Review: recurring meeting reviewing core metrics, what moved, and why."],
["QBR","Quarterly Business Review: deeper quarterly review of performance against plan and priorities for next quarter."],
["Unit economics","Revenue and costs attributable to one unit (order, trip, subscriber, account) to test whether each unit makes money."],
["AOV","Average order value: average gross value per transaction."],
["GOV","Gross order value: total value of orders on a marketplace, including food, fees, and tips depending on definition."],

["Take rate","Share of gross value a marketplace keeps as revenue (revenue / GOV or revenue / gross bookings)."],
["Net revenue margin","DoorDash term for revenue as a percentage of Marketplace GOV; effectively the take rate."],
["Contribution margin","Revenue minus variable costs, as a percentage of revenue; profit each unit contributes to fixed costs."],
["Contribution profit","Dollar value of revenue minus variable costs for a unit, segment, or period."],
["Variable cost","A cost that rises with each additional unit sold, such as payment processing or courier pay."],
["CAC","Customer acquisition cost: fully loaded sales and marketing spend to acquire one new customer."],
["LTV","Lifetime value: total contribution expected from a customer over their lifetime, often discounted."],
["LTV/CAC","Ratio of lifetime value to acquisition cost; about 3x or more is a common health benchmark."],
["Payback period","Months of contribution needed to recover the acquisition cost of a customer."],
["Cohort payback","Payback computed on a cohort that accounts for churn, so it is longer than simple payback."],
["Churn","Share of customers (or revenue) lost in a period; equals 1 minus retention."],
["Retention","Share of customers (or revenue) still active after a period."],
["Cohort analysis","Tracking groups of customers who started in the same period to compare retention and value over time."],
["ARPU","Average revenue per user over a period; Spotify reports Premium ARPU per month."],
["MAU","Monthly active users."],
["MAPCs","Monthly active platform consumers: Uber metric for unique users who completed a Mobility or Delivery trip in a month."],
["ARR","Annual recurring revenue: annualized value of recurring contracts or run-rate usage."],
["NRR","Net revenue retention: revenue this period from a starting cohort divided by its starting revenue, including expansion, contraction, and churn."],

["Land and expand","GTM motion that starts with a small initial deal and grows revenue within the account over time."],
["Usage-based pricing","Pricing that charges by consumption (hosts, GB ingested, API calls) rather than a fixed seat or plan fee."],
["TAM","Total addressable market: total annual spend in a category if you had 100% share."],
["SAM","Serviceable addressable market: the part of TAM your product, channels, and geographies can actually serve."],
["SOM","Serviceable obtainable market: the share of SAM you can realistically win in a set period."],
["Top-down sizing","Market sizing that starts from a total category figure and narrows with percentages."],
["Bottom-up sizing","Market sizing that multiplies number of buyers by spend per buyer, built from unit-level assumptions."],
["Falsifiable","A hypothesis specific enough that a defined piece of evidence could prove it wrong."],
["Decision log","Record of decisions, owners, rationale, and success metrics, used to drive follow-through."],
["Adjusted EBITDA","Earnings before interest, taxes, depreciation, and amortization, adjusted for items like stock-based compensation; common profitability metric for marketplaces."],
["FCF","Free cash flow: operating cash flow minus capital expenditures."],
["Marketplace balance","State where supply (driver or courier hours) and demand (requests) are matched so fulfillment, wait times and prices stay within target ranges."],
["Supply hours","Total hours drivers or couriers are online and available in a window; drivers online times online hours per driver."],
["Utilization (ride-hailing)","Share of online time a driver spends en route to or on a trip; often tracked as trips per supply hour."],
["Surge pricing","Dynamic price multiplier applied when requests exceed available supply; rations demand and pulls in extra drivers."],
["Inframarginal spend","Incentive dollars paid for behavior that would have happened anyway, such as a bonus paid to drivers already online."],
["Cost per incremental hour","Incentive spend divided by the extra supply hours it truly causes; the core yardstick for comparing supply levers."],
["Driver reactivation","Campaigns that bring lapsed drivers back onto the platform, usually the cheapest source of new supply hours."],
["Dead miles","Distance driven without a passenger or order, such as repositioning or driving to a pickup; lowers trips per hour."],
["Unfulfilled request","A ride or order request that is not completed because no driver accepted or the rider cancelled after a long wait."],
["Earners","Uber term for drivers and couriers combined; about 10.8 million in Q3 2026."],
["Holdout group","Randomly chosen eligible users who do not receive a treatment, used to measure its true incremental effect."],
["Magic number","Sales efficiency ratio: quarter-over-quarter revenue increase times four, divided by prior-quarter sales and marketing spend."],
["Rule of 40","Heuristic that revenue growth percent plus profit margin percent (usually FCF margin) should be at least 40 for a healthy SaaS company."],
["CAC payback","Months of gross-margin-adjusted new ARR needed to recover sales and marketing spend; under 18 to 24 months is typical for healthy SaaS."],
["Net new ARR","Ending ARR minus starting ARR in a period: new logos plus expansion minus contraction and churn."],
["Burn multiple","Net cash burn divided by net new ARR; how many dollars a company burns to add one dollar of ARR (lower is better)."],
["Logo retention","Share of customers (counted, not weighted by dollars) still active at the end of a period."],
["cRPO","Current remaining performance obligations: contracted revenue expected to be recognized in the next 12 months."],
["Stock-based compensation","Non-cash expense for equity paid to employees; the main gap between GAAP and non-GAAP margins at software companies."],
["ARR bridge","Waterfall from starting to ending ARR showing new logos, expansion, contraction and churn."],
["Cloud backlog","Contracted Google Cloud revenue not yet recognized; $561B at Q3 2026, with just over 55% expected to convert within 24 months."],
["Incremental margin","Change in operating income divided by change in revenue; shows how much of each new revenue dollar reaches profit."],
["Capex intensity","Capital expenditures as a percent of revenue; Alphabet was about 40% in Q3 2026 versus about 23% a year earlier."],
["Traffic acquisition costs","TAC: payments Google makes to distribution partners (browsers, phone makers, network sites) for search and ad traffic."],
["Revenue per query","Search revenue divided by query volume; product of ad coverage, ads per query, click-through rate and cost per click."],
["AI Mode","Google Search surface that answers queries with Gemini-generated responses; monetized lower than classic Search in Q3 2026."],
["Google Services","Alphabet segment holding Search, YouTube ads, Google Network, and subscriptions, platforms and devices."],
["Other Bets","Alphabet segment for early-stage businesses such as Waymo and Verily."],
["TPU","Tensor Processing Unit: Google custom AI chip used internally and rented to outside customers through Google Cloud."],
["Cost synergy","Savings from combining two companies, such as overlapping tech, G&A, procurement or fulfillment costs."],
["Revenue synergy","Extra revenue only the combined company can earn, such as cross-selling or a larger ads network; less certain than cost synergies."],
["Dis-synergy","Value lost because of a merger, such as partners or customers who leave; subtract it to get net synergies."],
["Run-rate synergies","Annualized synergies once fully captured, usually 2 to 3 years after close; not what shows up in year one."],
["Integration management office","IMO: the cross-functional team that plans Day-1 readiness and tracks synergy capture after an acquisition."],
["Clean team","A walled-off group allowed to see competitively sensitive data from the other party before close, under strict rules."],
["Gun-jumping","Acting as one company before regulatory approval, such as coordinating prices; illegal under US antitrust law."],
["HSR waiting period","Hart-Scott-Rodino review period during which US antitrust agencies examine a deal before it can close."],
["Acquisition premium","Price paid above the target pre-deal market value; compare it with the capitalized value of synergies."],
["Bridge loan","Short-term financing committed to guarantee deal funding until longer-term debt or bonds are issued."],
["MAPC","Monthly active platform consumer: Uber metric for unique consumers who completed a Mobility or Delivery trip in a month."],
["Trips per MAPC","Monthly frequency per active consumer; together with MAPCs and GB per trip it decomposes Uber booking growth."],
["Segment operating income","Uber segment profit measure (replacing segment adjusted EBITDA as the key measure); compared as a share of gross bookings."],
["Principal vs agent","Accounting choice of whether a marketplace books the full fare as revenue (principal) or only its fee (agent); changes revenue without changing bookings."],
["Multi-product consumer","A customer who uses more than one product line, such as rides and delivery; such users have higher frequency and retention."],
["AV utilization","Trips or paid hours per autonomous vehicle per day; the key metric for robotaxi economics on a demand platform."],
["Demand aggregator","A platform that supplies customers to many supply partners, such as Uber offering trips to several AV fleets."],
["Cash conversion","Free cash flow as a share of adjusted EBITDA; high for asset-light marketplaces, low for capex-heavy businesses."],
["Observability","Monitoring of systems through metrics, logs and traces so engineers can see why something broke; the market Datadog leads."],
["APM","Application performance monitoring: tracing requests through code and services to find slow or failing parts."],
["Platform consolidation","Customers buying several tools from one vendor instead of best-of-breed point tools; raises products per customer and switching cost."],
["Commit plus on-demand","Usage pricing where a customer prepays an annual commitment at a discount and pays list rates for usage above it."],
["Early renewal","Renewing a contract before it expires, usually at a higher commitment in exchange for a deeper unit discount."],
["AI-native cohort","Customers whose core product is AI models or agents; fast-growing but concentrated and volatile spenders."],
["Revenue per customer growth","Revenue growth left after removing customer-count growth: (1 + revenue growth) / (1 + customer growth) - 1."],
["Observability pipeline","Software that collects, filters and routes telemetry before it reaches a storage or analytics tool; controls cost and destination."],
];

<script id="ch04-doordash">
chapter({part:"Part VI · Company Deep-Dives", id:"doordash-deep-dive", num:"04", title:"DoorDash Deep-Dive: Three-Sided Marketplace Economics", mins:20, tag:"Company · DoorDash", html:`
<p>DoorDash is the cleanest case study in this handbook for <b>marketplace unit economics</b>. Every order touches three customers (a consumer, a merchant, and a Dasher), and the company only keeps a thin slice of the money that flows through. An S&amp;O operator at DoorDash spends most of the day on one question: <i>how do we grow orders while keeping each order profitable and each side of the market happy?</i> This chapter covers the business model, how to read the latest numbers, the strategic bets (including the pending Instacart deal), and what S&amp;O interviews there tend to probe.</p>

<h3>The business model in one picture</h3>
<div class="diagwrap">
<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="13">

<p>The flywheel: more consumers bring more orders, which attract more merchants (selection) and give Dashers more earning opportunity, which cuts delivery times, which brings more consumers. S&amp;O work usually targets a <b>weak link</b> in that loop in a specific market.</p>

<h3>The metrics DoorDash reports, and how to read them</h3>
<table>
<tr><th>Metric</th><th>Definition</th><th>Why an operator cares</th></tr>
<tr><td><b>Total Orders</b></td><td>Orders completed through Marketplace and Drive (white-label delivery)</td><td>Top-line volume; split into active consumers x frequency</td></tr>
<tr><td><b>Marketplace GOV</b></td><td>Total dollar value of Marketplace orders, including taxes, tips, and consumer fees</td><td>Captures both volume and basket size; grocery raises AOV</td></tr>
<tr><td><b>Net revenue margin</b></td><td>Revenue / Marketplace GOV</td><td>DoorDash's take rate; rises with ads, falls with consumer affordability investment</td></tr>
<tr><td><b>Contribution profit</b></td><td>Revenue minus variable costs such as Dasher pay beyond fees, payments, support, refunds</td><td>The truest per-order profit signal</td></tr>
<tr><td><b>Adjusted EBITDA as % of GOV</b></td><td>Adj. EBITDA / Marketplace GOV</td><td>The profitability ratio management guides on; a few basis points matter</td></tr>
</table>

<h3>Q3 2026 by the numbers</h3>
<table>
<tr><th>Metric (Q3 2026)</th><th>Reported</th><th>Growth Y/Y</th></tr>
<tr><td>Total Orders</td><td>993M</td><td>+28% (+17% ex-Deliveroo)</td></tr>
<tr><td>Marketplace GOV</td><td>$33.9B</td><td>+36% (+23% ex-Deliveroo)</td></tr>
<tr><td>Revenue</td><td>$4.62B (Deliveroo contributed $365M)</td><td>+34% (+23% ex-Deliveroo)</td></tr>
<tr><td>Net revenue margin</td><td>13.6%</td><td>n/a</td></tr>
<tr><td>Contribution profit</td><td>$1.78B (38.6% of revenue; 5.2% of GOV)</td><td>n/a</td></tr>
<tr><td>Adjusted EBITDA</td><td>$1.06B (3.1% of GOV)</td><td>+41%</td></tr>
<tr><td>GAAP net income</td><td>$466M</td><td>+91%</td></tr>
<tr><td>Free cash flow</td><td>$787M</td><td>+9%</td></tr>
<tr><td>Q4 2026 outlook</td><td>GOV $35.4B to $36.4B; adj. EBITDA $900M to $1.1B</td><td></td></tr>
</table>
<p style="font-size:12.5px;color:var(--muted)">Source: <a href="https://www.sec.gov/Archives/edgar/data/0001792789/000179278926000062/proddashex991-pressrelease.htm" target="_blank">DoorDash Q3 2026 earnings release (SEC 8-K exhibit 99.1)</a>. Deliveroo was acquired in 2025, so headline growth includes acquired volume; DoorDash said it will stop disclosing ex-Deliveroo figures starting Q4 2026.</p>

<div class="callout example"><span class="lbl">Worked example · per-order economics from the Q3 2026 release</span>
<p>Divide each reported line by 993M orders. (Order count includes Drive orders that carry no Marketplace GOV, so these are blended approximations, but the shape is right.)</p>
<table>
<tr><th>Line</th><th>Math</th><th>Per order</th></tr>
<tr><td>GOV per order</td><td>$33,941M / 993M</td><td>~$34.18</td></tr>
<tr><td>Revenue per order</td><td>$4,616M / 993M</td><td>~$4.65</td></tr>
<tr><td>Contribution profit per order</td><td>$1,780M / 993M</td><td>~$1.79</td></tr>
<tr><td>Adj. EBITDA per order</td><td>$1,060M / 993M</td><td>~$1.07</td></tr>
</table>
<p><b>So what:</b> on a roughly $34 order, DoorDash keeps about $4.65, and about $1.07 becomes adjusted EBITDA. A <b>10-cent</b> change in per-order cost (one extra minute of Dasher wait time, one more refund in 50) is roughly a 9% swing in per-order EBITDA. That is why DoorDash S&amp;O obsesses over operational efficiency in cents, not dollars.</p>
<p><b>Organic vs acquired:</b> prior-year orders were about 993 / 1.28 = 776M. Ex-Deliveroo growth of 17% implies about 776 x 1.17 = 908M organic orders, so Deliveroo added roughly <b>85M orders</b> in the quarter (derived estimate, not a reported figure). Always split the two before you praise or worry about growth.</p>
</div>

<h3>Strategic bets an S&amp;O operator would work on</h3>
<table>
<tr><th>Bet</th><th>What is happening</th><th>Typical S&amp;O questions</th></tr>
<tr><td><b>Grocery and retail</b></td><td>U.S. grocery and retail GOV grew more than twice as fast as restaurants in Q3; DoorDash now runs inventory in its own warehouses (DashMart) with 99%+ accuracy and faster deliveries.</td><td>Where to open the next warehouse? Is first-party inventory margin-accretive after shrink and labor? How to price bigger baskets?</td></tr>
<tr><td><b>Instacart acquisition</b></td><td>Agreed Oct 2026 at $65 per share (~$17B equity value), at least 75% cash, close expected late 2027 or 1H 2028 pending HSR and other approvals. Targets $500M+ annual net synergies over several years; year one reinvests more than 100% of synergies. Instacart brand and app to remain; one combined membership fee is an option.</td><td>Synergy model (shared Dasher/shopper supply, ads, merchant tech); overlap analysis by metro; antitrust narrative; membership bundling economics.</td></tr>
<tr><td><b>DashPass and affordability</b></td><td>Strong U.S. DashPass growth in Q3; DashPass helped lower U.S. restaurant transaction fees per order by 9% over two years.</td><td>Member vs non-member frequency and retention; fee-reduction payback; partner bundles.</td></tr>
<tr><td><b>International (incl. Deliveroo)</b></td><td>Order growth accelerated at every international brand; profit contribution beat internal expectations.</td><td>Market prioritization, integration roadmap, which country reaches contribution breakeven next.</td></tr>
<tr><td><b>New surfaces and AI</b></td><td>Restaurant reservations grew over 340% Q/Q; launched Ask DoorDash, Text DoorDash, and an MCP interface for external AI agents. Autonomy and warehousing named as areas of substantial capital investment.</td><td>Sizing reservations as a merchant product; agentic-ordering channel economics; capex business cases.</td></tr>
</table>
<p style="font-size:12.5px;color:var(--muted)">Sources: <a href="https://www.sec.gov/Archives/edgar/data/0001792789/000179278926000062/proddashex991-pressrelease.htm" target="_blank">DoorDash Q3 2026 release</a> · <a href="https://www.fox5ny.com/news/doordash-buying-instacart-17b-what-means-customers" target="_blank">FOX 5 on what the Instacart deal means for customers</a> · <a href="https://www.sec.gov/Archives/edgar/data/0001792789/000179278926000070/dash-20260930.htm" target="_blank">DoorDash Q3 2026 10-Q</a>.</p>

<h3>What S&amp;O teams at DoorDash typically do</h3>
<ul>
  <li><b>Local / market operations strategy:</b> own a region's P&amp;L drivers: selection gaps, Dasher supply in peak hours, delivery quality (lateness, missing items), and promo efficiency.</li>
  <li><b>New verticals strategy:</b> launch plans, merchant acquisition targets, and unit economics for grocery, convenience, retail, and alcohol.</li>
  <li><b>Business planning:</b> annual and quarterly targets per market, translating company GOV and EBITDA goals into per-region driver trees.</li>
  <li><b>Pricing and fees:</b> consumer fees, DashPass pricing, merchant commission tiers, and the trade-off between affordability and take rate.</li>
</ul>

<h3>What interviews tend to emphasize</h3>
<div class="callout tip"><span class="lbl">Interview pattern</span>Expect a metric-diagnosis case ("orders flat in a market"), a launch or prioritization case ("which vertical next?"), and heavy probing on <b>SQL / spreadsheet fluency</b> and <b>bias to action</b>. DoorDash culture prizes operators who go to the ground truth (do a dash, call merchants) and who quantify trade-offs across all three sides. Always say which side of the marketplace a lever helps and which it hurts.</div>

<h3>Practice: diagnose flat grocery orders</h3>
<p><b>Prompt (illustrative):</b> In one mid-size U.S. metro, DoorDash grocery orders have been flat for six weeks while restaurant orders grew 15% Y/Y. Structure your diagnosis, then open the model answer.</p>
<details><summary>Show model answer</summary>
<p><b>Clarify:</b> flat in absolute orders or flat vs a growing plan? Any merchant changes (a big grocer leaving or adding a competitor exclusive)? Any measurement change?</p>
<p><b>Structure</b> (orders = active grocery consumers x frequency), by side of the marketplace:</p>
<ul>
  <li><b>Demand:</b> new grocery trial down (fewer cross-sell prompts to restaurant users?), repeat rate down (bad first experience), DashPass grocery benefits changed.</li>
  <li><b>Merchant / selection:</b> store coverage, in-stock rates, item substitution quality, price markups versus in-store.</li>
  <li><b>Supply / fulfillment:</b> shopper availability for longer grocery jobs, delivery windows, missing or wrong items driving refunds and churn.</li>
  <li><b>Competition:</b> a rival promo or a grocer pushing its own delivery.</li>
</ul>
<p><b>Data to ask for:</b> cohort retention of first-time grocery buyers, item-level substitution and refund rates by store, share of restaurant users who tried grocery, delivery-time distribution for grocery vs restaurant.</p>
<p><b>Plausible answer:</b> trial is steady but 30-day repeat fell from 40% to 30% after a large grocer had in-stock problems; fix with inventory data integration and substitution defaults, then re-target lapsed first-time buyers.</p>
</details>

<div class="quiz" data-a="1">
  <div class="q">Self-check: In Q3 2026 DoorDash reported revenue of $4.62B on Marketplace GOV of $33.9B. Which ratio does this give you?</div>
  <button class="opt">Contribution margin of 13.6%</button>
  <button class="opt">Net revenue margin (take rate) of about 13.6%</button>
  <button class="opt">Adjusted EBITDA margin of 13.6%</button>
  <button class="opt">Organic growth rate of 13.6%</button>
  <div class="exp">Revenue / GOV is DoorDash's net revenue margin, effectively its take rate. Contribution margin is contribution profit / revenue (38.6%), and adjusted EBITDA was 3.1% of GOV.</div>
</div>

<div class="quiz" data-a="2">
  <div class="q">Self-check: Total orders grew 28% but only 17% ex-Deliveroo. What is the best first statement in an interview?</div>
  <button class="opt">DoorDash grew 28%, an acceleration</button>
  <button class="opt">Growth slowed because Deliveroo is shrinking</button>
  <button class="opt">Organic order growth was 17%; the other 11 points came from acquired Deliveroo volume</button>
  <button class="opt">The numbers cannot be compared</button>
  <div class="exp">Separate organic from inorganic growth before judging momentum. Deliveroo was not owned in the prior-year quarter, so its volume inflates reported growth.</div>
</div>
