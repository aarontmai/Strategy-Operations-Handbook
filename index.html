<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategy &amp; Operations Operator Handbook</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#141a22; --panel2:#1b232e; --panel3:#232d3a; --line:#2b3644;
    --txt:#e8eef5; --muted:#93a1b3; --dim:#63718400;
    --accent:#3fb6ff; --accent2:#7ee787; --warn:#ffcb6b; --pink:#ff7b9c; --purple:#b892ff; --red:#ff6b6b;
    --hy:#f5a524;
    --radius:12px; --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--txt);line-height:1.65;font-size:15.5px}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  .app{display:flex;min-height:100vh}
  /* Sidebar */
  .sidebar{width:320px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
    position:sticky;top:0;height:100vh;overflow-y:auto;padding:0 0 40px}
  .brand{padding:20px 22px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:5}
  .brand h1{font-size:15.5px;margin:0 0 4px;letter-spacing:.2px;line-height:1.35}
  .brand .sub{font-size:11.5px;color:var(--muted)}
  .brand .hy{color:var(--hy);font-weight:700}
  .progwrap{padding:12px 22px 6px}
  .progbar{height:7px;background:var(--panel3);border-radius:5px;overflow:hidden}
  .progfill{height:100%;width:0;background:linear-gradient(90deg,var(--hy),var(--accent2));transition:width .4s}
  .progtxt{font-size:11px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
  .pagecount{font-size:11px;color:var(--warn);padding:2px 22px 10px}
  .searchwrap{padding:6px 16px 10px}
  #navSearch{width:100%;padding:9px 12px;background:var(--panel3);border:1px solid var(--line);border-radius:8px;color:var(--txt);font-size:13px}
  nav .part{font-size:10.5px;text-transform:uppercase;letter-spacing:1.3px;padding:16px 22px 5px;color:var(--hy);font-weight:700}
  nav a.navlink{display:flex;gap:9px;padding:7px 22px 7px 22px;color:var(--muted);font-size:13.3px;cursor:pointer;border-left:3px solid transparent;align-items:baseline}
  nav a.navlink:hover{background:var(--panel2);color:var(--txt)}
  nav a.navlink.active{background:var(--panel2);color:var(--txt);border-left-color:var(--hy)}
  nav .cnum{font-family:var(--mono);font-size:10.5px;color:var(--accent);min-width:26px}
  nav a.done .cnum::after{content:'✓';color:var(--accent2);margin-left:3px}
  nav a.tool .cnum{color:var(--warn)}
  /* Content */
  .wrap{flex:1;min-width:0}
  .topbar{display:none}
  .content{max-width:900px;margin:0 auto;padding:34px 48px 120px}
  .chapter{display:none}
  .chapter.active{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .crumb{font-size:12px;color:var(--muted);margin-bottom:6px}
  .crumb .hy{color:var(--hy)}
  h2.ctitle{font-size:29px;margin:0 0 6px;letter-spacing:.2px;line-height:1.2}
  .cmeta{font-size:12px;color:var(--muted);margin-bottom:22px;display:flex;gap:14px;flex-wrap:wrap}
  .cmeta span{display:inline-flex;gap:5px;align-items:center}
  h3{font-size:20px;margin:34px 0 10px;padding-top:8px;border-top:1px solid var(--line)}
  h3:first-of-type{border-top:none}
  h4{font-size:16px;margin:22px 0 6px;color:var(--accent2)}
  h5{font-size:14px;margin:16px 0 4px;color:var(--warn);text-transform:uppercase;letter-spacing:.5px}
  p{margin:11px 0}
  ul,ol{margin:11px 0;padding-left:24px} li{margin:6px 0}
  code{font-family:var(--mono);background:var(--panel3);padding:1.5px 6px;border-radius:5px;font-size:13px;color:var(--warn)}
  pre{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.5}
  pre code{background:none;padding:0;color:var(--txt)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;margin:16px 0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .callout{border-left:3px solid var(--accent);background:var(--panel2);padding:12px 16px;border-radius:0 8px 8px 0;margin:16px 0}
  .callout.tip{border-left-color:var(--accent2)} .callout.warn{border-left-color:var(--warn)}
  .callout.danger{border-left-color:var(--red)} .callout.hy{border-left-color:var(--hy)}
  .callout.example{border-left-color:var(--purple)}
  .callout .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;font-weight:800;color:var(--accent);display:block;margin-bottom:3px}
  .callout.tip .lbl{color:var(--accent2)} .callout.warn .lbl{color:var(--warn)}
  .callout.danger .lbl{color:var(--red)} .callout.hy .lbl{color:var(--hy)} .callout.example .lbl{color:var(--purple)}
  table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13.3px}
  th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
  th{background:var(--panel3);font-weight:600}
  tr:nth-child(even) td{background:rgba(255,255,255,.015)}
  .diagwrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:18px 0;overflow-x:auto}
  .diagcap{font-size:12px;color:var(--muted);text-align:center;margin-top:8px;font-style:italic}
  svg{max-width:100%;height:auto}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:12px;font-weight:600;background:var(--panel3);color:var(--accent)}
  .kbd{font-family:var(--mono);font-size:12px;background:var(--panel3);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px}
  .navbtns{display:flex;justify-content:space-between;gap:12px;margin:40px 0 0;padding-top:20px;border-top:1px solid var(--line)}
  .navbtns button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:12px 18px;border-radius:9px;cursor:pointer;font-size:13.5px;flex:1;text-align:left}
  .navbtns button:hover{border-color:var(--hy)} .navbtns button.next{text-align:right}
  .navbtns .dir{font-size:11px;color:var(--muted);display:block}
  /* Quiz */
  .quiz{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;margin:16px 0}
  .quiz .q{font-weight:600;margin-bottom:8px}
  .quiz .opt{display:block;width:100%;text-align:left;background:var(--panel3);border:1px solid var(--line);color:var(--txt);padding:9px 13px;border-radius:8px;margin:6px 0;cursor:pointer;font-size:13.6px}
  .quiz .opt:hover{border-color:var(--accent)}
  .quiz .opt.correct{border-color:var(--accent2);background:rgba(126,231,135,.12)}
  .quiz .opt.wrong{border-color:var(--pink);background:rgba(255,123,156,.12)}
  .quiz .opt:disabled{cursor:default}
  .quiz .exp{font-size:13px;color:var(--muted);margin-top:9px;padding:10px 12px;background:var(--panel2);border-radius:8px;display:none}
  .quiz .exp.show{display:block}
  /* interactive tools */
  .tool{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin:16px 0}
  .tool label{font-size:12.5px;color:var(--muted);display:block;margin:8px 0 3px}
  .tool input,.tool select{background:var(--panel3);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:8px 10px;font-size:13.5px;font-family:var(--mono)}
  .tool input[type=range]{width:100%;padding:0}
  .btn{background:linear-gradient(90deg,var(--hy),#e0821c);color:#1a1002;border:none;font-weight:700;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:13.5px}
  .btn:hover{opacity:.92}
  .out{font-family:var(--mono);font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:10px;white-space:pre-wrap}
  .flashrow{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
  .flash{background:var(--panel3);border:1px solid var(--line);border-radius:10px;padding:11px 13px;min-width:140px;flex:1;cursor:pointer}
  .flash .front{font-family:var(--mono);color:var(--accent);font-weight:700;font-size:13px}
  .flash .back{font-size:12.5px;color:var(--muted);margin-top:5px;display:none}
  .flash.flip .back{display:block} .flash.flip .front{color:var(--accent2)}
  .gterm{border-bottom:1px solid var(--line);padding:10px 0} .gterm b{color:var(--accent)}
  .stat{display:inline-block;background:var(--panel3);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:4px 6px 4px 0;font-size:12.5px}
  .stat b{color:var(--hy);font-size:16px;display:block}
  .toc-part{margin:22px 0 8px;font-size:13px;color:var(--hy);font-weight:700;text-transform:uppercase;letter-spacing:1px}
  .toc-item{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .toc-item:hover{color:var(--accent)} .toc-item .n{font-family:var(--mono);color:var(--accent);min-width:34px}
  @media(max-width:880px){
    .sidebar{position:fixed;left:-330px;z-index:40;transition:left .3s} .sidebar.open{left:0}
    .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);padding:11px 15px}
    .menubtn{background:var(--panel3);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 12px;cursor:pointer}
    .content{padding:20px 16px 90px} .grid2,.grid3{grid-template-columns:1fr}
  }
  details{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 16px;margin:16px 0}
  details summary{cursor:pointer;font-weight:700;color:var(--hy)}
  details[open] summary{margin-bottom:8px}
  .timer{font-family:var(--mono);font-size:34px;font-weight:800;color:var(--hy);margin:8px 0}
  .btn.ghost{background:var(--panel3);color:var(--txt);border:1px solid var(--line)}
  .tool textarea{width:100%;min-height:90px;background:var(--panel3);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:8px 10px;font-size:13.5px}
  nav a.navlink.tool{background:none;border:none;border-left:3px solid transparent;border-radius:0;padding:7px 22px;margin:0}
  nav a.navlink.tool:hover,nav a.navlink.tool.active{background:var(--panel2)} nav a.navlink.tool.active{border-left-color:var(--hy)}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1><span class="hy">S&amp;O</span> Strategy &amp; Operations<br>Operator Handbook</h1>
      <div class="sub">BizOps training · Datadog · Spotify · Google · DoorDash · Uber</div>
      <div class="progwrap">
        <div class="progbar"><div class="progfill" id="progfill"></div></div>
        <div class="progtxt"><span id="progtxt">0 read</span><span id="progpct">0%</span></div>
      </div>
    </div>
    <div class="pagecount" id="pagecount">Measuring content…</div>
    <div class="searchwrap"><input id="navSearch" placeholder="🔍 Search chapters…" oninput="filterNav(this.value)"></div>
    <nav id="nav"></nav>
  </aside>
  <div class="wrap">
    <div class="topbar">
      <button class="menubtn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <strong id="mobTitle" style="font-size:14px">Contents</strong>
    </div>
    <main class="content" id="content"></main>
  </div>
</div>

<script>
/* ============================================================
   HANDBOOK ENGINE
   Chapters are pushed into CH[] by content blocks below.
   Each: {part, id, num, title, mins, tag, html}
   Tools/quizzes are wired by id after render.
   At boot, chapters are ordered by PART_ORDER then num, so a
   chapter appended later still lands under its own Part heading.
   ============================================================ */
const CH = [];
function chapter(o){ CH.push(o); }
const PART_ORDER = ["Front matter","Part I","Part II","Part III","Part IV","Part V","Part VI","Part VII","Part VIII","Part IX","Part X","Reference"];
function partRank(p){
  const key = (p||'').split(' · ')[0].trim();
  const i = PART_ORDER.indexOf(key);
  return i<0 ? 50 : i;
}
function sortChapters(){
  const idx = new Map(CH.map((c,i)=>[c,i]));
  CH.sort((a,b)=>{
    const pr = partRank(a.part)-partRank(b.part); if(pr) return pr;
    const na = parseFloat(a.num), nb = parseFloat(b.num);
    if(!isNaN(na) && !isNaN(nb) && na!==nb) return na-nb;
    if(String(a.num)!==String(b.num)) return String(a.num).localeCompare(String(b.num));
    return idx.get(a)-idx.get(b);
  });
}

/* ---- Interactive tool builders (referenced from chapter html) ---- */
const TOOLS = {};

/* Unit economics: AOV, take rate, CAC, contribution margin, retention -> LTV, LTV/CAC, payback */
TOOLS.unitEconomics = () => `
<div class="tool" id="ueTool">
  <h4 style="margin-top:0">📐 Unit Economics Calculator (LTV · LTV/CAC · Payback)</h4>
  <p style="font-size:13px;color:var(--muted)">Works for marketplaces (set take rate below 100%) and subscriptions (set take rate to 100% and AOV to the monthly price, 1 order per month). All math is monthly.</p>
  <div style="display:flex;gap:16px;flex-wrap:wrap">
    <div><label>AOV / price per order ($)</label><input id="ueAov" value="35" size="7"></div>
    <div><label>Take rate (% of AOV kept as revenue)</label><input id="ueTake" value="13" size="5"></div>
    <div><label>Contribution margin (% of revenue)</label><input id="ueCm" value="40" size="5"></div>
    <div><label>Orders per customer per month</label><input id="ueFreq" value="3" size="5"></div>
    <div><label>Monthly retention (%)</label><input id="ueRet" value="92" size="5"></div>
    <div><label>CAC ($ per new customer)</label><input id="ueCac" value="45" size="6"></div>
    <div><label>Annual discount rate (%)</label><input id="ueDisc" value="10" size="5"></div>
  </div>
  <div style="margin-top:12px"><button class="btn" onclick="runUnitEcon()">Compute</button></div>
  <div class="out" id="ueOut">—</div>
</div>`;

/* Market sizing: top-down and bottom-up TAM / SAM / SOM */
TOOLS.marketSizing = () => `
<div class="tool" id="msTool">
  <h4 style="margin-top:0">🌐 Market Sizing Builder (TAM · SAM · SOM)</h4>
  <p style="font-size:13px;color:var(--muted)">Build the number two ways and compare. If top-down and bottom-up differ by more than about 2x, one of your assumptions is wrong; find it before you present.</p>
  <h5>Top-down</h5>
  <div style="display:flex;gap:16px;flex-wrap:wrap">
    <div><label>Total category spend ($M / yr)</label><input id="msTot" value="50000" size="9"></div>
    <div><label>Serviceable share (% of TAM you can reach)</label><input id="msSamPct" value="30" size="5"></div>
    <div><label>Obtainable share (% of SAM in 3-5 yrs)</label><input id="msSomPct" value="8" size="5"></div>
  </div>
  <h5>Bottom-up</h5>
  <div style="display:flex;gap:16px;flex-wrap:wrap">
    <div><label>Number of potential buyers (units)</label><input id="msN" value="2000000" size="10"></div>
    <div><label>Annual spend per buyer ($)</label><input id="msSpend" value="12000" size="8"></div>
    <div><label>Reachable (% in your segments / geos)</label><input id="msReach" value="35" size="5"></div>
    <div><label>Win share of reachable (%)</label><input id="msWin" value="7" size="5"></div>
  </div>
  <div style="margin-top:12px"><button class="btn" onclick="runMarketSizing()">Build</button></div>
  <div class="out" id="msOut">—</div>
</div>`;

/* Case practice timer */
const CASES = [
  {co:"DoorDash", p:"DoorDash grocery order volume in one metro has been flat for three months while restaurant orders grew 12%. Diagnose and recommend.",
   o:"1) Clarify: flat orders vs flat GOV? new vs repeat customers? which retailers?\n2) Decompose orders = active grocery consumers x order frequency. Consumers = reach x trial conversion x repeat.\n3) Supply side: retailer coverage, in-stock rate, substitution rate, Dasher shop-and-deliver times.\n4) Demand side: price gap vs in-store, fees, DashPass penetration, competitor promos (Instacart, Walmart, Amazon).\n5) Experience: missing items, late orders, refunds -> repeat rate.\n6) Likely root cause pattern: trial is fine but 30-day repeat fell because substitution/missing-item rate rose after a retailer catalog change.\n7) Recommend: fix catalog + in-stock signals, targeted credits for affected cohort, measure repeat rate weekly; size impact."},
  {co:"Spotify", p:"Should Spotify raise the Premium Individual price by 1 unit of local currency in a mid-size European market?",
   o:"1) Objective: revenue and gross profit, without hurting long-run subscriber growth.\n2) Revenue math: subs x ARPU. Price up p% -> need churn+lost-adds below the break-even volume loss = p/(p+margin effect).\n3) Evidence: past price-increase cohorts (churn spike, recovery), elasticity by plan (Individual, Duo, Family, Student), competitor prices.\n4) Royalty structure: label payouts scale with revenue, so gross margin % changes less than revenue.\n5) Mitigations: grandfathering, lead-time notices, push plan mix (Family/Duo), bundle value (audiobooks hours).\n6) Recommend: yes if modeled churn uplift < break-even; stage rollout, monitor churn and downgrade to Free weekly."},
  {co:"Datadog", p:"Datadog trailing-12-month net revenue retention dipped by two points. Why, and what would you do?",
   o:"1) Define NRR = (start ARR + expansion - contraction - churn) / start ARR for a cohort.\n2) Decompose the dip: expansion slower? contraction (usage optimization) up? logo churn up?\n3) Slice: by customer size (enterprise vs SMB), by product (infra, APM, logs, security), by cohort year, by industry.\n4) Usage-based nuance: customers optimize log volume/retention; commits vs on-demand; ramp timing.\n5) Leading indicators: product adoption count per customer, commit renewals, usage growth per host.\n6) Actions: cost-optimization tools that keep customers on platform, multi-product attach plays, pricing for high-volume logs, CSM coverage on at-risk accounts."},
  {co:"Uber", p:"Rider wait times in a large city spike every Friday 5-8pm and surge is firing constantly. Fix driver supply.",
   o:"1) Measure: ETA, unfulfilled requests, surge multiplier, driver hours online, utilization, by 15-min bucket and zone.\n2) Diagnose: is it total hours, positioning, or acceptance? Compare demand curve vs supply curve.\n3) Levers on supply: scheduled incentives (quests), heat maps, advance notice of events, earnings guarantees, bring in Eats couriers / multi-apping, product mix (shared, wait-and-save).\n4) Levers on demand: reserve in advance, price products differently, AV fleet in zones if available.\n5) Economics: cost of incentives per incremental trip vs contribution per trip; avoid paying for hours that would happen anyway (incrementality test).\n6) Recommend a geo-holdout test of targeted Friday incentives; success = ETA and completion rate, cost per incremental hour."},
  {co:"Google", p:"Size the market for Google Cloud selling AI and data platform services to US regional banks.",
   o:"1) Define: US banks below the top ~20 by assets; product = cloud data/AI platform spend (not core banking software).\n2) Bottom-up: number of banks x IT budget per bank x share for cloud data/AI x share addressable by a hyperscaler.\n3) Top-down cross-check: US bank IT spend x regional share x cloud share x data/AI share.\n4) Constraints: regulation, vendor-risk reviews, core-banking vendors, partner (SI) channel.\n5) SOM: realistic share vs AWS/Azure given partner reach; 3-5 year ramp.\n6) Output: TAM/SAM/SOM table, key assumptions, the two assumptions that move the answer most."},
  {co:"Uber", p:"Uber One membership growth has slowed. Should Uber lower the price or add benefits?",
   o:"1) Objective: total contribution from members vs non-members, not just member count.\n2) Funnel: eligible users -> trial -> paid -> retained. Find which step slowed.\n3) Member value: incremental trips/orders per member, cross-platform usage (Rides + Eats).\n4) Price cut: more members but subsidizes already-loyal users (cannibalization).\n5) Benefit add: targeted to segments with low perceived value; cost per benefit.\n6) Recommend test cells: price, benefit, trial length; read incremental contribution per eligible user."},
];
TOOLS.caseTimer = () => `
<div class="tool" id="ctTool">
  <h4 style="margin-top:0">⏱ Case Practice Timer (25 min)</h4>
  <p style="font-size:13px;color:var(--muted)">Pick a prompt (or Random), start the timer, and write your structure in the box. The model outline unlocks when time is up, or reveal early if you are stuck.</p>
  <label>Prompt</label>
  <select id="ctSel" style="width:100%">${CASES.map((c,i)=>'<option value="'+i+'">'+c.co+' · '+c.p.slice(0,80)+'…</option>').join('')}</select>
  <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn" onclick="ctStart(false)">Start 25:00</button>
    <button class="btn ghost" onclick="ctStart(true)">Random prompt</button>
    <button class="btn ghost" onclick="ctReveal()">Reveal outline</button>
    <button class="btn ghost" onclick="ctReset()">Reset</button>
  </div>
  <div class="timer" id="ctClock">25:00</div>
  <div class="out" id="ctPrompt">Choose a prompt and press Start.</div>
  <label>Your notes (not saved)</label>
  <textarea id="ctNotes" placeholder="Clarifying questions, structure, hypotheses, math, recommendation…"></textarea>
  <div class="out" id="ctOutline" style="display:none"></div>
</div>`;

/* ---- render nav ---- */
function buildNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML='';
  let lastPart='';
  CH.forEach(c=>{
    if(c.part!==lastPart){
      const d=document.createElement('div'); d.className='part'; d.textContent=c.part; nav.appendChild(d); lastPart=c.part;
    }
    const a=document.createElement('a'); a.className='navlink'+(c.tool?' tool':''); a.dataset.id=c.id; a.dataset.title=c.title.toLowerCase();
    a.innerHTML=`<span class="cnum">${c.num}</span><span>${c.title}</span>`;
    a.onclick=()=>show(c.id); nav.appendChild(a);
  });
}
function filterNav(v){
  v=v.toLowerCase();
  document.querySelectorAll('#nav .navlink').forEach(a=>{a.style.display=a.dataset.title.includes(v)?'':'none';});
}

const visited=new Set();
function renderChapter(c){
  const sec=document.createElement('section'); sec.className='chapter'; sec.id='ch-'+c.id;
  const idx=CH.findIndex(x=>x.id===c.id);
  const prev=CH[idx-1], next=CH[idx+1];
  sec.innerHTML=`
    <div class="crumb"><span class="hy">${c.part}</span> &nbsp;›&nbsp; Chapter ${c.num}</div>
    <h2 class="ctitle">${c.title}</h2>
    <div class="cmeta">${c.mins?`<span>⏱ ${c.mins} min read</span>`:''}${c.tag?`<span>🏷 ${c.tag}</span>`:''}</div>
    ${c.html}
    <div class="navbtns">
      ${prev?`<button onclick="show('${prev.id}')"><span class="dir">‹ Previous</span>${prev.num} · ${prev.title}</button>`:'<span></span>'}
      ${next?`<button class="next" onclick="show('${next.id}')"><span class="dir">Next ›</span>${next.num} · ${next.title}</button>`:'<span></span>'}
    </div>`;
  document.getElementById('content').appendChild(sec);
  return sec;
}
const rendered={};
function show(id){
  const c=CH.find(x=>x.id===id); if(!c) return;
  if(!rendered[id]){ renderChapter(c); rendered[id]=true; wireInteractive(id); if(id==='intro') buildTOC(); }
  document.querySelectorAll('.chapter').forEach(s=>s.classList.remove('active'));
  document.getElementById('ch-'+id).classList.add('active');
  document.querySelectorAll('#nav .navlink').forEach(a=>a.classList.toggle('active',a.dataset.id===id));
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('mobTitle').textContent=c.num+' · '+c.title;
  visited.add(id); markProgress();
  window.scrollTo({top:0,behavior:'smooth'});
  location.hash=id;
}
function markProgress(){
  const total=CH.filter(c=>!c.tool).length||1;
  const done=[...visited].filter(v=>{const c=CH.find(x=>x.id===v);return c&&!c.tool;}).length;
  document.getElementById('progfill').style.width=(done/total*100)+'%';
  document.getElementById('progtxt').textContent=`${done}/${total} chapters`;
  document.getElementById('progpct').textContent=Math.round(done/total*100)+'%';
  visited.forEach(v=>{const l=[...document.querySelectorAll('#nav .navlink')].find(a=>a.dataset.id===v);if(l)l.classList.add('done');});
}

/* measure total words -> page estimate (350 words/page) */
function measurePages(){
  let words=0;
  CH.forEach(c=>{ const tmp=document.createElement('div'); tmp.innerHTML=c.html; words += (tmp.textContent||'').trim().split(/\s+/).length; });
  const pages=Math.round(words/350);
  document.getElementById('pagecount').textContent=`📖 ~${pages} pages · ${words.toLocaleString()} words · ${CH.filter(c=>!c.tool).length} chapters`;
}

/* ---- interactive wiring ---- */
function wireInteractive(id){
  document.querySelectorAll('#ch-'+id+' .quiz').forEach(qz=>{
    const ans=parseInt(qz.dataset.a);
    qz.querySelectorAll('.opt').forEach((b,i)=>{
      b.onclick=()=>{
        if(qz.dataset.done) return; qz.dataset.done=1;
        qz.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true; if(j===ans)x.classList.add('correct'); if(j===i&&i!==ans)x.classList.add('wrong');});
        const e=qz.querySelector('.exp'); if(e)e.classList.add('show');
      };
    });
  });
  document.querySelectorAll('#ch-'+id+' .flash').forEach(f=>f.onclick=()=>f.classList.toggle('flip'));
}

/* ---- tool logic ---- */
function num(id){ const v=parseFloat(String(document.getElementById(id).value).replace(/[$,%\s]/g,'')); return isNaN(v)?0:v; }
function fmt$(x){ return (x<0?'-$':'$')+Math.abs(x).toLocaleString(undefined,{maximumFractionDigits:2}); }
function fmtM(x){ return x>=1000 ? '$'+(x/1000).toLocaleString(undefined,{maximumFractionDigits:2})+'B' : '$'+x.toLocaleString(undefined,{maximumFractionDigits:1})+'M'; }

function runUnitEcon(){
  const aov=num('ueAov'), take=num('ueTake')/100, cm=num('ueCm')/100, freq=num('ueFreq');
  const ret=Math.min(0.999,Math.max(0,num('ueRet')/100)), cac=num('ueCac'), disc=num('ueDisc')/100;
  const revPerOrder=aov*take, contribPerOrder=revPerOrder*cm, monthly=contribPerOrder*freq;
  const md=Math.pow(1+disc,1/12)-1;
  const lifeMonths = 1/(1-ret);
  const ltvSimple = monthly*lifeMonths;
  const ltvDisc = monthly*(1+md)/(1+md-ret);   /* sum m*(ret/(1+md))^k, k=0.. */
  const ratio = cac>0 ? ltvDisc/cac : Infinity;
  const simplePayback = monthly>0 ? cac/monthly : Infinity;
  let cum=0, n=0, alive=1; while(cum<cac && n<240){ cum+=monthly*alive; alive*=ret; n++; }
  const cohortPayback = cum>=cac ? n : null;
  let verdict = ratio>=3 ? '✅ Healthy (LTV/CAC ≥ 3). You can likely spend more on growth.' : ratio>=1 ? '⚠️ Marginal (1 to 3). Improve retention or margin before scaling spend.' : '❌ Value-destroying (LTV < CAC). Every new customer loses money.';
  if(cohortPayback===null) verdict += '\nCohort never pays back CAC within 20 years at this retention.';
  document.getElementById('ueOut').textContent =
`Net revenue per order:        ${fmt$(revPerOrder)}  (AOV x take rate)
Contribution per order:       ${fmt$(contribPerOrder)}
Contribution per customer/mo: ${fmt$(monthly)}
Expected lifetime:            ${lifeMonths.toFixed(1)} months  (1 / monthly churn of ${((1-ret)*100).toFixed(1)}%)
LTV (undiscounted):           ${fmt$(ltvSimple)}
LTV (discounted):             ${fmt$(ltvDisc)}
LTV / CAC:                    ${isFinite(ratio)?ratio.toFixed(2)+'x':'n/a (CAC = 0)'}
Simple payback (no churn):    ${isFinite(simplePayback)?simplePayback.toFixed(1)+' months':'never'}
Cohort payback (with churn):  ${cohortPayback?cohortPayback+' months':'never'}
${verdict}`;
}

function runMarketSizing(){
  const tot=num('msTot'), samP=num('msSamPct')/100, somP=num('msSomPct')/100;
  const n=num('msN'), spend=num('msSpend'), reach=num('msReach')/100, win=num('msWin')/100;
  const tdTam=tot, tdSam=tot*samP, tdSom=tdSam*somP;
  const buTam=n*spend/1e6, buSam=buTam*reach, buSom=buSam*win;
  const gap = Math.max(buTam,tdTam)/Math.max(1e-9,Math.min(buTam,tdTam));
  document.getElementById('msOut').textContent =
`               TOP-DOWN        BOTTOM-UP
TAM            ${fmtM(tdTam).padEnd(16)}${fmtM(buTam)}
SAM            ${fmtM(tdSam).padEnd(16)}${fmtM(buSam)}
SOM            ${fmtM(tdSom).padEnd(16)}${fmtM(buSom)}

TAM gap between methods: ${gap.toFixed(2)}x  ${gap<=2?'✅ methods roughly agree':'⚠️ reconcile: check buyer count, spend per buyer, or category definition'}
Bottom-up TAM = buyers x annual spend = ${n.toLocaleString()} x ${fmt$(spend)}
Tip: state the 2 assumptions that move SOM most, and give a range (low / base / high).`;
}

let ctTimer=null, ctLeft=1500, ctIdx=0;
function ctTick(){
  const m=Math.floor(ctLeft/60), s=ctLeft%60;
  document.getElementById('ctClock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  if(ctLeft<=0){ clearInterval(ctTimer); ctTimer=null; document.getElementById('ctClock').textContent='TIME'; ctReveal(); return; }
  ctLeft--;
}
function ctStart(random){
  const sel=document.getElementById('ctSel');
  if(random){ sel.value=String(Math.floor(Math.random()*CASES.length)); }
  ctIdx=parseInt(sel.value)||0;
  const c=CASES[ctIdx];
  document.getElementById('ctPrompt').textContent=c.co+': '+c.p+'\n\nSpend ~3 min on clarifying questions, ~5 min on structure, ~12 min on analysis and math, ~5 min on the recommendation.';
  document.getElementById('ctOutline').style.display='none';
  if(ctTimer) clearInterval(ctTimer);
  ctLeft=1500; ctTick(); ctTimer=setInterval(ctTick,1000);
}
function ctReveal(){
  const c=CASES[ctIdx]; const o=document.getElementById('ctOutline');
  o.textContent='MODEL OUTLINE ('+c.co+')\n'+c.o; o.style.display='block';
}
function ctReset(){ if(ctTimer) clearInterval(ctTimer); ctTimer=null; ctLeft=1500; document.getElementById('ctClock').textContent='25:00'; document.getElementById('ctOutline').style.display='none'; document.getElementById('ctPrompt').textContent='Choose a prompt and press Start.'; }

/* build the TOC listing (called at boot) */
function buildTOC(){
  const host=document.getElementById('tocFull'); if(!host) return;
  let lastPart='', html='';
  CH.filter(c=>c.id!=='intro').forEach(c=>{
    if(c.part!==lastPart){ html+=`<div class="toc-part">${c.part}</div>`; lastPart=c.part; }
    html+=`<div class="toc-item" onclick="show('${c.id}')"><span class="n">${c.num}</span><span>${c.title}</span></div>`;
  });
  host.innerHTML=html;
  const p=document.getElementById('s-pages'), ch=document.getElementById('s-ch');
  if(p){let words=0;CH.forEach(c=>{const t=document.createElement('div');t.innerHTML=c.html;words+=(t.textContent||'').trim().split(/\s+/).length;});p.textContent='~'+Math.round(words/350);}
  if(ch)ch.textContent=CH.filter(c=>!c.tool).length;
}
</script>

chapter({part:"Front matter", id:"intro", num:"00", title:"How to use this handbook + target roles", mins:12, tag:"Start here", tool:true, html:`
<p>This is a training handbook for becoming a strong <b>Strategy &amp; Operations (S&amp;O)</b>, <b>BizOps</b>, or <b>Strategy &amp; Planning</b> operator. It is written for an engineer making the jump: someone who already knows how systems fail, how to read data, and how to ship, and now needs the business vocabulary, the frameworks, the company context, and lots of case reps. It grows daily toward <b>~300 pages</b>; the live counter in the sidebar shows its current length.</p>
<div class="card">
  <span class="stat"><b id="s-pages">…</b>pages (est.)</span>
  <span class="stat"><b id="s-ch">…</b>chapters</span>
  <span class="stat"><b>3</b>interactive tools</span>
  <span class="stat"><b>5</b>target companies</span>
</div>

<h3>How to use it</h3>
<ul>
  <li><b>Foundations first.</b> Read Part I in order: the role, problem structuring, and unit economics are the base layer of every S&amp;O interview and every S&amp;O job.</li>
  <li><b>Attempt before you peek.</b> Worked solutions in case chapters sit behind a <i>Show model answer</i> toggle. Write your own structure first, then compare. The habit of committing to an answer before seeing one is the habit interviews test.</li>
  <li><b>Use the tools.</b> The <a onclick="show('unit-economics')">unit economics calculator</a>, the market sizing builder, and the 25-minute case timer are embedded where they matter. Change the inputs and watch which assumption moves the answer most; that sensitivity instinct is the real skill.</li>
  <li><b>Quiz yourself.</b> Each chapter ends with a self-check. The glossary at the end is searchable.</li>
  <li><b>Check the changelog.</b> Company numbers go stale fast. The <a onclick="show('changelog')">Updates &amp; Changelog</a> page records what changed each day, with sources.</li>
</ul>

<h3>What an S&amp;O operator does, in one paragraph</h3>
<p>S&amp;O teams sit between the executive team and the operating teams. They take an ambiguous business question ("why did growth slow in this region?", "should we enter this market?", "how many people do we need next year?"), structure it, get the data, build the model, form a recommendation, and then help drive the decision into execution. They also run the <b>operating cadence</b>: annual planning, quarterly business reviews, weekly metric reviews, and OKRs. The job title varies (Strategy &amp; Operations, BizOps, Business Operations, Strategy &amp; Planning, Strategic Finance adjacent), but the work rhythm is the same: <i>structure, analyze, recommend, drive.</i></p>

<h3>Your five target companies at a glance</h3>
<p>Below is how S&amp;O-style work typically shows up at each target. These are general descriptions of the business and the kinds of problems such teams work on, not official org charts; team names and scopes change with reorgs, so confirm on current job postings.</p>
<table>
<tr><th>Company</th><th>Business model in one line</th><th>Typical S&amp;O / BizOps problems</th><th>Metrics you must speak</th></tr>
<tr><td><b>Datadog</b></td><td>Usage-based SaaS observability and security platform; land with one product, expand to many.</td><td>Pricing and packaging, GTM capacity planning (quota-carrying reps, territories), multi-product attach, customer segmentation, forecasting usage-driven revenue.</td><td>ARR, NRR / GRR, customers above $100k ARR, products per customer, magic number, CAC payback, FCF margin.</td></tr>
<tr><td><b>Spotify</b></td><td>Two-sided audio platform: freemium consumers (Premium subscription + ad-supported) and creators / rights holders.</td><td>Pricing and plan mix by market, subscriber funnel (Free to Premium), royalty and gross margin economics, audiobooks and podcast monetization, market launches.</td><td>MAU, Premium subscribers, ARPU, churn, gross margin by segment, ad revenue per MAU.</td></tr>
<tr><td><b>Google</b></td><td>Multi-segment: Search and ads, YouTube, subscriptions and devices, Google Cloud, Other Bets; AI across all.</td><td>Cloud GTM (segments, partners, industry verticals), product BizOps (goal setting, resource allocation), market sizing for new products, capacity and compute planning.</td><td>Segment revenue and growth, Cloud operating margin and backlog, paid clicks / CPC, capex, OKRs.</td></tr>
<tr><td><b>DoorDash</b></td><td>Three-sided local commerce marketplace: consumers, merchants, Dashers; plus DashPass membership, new verticals, international.</td><td>Market and city operations, supply-demand balance, new vertical launches (grocery, retail), unit economics per order, DashPass growth, Dasher pay and efficiency.</td><td>Total orders, Marketplace GOV, net revenue margin (take rate), contribution profit, adjusted EBITDA as % of GOV.</td></tr>
<tr><td><b>Uber</b></td><td>Platform across Mobility, Delivery and Freight; Uber One membership ties them together; AV partnerships.</td><td>Marketplace efficiency (ETAs, surge, utilization), city launches and regulation, incentive spend efficiency, cross-sell, AV deployment planning.</td><td>Gross bookings, trips, MAPCs, take rate, adjusted EBITDA as % of GB, FCF.</td></tr>
</table>

<h3>Latest quarter snapshot (Q3 2026)</h3>
<p>Headline numbers from each company's most recent earnings release. Use them to sound current in interviews, and practice explaining <i>why</i> each number moved.</p>
<table>
<tr><th>Company</th><th>Headline Q3 2026 numbers</th><th>Talking point</th></tr>
<tr><td>Datadog</td><td>Revenue $1.20B, +35% Y/Y; about 4,860 customers with ARR of $100k+ (+20%); non-GAAP operating margin 28%; FCF $251M.</td><td>Revenue growth well above large-customer count growth means existing customers are spending more: expansion is the engine.</td></tr>
<tr><td>Spotify</td><td>788M MAU (+11%); 306M Premium subscribers (+9%); revenue €4.97B (+16%); gross margin 33.0%; operating income €672M.</td><td>Premium ARPU up about 9% Y/Y: price increases and mix, not just subscriber growth, are driving revenue.</td></tr>
<tr><td>Alphabet</td><td>Revenue $127.6B (+25%); Google Cloud $30.7B (reported +103%); YouTube ads $11.2B.</td><td>Cloud is now the growth story, driven by AI demand; ask how capacity (compute, capex) limits revenue.</td></tr>

</table>
<p style="font-size:12.5px;color:var(--muted)">Sources: <a href="https://www.sec.gov/Archives/edgar/data/0001561550/000162828026069792/ex-991x20260930x8k.htm" target="_blank">Datadog Q3 2026 release (SEC 8-K)</a> · <a href="https://www.sec.gov/Archives/edgar/data/0001639920/000114036126040435/ef20084028_ex99-1.htm" target="_blank">Spotify Q3 2026 release (SEC 6-K)</a> · <a href="https://9to5google.com/2026/10/28/alphabet-q3-2" target="_blank">9to5Google on Alphabet Q3 2026</a> · <a href="https://aiweekly.co/alerts/alphabet-posts-1276b-q3-with-google-cloud-up-103-to-307b-as-2027-capex-set-to" target="_blank">AI Weekly on Alphabet Q3</a> · <a href="https://www.sec.gov/Archives/edgar/data/0001792789/000179278926000062/proddashex991-pressrelease.htm" target="_blank">DoorDash Q3 2026 release (SEC 8-K)</a> · <a href="https://finviz.com/news/415280/uber-announces-results-for-third-quarter-2026" target="_blank">Uber Q3 2026 release</a>.</p>

<h3>Why your background is an asset</h3>
<div class="callout tip"><span class="lbl">Career bridge preview</span>Systems engineering is root-cause analysis on complex, interacting subsystems under constraints; that is exactly what diagnosing a marketplace metric drop feels like. Three years on a data intelligence team means you can pull and sanity-check your own data, which many S&amp;O candidates cannot. The gap to close is business vocabulary, financial intuition, and executive communication. This handbook is organized to close it.</div>

<script id="part1">
chapter({part:"Part I · Foundations", id:"so-role", num:"01", title:"The S&O Operator Role and Core Skills", mins:14, tag:"Foundations", html:`
<p>Strategy &amp; Operations is the internal consulting and execution function of a tech company. If finance answers "what happened and what will it cost?" and product answers "what should we build?", S&amp;O answers "<b>what should the business do next, and how do we make it happen?</b>" This chapter defines the role, the core skills, and how S&amp;O work is judged, so every later chapter has a place to land.</p>

<h3>Where S&amp;O sits</h3>
<p>Most tech companies have some mix of three S&amp;O shapes. Knowing which one a role is tells you what the interview will emphasize.</p>
<table>
<tr><th>Shape</th><th>Reports into</th><th>Typical work</th><th>Interview emphasis</th></tr>
<tr><td><b>Central strategy / BizOps</b></td><td>CEO, COO, or Chief Strategy Officer</td><td>Company-level questions: new markets, M&amp;A screening, annual planning, board materials, cross-team priorities.</td><td>Case interviews, market sizing, structured communication.</td></tr>
<tr><td><b>Embedded S&amp;O</b></td><td>A business unit or product GM (e.g. a Cloud segment, a delivery vertical)</td><td>Run the unit's planning and reviews, diagnose metric moves, build business cases for the GM, own special projects.</td><td>Metric diagnosis, SQL / Excel, stakeholder stories.</td></tr>
<tr><td><b>Operations-heavy S&amp;O</b></td><td>Regional or city GM, GTM leadership</td><td>Launch markets, balance supply and demand, tune incentives, capacity plans for sales or support teams.</td><td>Operational cases, unit economics, prioritization under constraints.</td></tr>
</table>

<h3>The S&amp;O work loop</h3>
<p>Almost every S&amp;O project runs the same loop. Senior operators run it faster and with less data; junior operators skip steps (usually step 1 or step 5).</p>
<div class="diagwrap">
<svg viewBox="0 0 760 170" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="13">
  <defs><marker id="arr1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#93a1b3"/></marker></defs>
  <g fill="#1b232e" stroke="#f5a524" stroke-width="1.5">
    <rect x="10" y="40" width="130" height="60" rx="10"/><rect x="160" y="40" width="130" height="60" rx="10"/>

    <rect x="610" y="40" width="140" height="60" rx="10"/>

  <g fill="#e8eef5" text-anchor="middle">
    <text x="75" y="66">1 Frame</text><text x="75" y="84" font-size="11" fill="#93a1b3">the real question</text>
    <text x="225" y="66">2 Structure</text><text x="225" y="84" font-size="11" fill="#93a1b3">issue tree, hypotheses</text>
    <text x="375" y="66">3 Analyze</text><text x="375" y="84" font-size="11" fill="#93a1b3">data, model, sizing</text>
    <text x="525" y="66">4 Recommend</text><text x="525" y="84" font-size="11" fill="#93a1b3">so-what, trade-offs</text>
    <text x="680" y="66">5 Drive</text><text x="680" y="84" font-size="11" fill="#93a1b3">owners, metrics, cadence</text>
