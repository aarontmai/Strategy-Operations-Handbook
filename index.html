<h3>Practice drill: AI Mode and Search growth</h3>
<p><b>Prompt (numbers illustrative):</b> Last year 100 units of queries were all classic Search at revenue per query (RPQ) of 1.00, so revenue = 100. This year queries grow 8% to 108. Pricing (CPC and ad quality) lifts classic RPQ 4% to 1.04. But 15% of queries now go to AI Mode, which monetizes at 60% of classic RPQ. (1) What is Search revenue growth? (2) What growth would it have been with no AI Mode shift? (3) What AI Mode monetization ratio keeps growth at 10%?</p>
<details><summary>Show model answer</summary>
<pre><code>(1) Revenue = 108 x (0.85 x 1.04 + 0.15 x 1.04 x 0.60)
            = 108 x (0.884 + 0.0936) = 108 x 0.9776 = 105.6   -> +5.6%
(2) No shift: 108 x 1.04 = 112.3                              -> +12.3%
    Cost of the shift: about 6.7 points of growth
(3) Need 108 x (0.884 + 0.156 r) = 110
    0.884 + 0.156 r = 1.0185  ->  r = 0.86</code></pre>
<p><b>Takeaway:</b> AI Mode must monetize at about 86% of classic per query to keep growth at 10%. The strategic answer is to grow total queries (AI answers can increase engagement), close the monetization gap with new ad formats inside AI answers, and track RPQ by surface as a weekly KPI. Common mistake: treating AI Mode as pure cannibalization and ignoring that it may raise total query volume.</p>
</details>

<h3>Common mistakes when discussing Google</h3>
<table>
<tr><th>Mistake</th><th>Better framing</th></tr>
<tr><td>"Negative FCF means Google is in trouble"</td><td>Operating income rose 30%; FCF is negative because capex nearly doubled by choice</td></tr>
<tr><td>Treating Cloud growth as only demand</td><td>Backlog math says capacity is the constraint; ask about go-live timing</td></tr>
<tr><td>Quoting Search growth without TAC or FX</td><td>Management attributed part of the Q3 slowdown to FX; separate volume, price and currency</td></tr>
<tr><td>Ignoring non-operating items</td><td>The Q3 EPS miss was driven by an $8.7B equity securities loss, not operations</td></tr>
</table>

<div class="quiz" data-a="2">
  <div class="q">Google Cloud revenue rose from $15.16B to $30.71B and operating income from $3.59B to $11.12B. What is the incremental operating margin?</div>
  <button class="opt">23.7%</button>
  <button class="opt">36.2%</button>
  <button class="opt">About 48%</button>
  <button class="opt">About 74%</button>
  <div class="exp">(11.12 - 3.59) / (30.71 - 15.16) = 7.53 / 15.55 = about 48%. Incremental margin uses the change in both lines, not the ending margin.</div>
</div>

<div class="quiz" data-a="0">
  <div class="q">A $561B backlog with about 55% converting in 24 months implies roughly $38.6B per quarter versus $30.7B of current quarterly Cloud revenue. What is the best S&amp;O reading?</div>
  <button class="opt">Near-term growth is mostly limited by compute capacity coming online</button>
  <button class="opt">Demand is weakening, so sales capacity should be cut</button>
  <button class="opt">Backlog is irrelevant because it is not revenue</button>
  <button class="opt">Cloud margins must fall next quarter</button>
  <div class="exp">Contracted demand already exceeds the current run rate, so the binding constraint is delivering capacity. Backlog is not revenue yet, but it is the best leading indicator a Cloud operator has.</div>
</div>
`});
</script>

<script>
chapter({part:"Part VII · Case Practice", id:"case-doordash-instacart", num:"11", title:"Case: DoorDash Buys Instacart. Build the Synergy Case and the Integration Plan", mins:25, tag:"Case · DoorDash · M&amp;A", html:`
<p>The third full practice case, and the first on <b>M&amp;A</b>. It is built on a live deal: on Oct 28, 2026 DoorDash agreed to acquire Instacart (Maplebear) for about $17B, saying it targets more than $500M of annual net synergies and will reinvest more than 100% of synergies in year one. Corp dev and bankers negotiate the price; S&amp;O teams build the synergy model, the integration plan and the tracker that proves the synergies showed up. Attempt each step before opening the model answer. Pair it with <a onclick="show('doordash-deep-dive')">04 DoorDash Deep-Dive</a> and <a onclick="show('unit-economics')">03 Unit Economics</a>.</p>

<div class="callout"><span class="lbl">The prompt (illustrative)</span>"You have joined the DoorDash integration management office (IMO) as the S&amp;O lead for the Instacart deal. The CFO wants three things by the end of the month: (1) a bottom-up synergy model that supports or challenges the public $500M+ net target, (2) a phasing plan that squares with reinvesting more than 100% in year one, and (3) a view on whether the premium we paid is covered by synergies. The deal will not close until late 2027 or the first half of 2028."</div>

<h3>Step 0 · What the real companies look like</h3>
<p>Reported figures for Q3 2026 (quarter ended Sept 30, 2026). Everything after these tables is an illustrative model, not company guidance.</p>
<table>
<tr><th>Q3 2026</th><th>Instacart</th><th>DoorDash</th></tr>
<tr><td>Orders</td><td>91.4M, +10% Y/Y</td><td>993M, +28% (+17% ex-Deliveroo)</td></tr>
<tr><td>Gross value</td><td>GTV $10.53B, +15%</td><td>Marketplace GOV $33.9B, +36%</td></tr>
<tr><td>Average order value</td><td>about $115 (GTV / orders)</td><td>about $34 (rough: total orders include Drive)</td></tr>
<tr><td>Revenue</td><td>$1.095B, +17% (about 10.4% of GTV)</td><td>$4.62B, +34% (13.6% of GOV)</td></tr>
<tr><td>Adjusted EBITDA</td><td>$342M, +23% (3.2% of GTV, 31% of revenue)</td><td>$1.06B (3.1% of GOV)</td></tr>
<tr><td>Free cash flow</td><td>$307M, +13%</td><td>n/a here</td></tr>
</table>
<table>
<tr><th>Deal term</th><th>As announced</th></tr>
<tr><td>Price</td><td>$65 per share, about $17B equity value; holders elect cash, 0.3372 DASH shares, or a mix; stock capped at 25% of consideration</td></tr>
<tr><td>Financing</td><td>Cash on hand plus debt; JPMorgan committed a 364-day bridge loan of up to $13.0B; no financing condition</td></tr>
<tr><td>Timing</td><td>Close expected late 2027 or 1H 2028, subject to HSR, Instacart holder approval, and approvals including Canada and Israel</td></tr>
<tr><td>Brand</td><td>Instacart brand and app remain; companies operate independently until close</td></tr>
</table>
<p style="font-size:12.5px;color:var(--muted)">Sources: Instacart Q3 2026 release and 10-Q, DoorDash Q3 2026 release, TechCrunch and Supermarket News deal coverage. Links in the Changelog entry for 2026-11-23.</p>

<h3>Step 1 · Clarify before you model</h3>
<ul>
  <li><b>Net of what?</b> Does "net synergies" mean after dis-synergies (lost revenue), after reinvestment, or both? Define it on page one; most synergy fights are definition fights.</li>
  <li><b>Run rate vs realized:</b> $500M is an annual run rate at maturity. What year, and is one-time integration cost excluded?</li>
  <li><b>Pre-close rules:</b> Until close the two are competitors. What can the IMO see? (Answer: only aggregated data, and anything sensitive goes through a clean team.)</li>
  <li><b>Strategic intent:</b> Is this a cost deal (consolidate overlap) or a growth deal (cross-sell grocery to DoorDash users, restaurants to Instacart users)? The answer changes which synergies you fight for.</li>
</ul>

<h3>Step 2 · Structure: the synergy tree</h3>
<table>
<tr><th>Bucket</th><th>Mechanism</th><th>Driver to model</th><th>Confidence</th></tr>
<tr><td><b>Fulfillment</b></td><td>One courier network; batch grocery and restaurant work; better utilization</td><td>Cost per order saved x share of orders affected</td><td>Medium</td></tr>
<tr><td><b>Tech and G&amp;A</b></td><td>Overlapping platforms, support, corporate functions, cloud contracts</td><td>Overlapping cost base x reduction %</td><td>High (but slow and painful)</td></tr>
<tr><td><b>Ads</b></td><td>One retail-media network for CPG brands; more inventory and better targeting</td><td>Ad revenue x uplift in fill and price</td><td>Medium</td></tr>
<tr><td><b>Membership and marketing</b></td><td>One membership fee option; less paid acquisition bidding against each other</td><td>Overlapping marketing spend x reduction</td><td>Medium</td></tr>
<tr><td><b>Payments and procurement</b></td><td>Scale pricing on card processing, insurance, vendors</td><td>Combined spend x rate cut in bps</td><td>High</td></tr>
<tr><td><b>Dis-synergies</b></td><td>Retailers that see DoorDash as a rival pull back; overlapping customers stop double-paying</td><td>Revenue at risk x probability</td><td>Low (hard to see pre-close)</td></tr>
</table>

<h3>Step 3 · Build the run-rate model (illustrative)</h3>
<p>Try the fulfillment line yourself first: Instacart runs about 91.4M orders a quarter. Assume half of annual orders can share the combined network and save $0.60 each.</p>
<details><summary>Show the model</summary>
<pre><code>Annual Instacart orders  ~ 91.4M x 4         = ~366M
Fulfillment synergy      = 366M x 50% x $0.60 = ~$110M</code></pre>
<table>
<tr><th>Bucket (run rate, illustrative)</th><th>Gross $M</th><th>Key assumption</th></tr>
<tr><td>Fulfillment</td><td>110</td><td>$0.60 per order on half of Instacart orders</td></tr>
<tr><td>Tech and G&amp;A</td><td>200</td><td>About 20% of an overlapping $1B cost base</td></tr>
<tr><td>Ads</td><td>150</td><td>Higher fill and pricing on combined retail media</td></tr>
<tr><td>Membership and marketing</td><td>120</td><td>Stop bidding against each other on paid search and promos</td></tr>
<tr><td>Payments and procurement</td><td>70</td><td>Scale pricing on combined volume</td></tr>
<tr><td><b>Gross synergies</b></td><td><b>650</b></td><td></td></tr>
<tr><td>Dis-synergies</td><td>-150</td><td>Retailer pullback and overlapping-member revenue</td></tr>
<tr><td><b>Net run-rate synergies</b></td><td><b>500</b></td><td>Matches the public floor; the model is plausible but needs about $650M gross</td></tr>
</table>
</details>

<div class="diagwrap">
<svg viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="11">
  <line x1="30" y1="230" x2="650" y2="230" stroke="#93a1b3"/>
  <g fill="#3ecf8e">
    <rect x="40" y="197" width="60" height="33"/>
    <rect x="125" y="137" width="60" height="60"/>
    <rect x="210" y="92" width="60" height="45"/>
    <rect x="295" y="56" width="60" height="36"/>
    <rect x="380" y="35" width="60" height="21"/>
  </g>
  <rect x="465" y="35" width="60" height="45" fill="#f05252"/>
  <rect x="550" y="80" width="60" height="150" fill="#f5a524"/>
  <g fill="#e8eef5" text-anchor="middle">
    <text x="70" y="191">+110</text><text x="155" y="131">+200</text><text x="240" y="86">+150</text><text x="325" y="50">+120</text><text x="410" y="29">+70</text><text x="495" y="96">-150</text><text x="580" y="74">500</text>
  </g>
  <g fill="#93a1b3" text-anchor="middle">
    <text x="70" y="246">Fulfillment</text><text x="155" y="246">Tech, G&amp;A</text><text x="240" y="246">Ads</text><text x="325" y="246">Membership</text><text x="410" y="246">Payments</text><text x="495" y="246">Dis-synergy</text><text x="580" y="246">Net run rate</text>
  </g>
  <text x="650" y="270" fill="#93a1b3" font-size="10" text-anchor="end">Illustrative synergy waterfall, $M per year</text>
</svg>
</div>

<h3>Step 4 · Phase it and check the premium</h3>
<div class="callout example"><span class="lbl">Worked example · phasing and premium coverage (illustrative)</span>
<table>
<tr><th>$M</th><th>Year 1</th><th>Year 2</th><th>Year 3</th></tr>
<tr><td>Net synergies captured (30% / 70% / 100% of 500)</td><td>150</td><td>350</td><td>500</td></tr>
<tr><td>Reinvestment (lower fees, Dasher pay, grocery selection)</td><td>-200</td><td>-100</td><td>0</td></tr>
<tr><td><b>Net to EBITDA</b></td><td><b>-50</b></td><td><b>250</b></td><td><b>500</b></td></tr>
<tr><td>One-time integration cost</td><td>-350</td><td>-200</td><td>-50</td></tr>
</table>
<p>Year 1 reinvests 200 / 150 = 133% of captured synergies, consistent with the "more than 100%" message.</p>
<pre><code>Run-rate EBITDA (Instacart)  ~ $342M x 4      = ~$1.37B
Price / run-rate EBITDA      ~ $17B / $1.37B   = ~12.4x
Premium vs pre-deal value    ~ $17B - ~$13.5B  = ~$3.5B (reports put the pre-deal value at $13B to $14B)

Value of synergies:
After tax (25%)              $500M x 0.75      = $375M per year
Capitalized at 10x           $375M x 10        = $3.75B
Less integration cost                          = -$0.6B
Net synergy value                              = ~$3.15B</code></pre>
<p><b>Reading:</b> synergy value of about $3.15B roughly equals a premium of about $3.5B. The sellers captured most of the synergy value up front, so DoorDash shareholders only win if synergies beat $500M or the growth story (cross-sell, ads, grocery share) delivers beyond the model.</p>
</div>

<details><summary>Show model recommendation</summary>
<ol>
  <li><b>Answer:</b> The $500M net target is achievable but requires about $650M gross, with tech, G&amp;A and payments (about $270M, high confidence) as the floor and ads plus fulfillment as the upside. Present it as a range: $400M (low case, dis-synergies at $250M) to $650M (high case, ads uplift doubles).</li>
  <li><b>Premium:</b> Synergies roughly pay for the premium, not more. Say so plainly; the investment thesis rests on growth, so the model should include a separate, clearly labeled revenue-upside case.</li>
  <li><b>Pre-close plan (now to close):</b> Clean-team analysis of overlapping costs and customers; Day-1 readiness checklist (payroll, legal entities, merchant contracts, support routing); no joint pricing, merchant or Dasher decisions before close, because that would be gun-jumping.</li>
  <li><b>Post-close (first 100 days):</b> Stand up a synergy tracker with an owner per line, a baseline, and monthly realized vs plan; protect top retailer relationships first, since dis-synergies are the biggest unknown.</li>
  <li><b>Guardrails:</b> Track Instacart order growth, retailer count and shopper fulfillment quality monthly; a synergy that costs customer experience is a dis-synergy with a delay.</li>
</ol>
</details>

<h3>Step 5 · The synergy tracker</h3>
<table>
<tr><th>Line</th><th>Owner</th><th>Baseline</th><th>Leading KPI</th><th>Realized when</th></tr>
<tr><td>Fulfillment</td><td>Logistics S&amp;O</td><td>Cost per Instacart order, pre-close</td><td>Share of orders on shared network</td><td>Cost per order falls, quality flat</td></tr>
<tr><td>Tech and G&amp;A</td><td>Finance + Eng</td><td>Combined run-rate cost base</td><td>Systems decommissioned</td><td>Contracts ended, headcount plan met</td></tr>
<tr><td>Ads</td><td>Ads BizOps</td><td>Combined ad revenue</td><td>Fill rate, CPG advertiser count</td><td>Incremental revenue vs holdout markets</td></tr>
<tr><td>Dis-synergy</td><td>Partnerships</td><td>Retailer revenue by partner</td><td>Renewal pipeline, partner sentiment</td><td>Losses stay under plan</td></tr>
</table>

<h3>Common mistakes</h3>
<table>
<tr><th>Mistake</th><th>Why it hurts</th><th>Do this instead</th></tr>
<tr><td>Quoting only gross synergies</td><td>Ignores retailer pullback and overlapping-customer losses</td><td>Always show gross, dis-synergies and net</td></tr>
<tr><td>Counting run rate in year 1</td><td>Capture takes 2 to 3 years and year 1 is reinvested</td><td>Phase capture and reinvestment explicitly</td></tr>
<tr><td>Forgetting one-time costs</td><td>Integration can cost more than a full year of synergies</td><td>Net integration cost against synergy value</td></tr>
<tr><td>Planning joint actions before close</td><td>Gun-jumping risk under antitrust law</td><td>Use a clean team and plan only Day-1 readiness</td></tr>
<tr><td>Assuming the premium is free money</td><td>Sellers usually capture most of the synergy value</td><td>Compare capitalized synergies with the premium paid</td></tr>
</table>

<h3>Practice timer</h3>
<p>Re-run this case cold in a week. Aim to finish the synergy tree and premium check within 25 minutes.</p>
${TOOLS.caseTimer()}

<div class="quiz" data-a="2">
  <div class="q">Self-check: Year 1 captures $150M of net synergies and reinvests $200M. Which statement is right?</div>
  <button class="opt">Year 1 EBITDA rises by $150M</button>
  <button class="opt">Reinvestment does not affect EBITDA</button>
  <button class="opt">Year 1 EBITDA impact is about -$50M, a 133% reinvestment rate</button>
  <button class="opt">The deal has failed</button>
  <div class="exp">150 - 200 = -50. Reinvesting more than 100% of early synergies means profits dip before they rise; that is a planned choice to buy growth, not a failure.</div>
</div>

<div class="quiz" data-a="1">
  <div class="q">Self-check: Capitalized after-tax synergies are worth about $3.15B and the premium paid was about $3.5B. What is the best S&amp;O reading?</div>
  <button class="opt">The acquirer captured all the synergy value</button>
  <button class="opt">The sellers captured most of the synergy value, so the thesis depends on beating plan or on growth</button>
  <button class="opt">Premiums never matter after close</button>
  <button class="opt">Synergies should be capitalized before tax</button>
  <div class="exp">When the premium roughly equals synergy value, the acquirer breaks even on synergies alone. Upside must come from outperformance or revenue growth the model labels separately.</div>
</div>
`});
</script>

<script>
chapter({part:"Part VI · Company Deep-Dives", id:"uber-deep-dive", num:"12", title:"Uber Deep-Dive: Mobility, Delivery, Freight and the Autonomous Bet", mins:22, tag:"Company · Uber", html:`
<p>Uber is the clearest example in this handbook of a <b>multi-product marketplace platform</b>: one app, one identity, one payments stack and one pool of earners, serving rides, food and grocery, and freight. For an S&amp;O operator, Uber is a laboratory for marketplace balance, incentive efficiency, cross-sell through membership, and a strategic bet (autonomous vehicles) that could reshape its cost structure. This chapter is built on Uber Q3 2026 results (quarter ended Sept 30, 2026, reported Nov 4, 2026). Pair it with <a onclick="show('case-uber-driver-supply')">08 Case: Uber Driver Supply Shortage at Peak</a> and <a onclick="show('driver-trees-north-star')">06 Driver Trees</a>.</p>

<h3>1 · The business model in one picture</h3>
<div class="diagwrap">
<svg viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
  <rect x="250" y="110" width="180" height="60" rx="10" fill="#3ecf8e" opacity="0.15" stroke="#3ecf8e"/>
  <text x="340" y="135" fill="#e8eef5" text-anchor="middle" font-weight="bold">Uber platform</text>
  <text x="340" y="153" fill="#93a1b3" text-anchor="middle" font-size="11">identity · payments · maps · Uber One</text>
  <rect x="30" y="20" width="170" height="60" rx="8" fill="none" stroke="#f5a524"/>
  <text x="115" y="45" fill="#e8eef5" text-anchor="middle">Mobility</text>
  <text x="115" y="63" fill="#93a1b3" text-anchor="middle" font-size="11">GB $29.5B · 8.0% margin</text>
  <rect x="480" y="20" width="170" height="60" rx="8" fill="none" stroke="#f5a524"/>
  <text x="565" y="45" fill="#e8eef5" text-anchor="middle">Delivery</text>
  <text x="565" y="63" fill="#93a1b3" text-anchor="middle" font-size="11">GB $28.5B · 3.7% margin</text>
  <rect x="255" y="210" width="170" height="55" rx="8" fill="none" stroke="#f5a524"/>
  <text x="340" y="233" fill="#e8eef5" text-anchor="middle">Freight</text>
  <text x="340" y="251" fill="#93a1b3" text-anchor="middle" font-size="11">GB $1.8B · loss of $33M</text>
  <line x1="200" y1="60" x2="255" y2="115" stroke="#93a1b3"/>
  <line x1="480" y1="60" x2="425" y2="115" stroke="#93a1b3"/>
  <line x1="340" y1="170" x2="340" y2="210" stroke="#93a1b3"/>
  <text x="30" y="130" fill="#93a1b3" font-size="11">Shared earners: drivers</text>
  <text x="30" y="146" fill="#93a1b3" font-size="11">also do deliveries</text>
  <text x="520" y="130" fill="#93a1b3" font-size="11">Uber One cross-sell:</text>
  <text x="520" y="146" fill="#93a1b3" font-size="11">riders become eaters</text>
  <text x="660" y="275" fill="#93a1b3" font-size="10" text-anchor="end">Q3 2026 gross bookings and segment operating income as % of GB</text>
</svg>
</div>
<p>Three sides in every trip: <b>consumers</b> (riders, eaters), <b>earners</b> (drivers, couriers) and, in Delivery and Freight, <b>merchants or shippers</b>. Uber earns a take rate on gross bookings, plus advertising (sponsored listings in Uber Eats) and membership fees. Its edge is that a consumer, an earner and a payment method acquired for one product can be reused by the others at low marginal cost.</p>

<h3>2 · Q3 2026 scorecard</h3>
<table>
<tr><th>Metric ($M unless noted)</th><th>Q3 2026</th><th>Q3 2025</th><th>Y/Y</th></tr>
<tr><td>Gross bookings</td><td>59,819</td><td>49,740</td><td>+20% (+20% cc)</td></tr>
<tr><td>Revenue</td><td>14,766</td><td>13,467</td><td>+10% (business model changes cut growth by about 8 pts)</td></tr>
<tr><td>Trips</td><td>4,061M</td><td>3,512M</td><td>+16%</td></tr>
<tr><td>MAPCs (monthly active platform consumers)</td><td>215M</td><td>189M</td><td>+14%</td></tr>
<tr><td>GAAP income from operations</td><td>1,447</td><td>1,113</td><td>+30%</td></tr>
<tr><td>Non-GAAP operating income</td><td>2,304 (3.9% of GB)</td><td>1,675 (3.4%)</td><td>+38%</td></tr>
<tr><td>Adjusted EBITDA</td><td>2,963 (5.0% of GB)</td><td>2,256 (4.5%)</td><td>+31%</td></tr>
<tr><td>Free cash flow</td><td>2,535</td><td>2,230</td><td>+14%</td></tr>
<tr><td>Share repurchases</td><td>750</td><td>1,463</td><td>9M 2026: 4,279</td></tr>
</table>
<table>
<tr><th>Segment, Q3 2026</th><th>Gross bookings</th><th>GB growth (cc)</th><th>Revenue</th><th>Segment op. income</th><th>% of GB</th></tr>
<tr><td>Mobility</td><td>29,512</td><td>+17%</td><td>7,520 (-2%)</td><td>2,362 (+27%)</td><td>8.0% (7.4% a year ago)</td></tr>
<tr><td>Delivery</td><td>28,539</td><td>+23%</td><td>5,488 (+23%)</td><td>1,057 (+30%)</td><td>3.7% (3.5%)</td></tr>
<tr><td>Freight</td><td>1,768</td><td>+35%</td><td>1,758 (+34%)</td><td>(33)</td><td>-1.9% (-3.1%)</td></tr>
<tr><td>Corporate G&amp;A and platform R&amp;D</td><td colspan="3"></td><td>(1,082)</td><td></td></tr>
</table>
<p style="font-size:12.5px;color:var(--muted)">Source: Uber Q3 2026 earnings release (8-K, Nov 4, 2026). Margin percentages are calculated from the release. Uber now reports segment operating income and says adjusted EBITDA is no longer a key management measure. Q4 2026 guide: GB $63.25B to $65.25B (+18% to +22% cc), adjusted EBITDA $3.13B to $3.23B, non-GAAP EPS $0.95 to $0.99.</p>

<div class="callout warn"><span class="lbl">Why revenue is the wrong headline</span>Mobility revenue fell 2% while Mobility bookings grew 18%. That is not a demand problem: Uber said business model changes cut total revenue growth by about 8 points. Changes of this kind (for example whether Uber acts as principal or agent in a market) alter how much of each booking is recognized as revenue without changing trips or bookings. Operators at Uber track <b>gross bookings, trips and segment operating income as % of GB</b>. In an interview, say this unprompted; it shows you can read a marketplace P&amp;L.</div>

<h3>3 · Three worked examples on real numbers</h3>
<div class="callout example"><span class="lbl">Worked example 1 · Decompose trip growth</span>
<pre><code>Trips = MAPCs x trips per MAPC per month x 3 months
Q3 2026: 4,061M / (215M x 3) = 6.30 trips per MAPC per month
Q3 2025: 3,512M / (189M x 3) = 6.19
Growth: MAPCs +14%, frequency +1.7%  ->  (1.14 x 1.017) - 1 = 16% trips
GB per trip: 59,819 / 4,061 = $14.73 vs 49,740 / 3,512 = $14.16  (+4%)</code></pre>
<p>So 20% booking growth is about 14 pts more users, 2 pts more frequency and 4 pts larger baskets or fares. The release confirms the 14% and 2% split. The S&amp;O follow-up: is frequency growth coming from Uber One members and multi-product users (healthy), or from promotions (rented)?</p></div>

<div class="callout example"><span class="lbl">Worked example 2 · Incremental margin by segment</span>
<pre><code>Mobility: (2,362 - 1,864) / (29,512 - 25,111) = 498 / 4,401 = 11.3% incremental
Delivery: (1,057 - 811)   / (28,539 - 23,322) = 246 / 5,217 =  4.7% incremental
Average margins: Mobility 8.0%, Delivery 3.7%</code></pre>
<p>Each new Mobility dollar earns more than the average dollar: fixed costs (tech, insurance overhead, local ops) are being spread. Delivery incremental margin is also above its average, but still under half of Mobility because couriers, merchant discounts and grocery picking cost more per booking dollar. The strategic read: Delivery is the growth engine, Mobility is the profit engine, and the mix shift toward Delivery quietly caps blended margin expansion.</p></div>

<div class="callout example"><span class="lbl">Worked example 3 · Cash conversion and capital return</span>
<pre><code>FCF / adjusted EBITDA = 2,535 / 2,963 = 86%
Buybacks / FCF (Q3) = 750 / 2,535 = 30%; 9-month buybacks 4,279
Cash and short-term investments: $10.1B</code></pre>
<p>Uber is asset-light: capex was only $104M in the quarter, so most EBITDA turns into cash. Compare <a onclick="show('google-deep-dive')">Google</a>, where AI capex pushed free cash flow negative. The risk to this profile is autonomy: if Uber ever has to own or finance vehicle fleets, capex intensity rises and the asset-light story changes.</p></div>

<h3>4 · Strategic bets</h3>
<table>
<tr><th>Bet</th><th>What Uber is doing</th><th>Metric S&amp;O watches</th><th>Key risk</th></tr>
<tr><td><b>Autonomous vehicles</b></td><td>Platform for AV partners (Waymo, Zoox in Las Vegas, Pony.ai, Nvidia, Lucid and Nuro and others). CEO: about 700 fully driverless vehicles on Uber by end of 2026, over 2,000 in 2027.</td><td>Utilization per AV (trips per vehicle per day), cost per mile vs human driver, share of AV trips in launch cities</td><td>Partners go direct (own app) and Uber becomes only a demand channel with a thinner take</td></tr>
<tr><td><b>Uber One</b></td><td>Cross-product membership (about 55M members per recent disclosures), free delivery and ride discounts</td><td>Member frequency, multi-product rate, retention vs non-members, net cost of benefits</td><td>Benefits subsidize trips members would have taken anyway</td></tr>
<tr><td><b>Delivery beyond restaurants</b></td><td>Grocery and retail, plus ads on Uber Eats</td><td>Grocery GB share, ads revenue as % of Delivery GB, basket size</td><td>Competition with DoorDash (which is buying Instacart) and Amazon</td></tr>
<tr><td><b>Supply growth</b></td><td>Shifting incentives from rider discounts to driver pay after Q3 international undersupply</td><td>Supply hours, unfulfilled requests, cost per incremental hour</td><td>Incentive spend erodes the margin gains above</td></tr>
<tr><td><b>Freight</b></td><td>Digital freight brokerage, now loss-narrowing</td><td>GB per load, gross margin per load, breakeven timing</td><td>Freight cycle; small relative to the core</td></tr>
</table>

<h3>5 · What S&amp;O teams at Uber work on</h3>
<table>
<tr><th>Team type</th><th>Typical problem</th><th>Your bridge from engineering</th></tr>
<tr><td>Regional / city ops strategy</td><td>Why did ETAs rise in a city? Where to spend next quarter incentive budget?</td><td>Root-cause analysis on noisy data, like a fab yield excursion</td></tr>
<tr><td>Marketplace strategy</td><td>Pricing and incentive tests, supply-demand balance, surge policy</td><td>Control loops and feedback systems</td></tr>
<tr><td>Membership and cross-sell</td><td>Uber One benefit design, holdout measurement</td><td>Experiment design, A/B tooling</td></tr>
<tr><td>AV / new mobility BizOps</td><td>Partner economics, fleet utilization, launch readiness by city</td><td>Vehicle and telematics domain knowledge (a real differentiator)</td></tr>
<tr><td>Delivery growth and ads</td><td>Grocery launch playbooks, merchant ads ROI</td><td>Metric definitions and data pipelines</td></tr>
</table>
<div class="callout tip"><span class="lbl">Interview emphasis</span>Uber S&amp;O interviews are known for analytical cases rooted in marketplace mechanics (supply shortage, incentive ROI, pricing in a city), Excel or SQL modeling exercises, and probing on how you trade off rider, earner and merchant outcomes. Expect follow-ups like "how would you know the incentive caused that?" Bring your Hyundai telematics work into AV questions: fleet uptime, sensor data and remote operations are exactly what AV ops teams care about.</div>

<h3>6 · Drill: AV unit economics (attempt first)</h3>
<div class="callout"><span class="lbl">Prompt (illustrative numbers)</span>An AV partner proposes adding 500 vehicles in one US city. Each vehicle can run 18 hours a day. Assume average gross booking per trip of $18, 2.2 trips per vehicle-hour at full demand, and that Uber keeps 20% of GB as its fee. Uber provides demand only; the partner owns the cars. Estimate Uber annual net revenue from this fleet and name the one metric you would put in the weekly business review.</div>
<details><summary>Show model answer</summary>
<pre><code>Trips per vehicle per day = 18 h x 2.2 = 39.6 (at full demand)
Realistic utilization 60% -> 23.8 trips per vehicle per day
Fleet trips per year = 500 x 23.8 x 365 = 4.34M
GB = 4.34M x $18 = $78M; Uber fee at 20% = $15.6M per year</code></pre>
<p><b>Read:</b> The fleet is small relative to Mobility (about $29.5B GB a quarter), so the case is strategic, not financial: it secures supply in peak hours and positions Uber as the default demand layer. The WBR metric is <b>trips per vehicle per day</b> (utilization), because it determines whether the partner stays on Uber or builds its own app. Common mistake: assuming 100% utilization, or forgetting that AV trips may cannibalize human-driver trips, so incremental GB is lower than gross GB.</p>
</details>

<h3>7 · Common mistakes in Uber conversations</h3>
<table>
<tr><th>Mistake</th><th>Better</th></tr>
<tr><td>Quoting revenue growth as the headline</td><td>Lead with GB, trips and segment margin as % of GB; note the business model change</td></tr>
<tr><td>Treating Uber as a ride-hailing company</td><td>Delivery is nearly half of GB and growing faster</td></tr>
<tr><td>Saying AVs will "replace drivers" soon</td><td>Hundreds to low thousands of AVs vs millions of earners; hybrid network for years</td></tr>
<tr><td>Ignoring the earner side</td><td>Every pricing or promo idea must say what happens to earner hours and earnings</td></tr>
</table>

<div class="quiz" data-a="2">
  <div class="q">Self-check: Mobility revenue fell 2% while Mobility gross bookings rose 18%. What is the most likely explanation?</div>
  <button class="opt">Riders took fewer trips</button>
  <button class="opt">Uber cut prices sharply</button>
  <button class="opt">Business model and accounting changes reduced revenue recognized per booking dollar</button>
  <button class="opt">Freight losses were booked in Mobility</button>
  <div class="exp">Trips and bookings grew. Uber said business model changes reduced total revenue growth by about 8 points, so revenue understates underlying growth.</div>
</div>

<div class="quiz" data-a="1">
  <div class="q">Self-check: Mobility incremental margin is about 11% while its average margin is 8%. What does that tell you?</div>
  <button class="opt">Costs are growing faster than bookings</button>
  <button class="opt">Operating leverage: new bookings carry less fixed cost, so margins should keep rising if mix holds</button>
  <button class="opt">Mobility is losing share</button>
  <button class="opt">Incentives were cut to zero</button>
  <div class="exp">When incremental margin exceeds average margin, the average climbs. The caution is mix: faster-growing Delivery has a lower margin.</div>
</div>
`});
</script>

<script>
chapter({part:"Part IV · Marketplaces", id:"marketplace-dynamics", num:"13", title:"Marketplace Dynamics: Liquidity, Take Rate, Supply-Demand Balance and Network Effects", mins:20, tag:"Framework · Marketplaces", html:`
<p>Three of your five target companies (DoorDash, Uber, and the ads side of Google) are marketplaces, and Spotify behaves like one between listeners and rights holders. Marketplace S&amp;O work keeps returning to four questions: <b>Is the market liquid? Is the take rate right? Is supply balanced with demand right now, in this place? Do network effects actually protect us?</b> This chapter gives you a vocabulary and a set of models for each.</p>

<h3>1 · The marketplace flywheel</h3>
<div class="diagwrap">
<svg viewBox="0 0 760 230" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="13">
  <defs><marker id="arrMk13" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#93a1b3"/></marker></defs>
  <g fill="#1b232e" stroke="#f5a524" stroke-width="1.5">
    <rect x="20" y="20" width="170" height="60" rx="10"/><rect x="295" y="20" width="170" height="60" rx="10"/>
    <rect x="570" y="20" width="170" height="60" rx="10"/><rect x="570" y="150" width="170" height="60" rx="10"/>
    <rect x="295" y="150" width="170" height="60" rx="10"/><rect x="20" y="150" width="170" height="60" rx="10"/>
  </g>
  <g fill="#e8eef5" text-anchor="middle">
    <text x="105" y="46">More demand</text><text x="105" y="64" font-size="11" fill="#93a1b3">orders, trips, searches</text>
    <text x="380" y="46">Higher utilization</text><text x="380" y="64" font-size="11" fill="#93a1b3">earnings per supply hour</text>
    <text x="655" y="46">More supply</text><text x="655" y="64" font-size="11" fill="#93a1b3">drivers, Dashers, merchants</text>
    <text x="655" y="176">Better liquidity</text><text x="655" y="194" font-size="11" fill="#93a1b3">faster ETAs, more selection</text>
    <text x="380" y="176">Better experience</text><text x="380" y="194" font-size="11" fill="#93a1b3">higher conversion, retention</text>
    <text x="105" y="176">Lower unit cost</text><text x="105" y="194" font-size="11" fill="#93a1b3">less idle time, less incentive</text>
  </g>
  <g stroke="#93a1b3" stroke-width="1.5" marker-end="url(#arrMk13)">
    <line x1="190" y1="50" x2="290" y2="50"/><line x1="465" y1="50" x2="565" y2="50"/>
    <line x1="655" y1="80" x2="655" y2="145"/><line x1="570" y1="180" x2="470" y2="180"/>
    <line x1="295" y1="180" x2="195" y2="180"/><line x1="105" y1="150" x2="105" y2="85"/>
  </g>
</svg>
</div>
<p>The flywheel runs in both directions. When supply is short, ETAs rise, conversion falls, demand drops, earnings per hour fall, and more supply leaves. Most marketplace S&amp;O problems are about catching a flywheel that has started to spin backward in one city, one daypart or one vertical.</p>

<h3>2 · Liquidity: the metric that matters most</h3>
<p><b>Liquidity</b> is the probability that a buyer who shows up gets a good match quickly, and that a seller who shows up gets work. It is local (a city, a zone, a category) and time-specific (Friday 7pm is not Tuesday 3pm). Averages hide illiquid pockets.</p>
<table>
<tr><th>Company</th><th>Demand-side liquidity metric</th><th>Supply-side liquidity metric</th><th>Typical lever</th></tr>
<tr><td><b>Uber Mobility</b></td><td>Request fulfillment rate, ETA, surge share of trips</td><td>Utilization (time on trip / online time), earnings per hour</td><td>Surge, driver incentives, dispatch radius</td></tr>
<tr><td><b>DoorDash / Uber Eats</b></td><td>Selection (merchants in range), delivery time, order conversion</td><td>Dasher active time, orders per Dasher hour, earnings per active hour</td><td>Merchant acquisition, pay boosts, batching</td></tr>
<tr><td><b>Google Ads</b></td><td>Share of queries showing relevant ads (coverage)</td><td>Advertiser ROI, auction density (bidders per query)</td><td>Ad formats, Smart Bidding, new surfaces like AI Mode</td></tr>
<tr><td><b>Spotify</b></td><td>Search success, share of streams from recommendations</td><td>Creator and label payouts, podcast and audiobook catalog depth</td><td>Personalization, Marquee and Discovery Mode, catalog deals</td></tr>
</table>
<div class="callout tip"><span class="lbl">Interview move</span>When a case says "orders are down in a region", ask for liquidity by zone and hour before anything else. A 5% regional decline is often a 30% decline in three illiquid zones at dinner peak, plus flat everywhere else. That changes the fix from "national marketing" to "targeted supply incentives".</div>

<h3>3 · Supply-demand balance as a control loop</h3>
<p>As a systems engineer you already think in feedback loops. A ride or delivery marketplace is a control system: the <b>setpoint</b> is a target ETA or fulfillment rate, the <b>sensor</b> is real-time open requests vs available supply, and the <b>actuators</b> are price (surge, delivery fees), supply incentives (boosts, quests) and dispatch rules (batching, radius).</p>
<table>
<tr><th>Lever</th><th>Response time</th><th>Cost</th><th>Side effect to watch</th></tr>
<tr><td>Dynamic pricing (surge)</td><td>Seconds to minutes</td><td>Paid by consumers</td><td>Demand suppression, brand and regulatory risk</td></tr>
<tr><td>Short-term supply incentives</td><td>Hours</td><td>Paid by the platform</td><td>Inframarginal spend (paying for hours that would have happened anyway)</td></tr>
<tr><td>Batching and dispatch radius</td><td>Immediate</td><td>Near zero</td><td>Longer delivery times, worse food quality</td></tr>
<tr><td>Supply acquisition (onboarding)</td><td>Weeks</td><td>High fixed cost per earner</td><td>Oversupply later lowers earnings per hour and churns earners</td></tr>
<tr><td>Demand promos</td><td>Days</td><td>Paid by platform or merchant</td><td>Makes undersupply worse if supply is the constraint</td></tr>
</table>
<div class="callout warn"><span class="lbl">Classic mistake</span>Running a demand promotion in a supply-constrained market. You pay to create orders that then wait 20 minutes or go unfilled, which damages retention of exactly the customers you just paid to acquire. Always ask which side is the binding constraint first.</div>

<h3>4 · Take rate: how to set it and how to defend it</h3>
<p>Take rate = platform revenue / gross value transacted. It is not one number but a stack: merchant commission, consumer fees, ads, membership fees, minus refunds and promotions.</p>
<pre><code>Effective take rate = (commission + consumer fees + ads + other) / GOV
Breakeven GOV retention for a take-rate increase = old take rate / new take rate
Example: 12% -> 14%  =>  12 / 14 = 85.7%, so you can lose up to 14.3% of GOV before revenue falls</code></pre>
<p>Revenue breakeven is a low bar. Contribution breakeven is stricter because lost orders also take away density (fewer orders per Dasher hour means higher cost per order on the orders you keep).</p>

<div class="callout example"><span class="lbl">Worked example (illustrative numbers)</span>
<p>A delivery marketplace does $100M monthly GOV in a metro at a 12% take rate (revenue $12.0M) with a $40 average order. It proposes raising merchant commission so the take rate becomes 14%. At constant GOV that looks like +$2.0M a month (+16.7%).</p>
<table>
<tr><th>Scenario</th><th>GOV</th><th>Take rate</th><th>Revenue</th><th>Change vs today</th></tr>
<tr><td>Today</td><td>$100.0M</td><td>12%</td><td>$12.00M</td><td>baseline</td></tr>
<tr><td>First-order: 8% of GOV lost as merchants leave or raise menu prices</td><td>$92.0M</td><td>14%</td><td>$12.88M</td><td>+$0.88M (+7.3%)</td></tr>
<tr><td>Second-order: lower selection cuts consumer orders a further 3%</td><td>$89.2M</td><td>14%</td><td>$12.49M</td><td>+$0.49M (+4.1%)</td></tr>
<tr><td>Third-order: lower density adds $0.15 delivery cost on about 2.23M orders</td><td>$89.2M</td><td>14%</td><td>$12.49M, less $0.33M cost</td><td>about +$0.16M net</td></tr>
</table>
<p><b>Read:</b> the headline +$2.0M shrinks to about +$0.16M once second- and third-order effects are counted, and the move hands share to a competitor. A better recommendation is often a <b>tiered</b> structure (merchants choose lower commission with less reach, or higher commission with more marketing), which is how DoorDash and Uber Eats price merchant plans.</p>
</div>

<h3>5 · Network effects: real, local, and often overstated</h3>
<table>
<tr><th>Type</th><th>Meaning</th><th>Example</th><th>How strong is the moat?</th></tr>
<tr><td>Cross-side</td><td>More users on one side make the platform better for the other side</td><td>More riders raise driver earnings; more drivers cut rider ETAs</td><td>Strong but <b>local</b>: you must win city by city</td></tr>
<tr><td>Same-side (positive)</td><td>More users on the same side make it better for each other</td><td>Shared playlists, social features</td><td>Moderate</td></tr>
<tr><td>Same-side (negative)</td><td>Congestion</td><td>Too many drivers compete for the same trips</td><td>Limits how much supply you want</td></tr>
<tr><td>Data network effect</td><td>More usage improves the product via data</td><td>Search ranking, ad targeting, ETA prediction, recommendations</td><td>Strong at scale, but diminishing returns</td></tr>
<tr><td>Ecosystem / integration</td><td>Third parties build on the platform</td><td>Datadog integrations; Google Cloud partners</td><td>Switching cost more than a true network effect</td></tr>
</table>
<p>Test a claimed network effect with three questions: (1) <b>Does it plateau?</b> Once a city has 3-minute ETAs, more drivers add little. (2) <b>Is it local or global?</b> Local effects can be attacked city by city by a well-funded entrant. (3) <b>Is multi-homing cheap?</b> Drivers and restaurants run Uber and DoorDash side by side, which weakens the moat and keeps take rates in check.</p>

<div class="callout hy"><span class="lbl">Live strategic question · AI agents as demand aggregators</span>In November 2026 Google expanded a Gemini beta that can act through Android apps to order food and request rides to the UK, India and Japan, and on November 23 it extended Personal Intelligence in AI Mode to Google Drive, Wallet and the Gemini app. If an AI agent owns the customer intent, the marketplace can become a back-end supplier: it keeps liquidity but loses the front door, ad inventory and membership upsell. For DoorDash and Uber S&amp;O teams this is a live question about partnering vs blocking, attribution, and how take rate holds up when an aggregator sits in front. (Sources: <a href="https://ppc.land/googles-gemini-can-now-use-food-and-ride-apps-for-people-in-3-more-countries/" target="_blank">PPC Land</a>, <a href="https://9to5google.com/2026/11/23/ai-mode-wallet-gemini" target="_blank">9to5Google</a>.)</div>

<h3>6 · Drill: is this city healthy? (attempt first)</h3>
<div class="callout"><span class="lbl">Prompt (illustrative numbers)</span>A ride-hailing city shows, week over week: requests +6%, completed trips +1%, online driver hours flat, utilization 62% to 66%, average ETA 4.8 to 6.1 minutes, surge share of trips 9% to 15%, driver earnings per hour +7%. Is the city healthy? What would you do this week and this quarter?</div>
<details><summary>Show model answer</summary>
<p><b>Diagnosis:</b> demand is growing and supply is flat, so the market is undersupplied. Fulfillment fell (trips +1% vs requests +6%, roughly 5 points of unmet demand). Rising utilization and earnings per hour look good in isolation but here signal scarcity, not efficiency. Surge share rising from 9% to 15% means price is doing the balancing work and suppressing demand.</p>
<pre><code>Unfilled demand ~ requests growth - trips growth = ~5% of requests
Supply hours needed to restore ETA ~ +5% to +7% (utilization back near 62%)</code></pre>
<p><b>This week:</b> targeted supply incentives in the worst zones and dayparts (not citywide), driver reactivation messaging that highlights the +7% earnings per hour, and hold demand promos. <b>This quarter:</b> onboarding funnel review (background-check backlog, vehicle supply), a test of earnings guarantees in peak windows, and a check on whether a competitor is pulling drivers. <b>Metric for the WBR:</b> fulfillment rate by zone and hour, with ETA as the guardrail.</p>
<p><b>Common mistakes:</b> celebrating higher utilization; launching rider promos; using a citywide average when the problem is concentrated in a few zones.</p>
</details>

<h3>7 · Common marketplace mistakes</h3>
<table>
<tr><th>Mistake</th><th>Better</th></tr>
<tr><td>Measuring liquidity with city or national averages</td><td>Zone by hour heat maps; track the share of hours below a fulfillment threshold</td></tr>
<tr><td>Treating take rate as only commission</td><td>Model the full stack (fees, ads, membership, promos) and the second-order volume effects</td></tr>
<tr><td>Assuming network effects are permanent</td><td>Test for plateau, locality and multi-homing</td></tr>
<tr><td>Growing one side without the other</td><td>Find the binding constraint first, then invest on that side</td></tr>
<tr><td>Ignoring the merchant or earner side in a consumer case</td><td>For every lever, state what happens to each side</td></tr>
</table>

<div class="quiz" data-a="1">
  <div class="q">Self-check: A marketplace raises take rate from 10% to 12.5%. What is the maximum share of GOV it can lose before revenue falls?</div>
  <button class="opt">10%</button>
  <button class="opt">20%</button>
  <button class="opt">25%</button>
  <button class="opt">12.5%</button>
  <div class="exp">Breakeven GOV retention = 10 / 12.5 = 80%, so it can lose up to 20%. Contribution breakeven is stricter because density falls too.</div>
</div>

<div class="quiz" data-a="3">
  <div class="q">Self-check: Requests are up 8%, trips up 2%, ETAs and surge are rising. Which action is most likely wrong?</div>
  <button class="opt">Targeted driver incentives at peak in the worst zones</button>
  <button class="opt">Driver reactivation campaign</button>
  <button class="opt">Reviewing the onboarding backlog</button>
  <button class="opt">A citywide rider discount to grow trips</button>
  <div class="exp">Supply is the binding constraint. A rider discount adds demand the market cannot serve and worsens ETAs and fulfillment.</div>
</div>
`});
</script>

<script>
chapter({part:"Part VI · Company Deep-Dives", id:"datadog-deep-dive", num:"14", title:"Datadog Deep-Dive: Usage-Based Observability, Land-and-Expand and AI Concentration", mins:20, tag:"Company · SaaS", html:`
<p>Datadog is the cleanest example among your five targets of a <b>usage-based, product-led, land-and-expand SaaS</b> business. If you can explain its revenue as customers × spend per customer × products per customer, and explain why a single AI customer moved the stock 16% in a day, you can handle most Datadog S&amp;O interview questions. Chapter 05 (the NRR case) covers retention mechanics; this chapter covers the whole business.</p>

<h3>1 · How Datadog makes money</h3>
<div class="diagwrap">
<svg viewBox="0 0 760 210" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="13">
  <defs><marker id="arrMk14" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#93a1b3"/></marker></defs>
  <g fill="#1b232e" stroke="#f5a524" stroke-width="1.5">
    <rect x="15" y="70" width="150" height="70" rx="10"/><rect x="215" y="70" width="150" height="70" rx="10"/>
    <rect x="415" y="70" width="150" height="70" rx="10"/><rect x="605" y="15" width="145" height="55" rx="10"/>
    <rect x="605" y="140" width="145" height="55" rx="10"/>
  </g>
  <g fill="#e8eef5" text-anchor="middle">
    <text x="90" y="100">Land</text><text x="90" y="118" font-size="11" fill="#93a1b3">free trial, one team,</text><text x="90" y="132" font-size="11" fill="#93a1b3">infra monitoring</text>
    <text x="290" y="100">Expand usage</text><text x="290" y="118" font-size="11" fill="#93a1b3">more hosts, logs,</text><text x="290" y="132" font-size="11" fill="#93a1b3">spans, workloads</text>
    <text x="490" y="100">Cross-sell</text><text x="490" y="118" font-size="11" fill="#93a1b3">APM, logs, security,</text><text x="490" y="132" font-size="11" fill="#93a1b3">AI observability, Bits AI</text>
    <text x="677" y="38">Annual commit</text><text x="677" y="56" font-size="11" fill="#93a1b3">volume discount</text>
    <text x="677" y="163">On-demand usage</text><text x="677" y="181" font-size="11" fill="#93a1b3">above commit, list price</text>
  </g>
  <g stroke="#93a1b3" stroke-width="1.5" marker-end="url(#arrMk14)">
    <line x1="165" y1="105" x2="210" y2="105"/><line x1="365" y1="105" x2="410" y2="105"/>
    <line x1="565" y1="95" x2="600" y2="50"/><line x1="565" y1="115" x2="600" y2="160"/>
  </g>
</svg>
</div>
<p>Customers are billed on consumption units (hosts, containers, ingested and indexed log GB, APM spans, sessions, and so on). Most large customers sign an <b>annual commitment</b> at a discount and pay on-demand rates for usage above it. That gives Datadog two properties an operator must hold at the same time: revenue rises automatically when customers grow (no renewal needed), and revenue falls automatically when customers optimize (no churn needed).</p>

<h3>2 · Q3 2026 scorecard (reported Nov 4, 2026)</h3>

<h3>3 · Worked examples on the real numbers</h3>
<div class="callout example"><span class="lbl">Worked example 1 · Where does 35% growth come from?</span>
<pre><code>Revenue growth        = (1 + customer growth) x (1 + revenue per customer growth) - 1
1.35                  = 1.047 x (1 + g)
g (rev per customer)  = 1.35 / 1.047 - 1 = ~29%</code></pre>
<p>Almost all growth comes from existing customers spending more, not from new logos. That is what land-and-expand looks like in the numbers, and it is why NRR is the single most watched Datadog metric.</p>
</div>

<div class="callout example"><span class="lbl">Worked example 2 · The shape of the customer base (approximate)</span>
<p>Use annualized quarterly revenue as a rough ARR proxy: $1.20B × 4 = ~$4.8B.</p>
<table>
<tr><th>Segment</th><th>Customers</th><th>Share of ARR</th><th>Approx. ARR</th><th>Approx. ARR per customer</th></tr>
<tr><td>$100K+ customers</td><td>~4,860</td><td>~91%</td><td>~$4.37B</td><td>~$900K</td></tr>
<tr><td>All others</td><td>~28,640</td><td>~9%</td><td>~$0.43B</td><td>~$15K</td></tr>
</table>
<p><b>Read:</b> about 15% of customers produce about 91% of revenue. The long tail is mostly a pipeline of future large customers (the land), and the business is run on the top cohort (the expand). An S&amp;O analyst at Datadog spends far more time on enterprise expansion and commit structure than on self-serve acquisition.</p>
</div>

<div class="callout example"><span class="lbl">Worked example 3 · Why one customer moved the stock (illustrative numbers)</span>
<p>Suppose a large AI customer contributed $60M of Q3 revenue (5%), running 50% above its contractual minimum. If it falls to its minimum, its revenue drops to $40M, a $20M sequential headwind. If the rest of the business grows 4% sequentially ($1.14B × 4% = ~$46M), total Q4 revenue grows about $26M, but a second large customer optimizing by $20M would bring sequential growth near zero. That is roughly the flat Q4 guide Datadog gave. The lesson: in usage-based SaaS, <b>concentration plus optionality to cut usage</b> makes guidance conservative and the stock volatile, even when the base business is accelerating.</p>
</div>
<p>Rule of 40 check: 35% growth + 21% FCF margin = <b>56</b>, well above the bar (see chapter 09).</p>

<h3>6 · Drill: the early-renewal trade-off (attempt first)</h3>
<div class="callout"><span class="lbl">Prompt (illustrative numbers)</span>A large customer pays $10M a year on a $8M commit plus $2M on-demand. It offers to renew a year early at a $14M commit for two years, but wants a 20% unit-price discount on all usage. Its usage is growing 30% a year. Should Datadog accept?</div>
<details><summary>Show model answer</summary>
<pre><code>No deal, next year:  usage at list = 10 x 1.3  = $13.0M (risk: it optimizes)
Deal, next year:     usage at discount = 13.0 x 0.8 = $10.4M -> billed max(14, 10.4) = $14.0M
Deal, year 2:        13.0 x 1.3 x 0.8 = $13.5M -> billed $14.0M (commit still binds)</code></pre>
<p><b>Recommendation:</b> accept, with guardrails. The commit exceeds the discounted usage in both years, so Datadog locks in more revenue than the likely usage and removes the downside of optimization. The cost is upside: if usage grows faster than 30%, discounted overage earns less than list. Ask for multi-product adoption (for example logs or security) as part of the deal, and model a downside case where usage grows 10%.</p>
<p><b>Common mistakes:</b> comparing only list-price revenue; ignoring that a commit is a floor; forgetting that early renewals pull forward discounts, which Datadog flagged as a near-term revenue headwind in Q3 2026.</p>
</details>
